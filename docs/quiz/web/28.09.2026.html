const DATE="28.09.2026";
const Q=[{"n": 1, "d": "łatwe", "c": "LangSmith", "p": "Która zmienna środowiskowa włącza automatyczny tracing wywołań LangChain do LangSmith?", "o": {"A": "LANGSMITH_TRACING ustawione na true", "B": "OPENAI_API_KEY ustawione na true", "C": "BLACK_FORMAT ustawione na true", "D": "UV_SYNC ustawione na true"}, "correct": "A", "why": "LANGSMITH_TRACING=true włącza automatyczny tracing LangChain → LangSmith.", "lesson": {"correct": "Tracing to śledzenie tego, co robi aplikacja z modelem. LangSmith zbiera takie ślady, gdy tracing jest włączony. Włącza się go zmienną LANGSMITH_TRACING ustawioną na true. Dzięki temu wywołania łańcucha mogą trafiać do platformy obserwowalności bez ręcznego dopisywania dekoratorów.", "example": "Wyobraź sobie włącznik światła w pokoju. Klucz API to jak klucz do domu, a LANGSMITH_TRACING=true to właśnie włącznik. Dopiero gdy włącznik jest w pozycji true, ślady z chain.invoke zaczynają być wysyłane. Bez włącznika sam klucz nic nie podświetli.", "remember": "Tracing włącza LANGSMITH_TRACING=true — to włącznik, nie sam klucz.", "wrong": {"B": "OPENAI_API_KEY służy do autoryzacji wywołań modelu OpenAI. Nie włącza tracingu LangSmith.", "C": "Black formatuje kod Pythona. Nie ma związku z wysyłaniem trace’ów do LangSmith.", "D": "uv sync instaluje zależności projektu. Nie steruje tracingiem wywołań LLM."}}}, {"n": 2, "d": "łatwe", "c": "Narzędzia", "p": "Które polecenie pobiera lokalnie model Gemma 3 w wariancie 270M przez Ollama?", "o": {"A": "ollama list gemma3:270m", "B": "uv sync gemma3:270m", "C": "ollama pull gemma3:270m", "D": "python install gemma3:270m"}, "correct": "C", "why": "Polecenie ollama pull gemma3:270m pobiera wskazany wariant modelu.", "lesson": {"correct": "Ollama zarządza lokalnymi modelami. Polecenie pull pobiera wybrany model na komputer. Nazwa gemma3:270m wskazuje rodzinę i mały wariant. Po pobraniu model pojawia się na liście i można go uruchomić.", "example": "Chcesz mieć Gemmę 3 lokalnie. Wpisujesz ollama pull gemma3:270m i czekasz na pobranie. Potem ollama list pokazuje model, a ollama run go uruchamia.", "remember": "Pull pobiera, list pokazuje, run uruchamia.", "wrong": {"A": "list pokazuje modele już dostępne lokalnie. Nie jest poleceniem pobierania.", "B": "uv sync instaluje pakiety Pythona z lockfile. Nie pobiera modeli Ollamy.", "D": "Nie ma takiego standardowego polecenia do pobierania Gemmy. Tym zajmuje się ollama pull."}}}, {"n": 3, "d": "średnie", "c": "LangSmith", "p": "Co jest potrzebne oprócz LANGSMITH_TRACING=true, aby ślady wywołań były wysyłane do LangSmith?", "o": {"A": "Wyłącznie plik requirements bez żadnych kluczy", "B": "Ustawiony LANGSMITH_API_KEY", "C": "Wyłącznie temperatura modelu równa 1", "D": "Wyłącznie baza wektorowa Pinecone"}, "correct": "B", "why": "Do wysyłania trace’ów potrzebne są jednocześnie LANGSMITH_TRACING=true oraz LANGSMITH_API_KEY.", "lesson": {"correct": "Sam włącznik tracingu nie wystarczy. LangSmith musi też wiedzieć, na jakie konto wysyłać dane. Do tego służy LANGSMITH_API_KEY. Oba warunki działają razem: tracing włączony i klucz obecny.", "example": "Masz LANGSMITH_TRACING=true, ale pusty LANGSMITH_API_KEY. Uruchamiasz łańcuch i nie widzisz trace’ów. Dopisujesz poprawny klucz, ładujesz środowisko i dopiero wtedy ślady pojawiają się w projekcie LangSmith.", "remember": "Tracing = włącznik true + klucz LangSmith.", "wrong": {"A": "Lista zależności nie zastępuje klucza API. Bez LANGSMITH_API_KEY ślady nie mają autoryzacji.", "C": "Temperatura steruje losowością odpowiedzi modelu. Nie włącza ani nie autoryzuje tracingu.", "D": "Pinecone to baza wektorowa do RAG. Nie jest warunkiem wysyłania trace’ów do LangSmith."}}}, {"n": 4, "d": "łatwe", "c": "LangChain", "p": "Czym jest PromptTemplate w programistycznym dostępie do LLM?", "o": {"A": "Bazą wektorową do wyszukiwania podobieństwa", "B": "Narzędziem do trenowania wag modelu", "C": "Serwerem lokalnych modeli", "D": "Opakowaniem promptu, które przyjmuje parametry i formatuje wejście"}, "correct": "D", "why": "PromptTemplate jest opakowaniem promptu, które przyjmuje parametry i formatuje wejście dla modelu.", "lesson": {"correct": "PromptTemplate to szablon tekstu z miejscami do wypełnienia. Program podaje wartości, a szablon składa gotowy prompt. Ten sam szablon działa wiele razy z innymi danymi. Jako Runnable może wejść do łańcucha z modelem.", "example": "Szablon mówi: na podstawie {information} zrób krótkie podsumowanie i dwa fakty. Raz podajesz biografię osoby A, raz osoby B. Format zadania zostaje ten sam.", "remember": "PromptTemplate to foremka, a parametry to nadzienie.", "wrong": {"A": "Baza wektorowa służy do wyszukiwania podobieństwa w RAG. PromptTemplate tylko przygotowuje tekst.", "B": "Szablon nie trenuje modelu i nie zmienia wag. Formatuje dane przed wywołaniem.", "C": "Serwerem lokalnych modeli może być Ollama. PromptTemplate buduje prompt, nie uruchamia serwera."}}}, {"n": 5, "d": "trudne", "c": "LangSmith", "p": "Jak w typowej konfiguracji kursu uruchamia się tracing LangSmith dla wywołania łańcucha?", "o": {"A": "Trzeba ręcznie opakować każdą funkcję własnym dekoratorem logującym", "B": "Trzeba przepisać łańcuch na LangGraph", "C": "Trzeba zapisać klucz OpenAI w kodzie źródłowym", "D": "Wystarczy load_dotenv() przy ustawionych LANGSMITH_TRACING i LANGSMITH_API_KEY — bez dodatkowych dekoratorów"}, "correct": "D", "why": "Przy poprawnych zmiennych wystarczy load_dotenv() przed klientem LLM; trace pojawia się automatycznie bez dekoratorów.", "lesson": {"correct": "LangChain potrafi sam wysyłać ślady, gdy zmienne środowiska są ustawione. Najpierw ładujesz .env przez load_dotenv. Potem tworzysz model i wywołujesz łańcuch. Nie musisz dokładać osobnych dekoratorów ani ręcznych callbacków tylko po to, by tracing działał.", "example": "Masz w .env LANGSMITH_TRACING=true i LANGSMITH_API_KEY. Skrypt woła load_dotenv, buduje prompt | llm i robi invoke. W LangSmith pojawia się trace z wejściem i wyjściem, choć w kodzie nie ma dekoratora @trace.", "remember": "Env + load_dotenv, a invoke samo zostawia ślad.", "wrong": {"A": "Notatki podkreślają brak konieczności dekoratorów przy automatycznym tracingu. Ręczne opakowywanie nie jest wymagane.", "B": "LangGraph buduje grafy przepływu. Tracing LangSmith nie wymaga przepisywania łańcucha na graf.", "C": "Klucze mają być w zmiennych środowiskowych, nie w kodzie. To kwestia bezpieczeństwa, a nie warunek tracingu."}}}, {"n": 6, "d": "średnie", "c": "LLM", "p": "Co oznacza, że Gemma 3 jest modelem open-weight?", "o": {"A": "Wagi modelu są dostępne do pobrania, więc model można uruchomić we własnym środowisku", "B": "Model zawsze działa bez pamięci RAM", "C": "Każda odpowiedź modelu jest publiczna", "D": "Model może działać wyłącznie przez płatne API"}, "correct": "A", "why": "Open-weight oznacza dostępność wag do pobrania i możliwość uruchomienia modelu we własnym środowisku.", "lesson": {"correct": "Wagi to liczby, które opisują zachowanie modelu. W modelu open-weight można je pobrać. Dzięki temu uruchomisz model lokalnie, na serwerze albo w wybranej chmurze. To nie usuwa wymagań sprzętowych i nie gwarantuje najlepszej jakości.", "example": "Pobierasz Gemmę 3 przez Ollamę. Pliki zostają na Twoim komputerze. Pytania mogą być liczone lokalnie, bez wysyłania każdej prośby do zewnętrznego API.", "remember": "Open-weight: wagi możesz pobrać i wybrać miejsce uruchomienia.", "wrong": {"B": "Każdy uruchomiony model potrzebuje zasobów, np. RAM lub VRAM. Dostępne wagi tego nie kasują.", "C": "Open-weight dotyczy dostępności wag, nie publiczności rozmów. Lokalnie dane mogą zostać u Ciebie.", "D": "Właśnie dostępność wag pozwala uniknąć obowiązkowego płatnego API."}}}, {"n": 7, "d": "łatwe", "c": "LangSmith", "p": "Co się dzieje, gdy nie ustawisz LANGSMITH_PROJECT przy włączonym tracingu?", "o": {"A": "Tracing całkowicie przestaje działać", "B": "Powstaje projekt o nazwie default", "C": "Model automatycznie zmienia temperature na 0", "D": "Ollama usuwa lokalne modele"}, "correct": "B", "why": "LANGSMITH_PROJECT jest opcjonalny; bez niego powstaje projekt default.", "lesson": {"correct": "LANGSMITH_PROJECT nadaje nazwę „szufladzie” na trace’y w LangSmith. Pole jest opcjonalne. Jeśli go nie podasz, platforma używa nazwy default. Tracing może działać, ale ślady lądują w domyślnym projekcie.", "example": "W jednym repo ustawiasz LANGSMITH_PROJECT=langchain-agentic-ai i widzisz ślady w tym projekcie. W innym zapominasz o zmiennej i wszystko wpada do default. Łatwo wtedy pomylić ćwiczenia z różnych lekcji.", "remember": "Bez LANGSMITH_PROJECT ślady idą do default.", "wrong": {"A": "Brak nazwy projektu nie wyłącza tracingu. Zmienia tylko miejsce, do którego trafiają ślady.", "C": "Temperatura modelu nie zależy od nazwy projektu LangSmith.", "D": "Konfiguracja LangSmith nie zarządza usuwaniem modeli Ollamy."}}}, {"n": 8, "d": "średnie", "c": "LangChain", "p": "Co dzieje się w łańcuchu LCEL zapisanych jako prompt | model?", "o": {"A": "Model jest trenowany na treści promptu", "B": "Operator tworzy automatycznie serwer MCP", "C": "Wynik wypełnienia szablonu staje się wejściem modelu w złożonym obiekcie Runnable", "D": "Historia rozmowy jest zawsze zapisywana w Pinecone"}, "correct": "C", "why": "LCEL przekazuje wynik jednego komponentu jako wejście następnego i tworzy z nich Runnable.", "lesson": {"correct": "Operator pionowej kreski składa kroki w kolejność. Najpierw szablon dostaje dane i buduje prompt. Potem wynik idzie do modelu. Całość to jeden Runnable wywoływany przez invoke.", "example": "Szablon ma miejsce {information}. Wywołujesz łańcuch ze słownikiem. Szablon wypełnia lukę, a model dostaje gotową instrukcję zamiast surowego, niesformatowanego bloku.", "remember": "LCEL pipe: wynik lewej strony podaj prawej.", "wrong": {"A": "Wywołanie łańcucha nie trenuje modelu. Model tylko generuje odpowiedź.", "B": "MCP to standard narzędzi i kontekstu. Operator LCEL go nie uruchamia.", "D": "Pinecone to baza wektorowa. Prosty łańcuch prompt|model nie zapisuje tam historii automatycznie."}}}, {"n": 9, "d": "trudne", "c": "LangSmith", "p": "Jak notatki opisują stare nazwy LANGCHAIN_TRACING_V2 i LANGCHAIN_API_KEY względem aktualnej konfiguracji?", "o": {"A": "Są jedynymi poprawnymi nazwami w projekcie kursu", "B": "Całkowicie wyłączają OpenAI", "C": "Nadal działają jako aliasy, ale w projekcie używamy LANGSMITH_*", "D": "Zastępują PromptTemplate w LCEL"}, "correct": "C", "why": "Stare nazwy LANGCHAIN_* działają jako aliasy; w projekcie stosujemy LANGSMITH_*.", "lesson": {"correct": "Nazwy zmiennych bywały inne w starszych materiałach. LANGCHAIN_TRACING_V2 i LANGCHAIN_API_KEY mogą nadal działać jako aliasy. W tym projekcie standardem są LANGSMITH_TRACING i LANGSMITH_API_KEY. Używanie jednego zestawu nazw zmniejsza pomyłki przy kopiowaniu konfiguracji.", "example": "W starym poradniku widzisz LANGCHAIN_API_KEY. W .env.example projektu są już LANGSMITH_*. Ustawiasz nowe nazwy i tracing działa zgodnie z aktualnymi notatkami.", "remember": "Aliasy mogą działać, ale w kursie celujemy w LANGSMITH_*.", "wrong": {"A": "W projekcie preferowane są LANGSMITH_*. Stare nazwy nie są jedynym poprawnym wyborem.", "B": "Te zmienne dotyczą LangSmith, nie wyłączają klienta OpenAI.", "D": "Nazwy zmiennych środowiskowych nie zastępują szablonów promptu ani LCEL."}}}, {"n": 10, "d": "łatwe", "c": "Narzędzia", "p": "Dlaczego klucza API nie należy zapisywać w kodzie ani commitować pliku .env?", "o": {"A": "Bo grozi ujawnieniem sekretu; klucz powinien zostać w zmiennej środowiskowej", "B": "Bo PromptTemplate przestanie być Runnable", "C": "Bo Ollama usunie lokalne modele", "D": "Bo temperature wzrośnie automatycznie"}, "correct": "A", "why": "Zapis sekretu w repozytorium grozi wyciekiem; klucz ma pozostać w zmiennej środowiskowej.", "lesson": {"correct": "Klucz API otwiera usługę na Twoim koncie. Jeśli trafi do Gita, ktoś może go zobaczyć i użyć. Dlatego trzymasz go w lokalnym .env lub innej zmiennej środowiska. Sam .env powinien być w .gitignore.", "example": "Program woła load_dotenv i czyta OPENAI_API_KEY. W repozytorium jest kod, ale nie ma prawdziwej wartości klucza. Szablon pustych nazw może być w .env.example.", "remember": "Sekret do środowiska, nigdy do kodu ani commita.", "wrong": {"B": "PromptTemplate pozostaje Runnable niezależnie od miejsca klucza. Problem to bezpieczeństwo.", "C": ".env nie steruje usuwaniem modeli Ollamy.", "D": "Temperature ustawiasz w konfiguracji modelu. Wyciek klucza jej nie podnosi."}}}, {"n": 11, "d": "średnie", "c": "LangSmith", "p": "Jaka jest typowa pułapka, gdy LANGSMITH_API_KEY jest ustawiony, ale brakuje LANGSMITH_TRACING=true?", "o": {"A": "Model OpenAI przestaje istnieć", "B": "PromptTemplate traci input_variables", "C": "uv sync odinstalowuje langchain", "D": "Klucz jest obecny, ale trace’y nie są wysyłane"}, "correct": "D", "why": "Bez LANGSMITH_TRACING=true klucz może być obecny, a ślady i tak nie zostaną wysłane.", "lesson": {"correct": "Ludzie często dopisują tylko klucz i myślą, że tracing już działa. Bez włącznika LANGSMITH_TRACING=true wysyłanie śladów pozostaje wyłączone. Klucz leży gotowy, ale nic nie wychodzi do LangSmith. Trzeba sprawdzić obie wartości.", "example": "W .env masz LANGSMITH_API_KEY, lecz brakuje LANGSMITH_TRACING=true. Uruchamiasz chain.invoke i panel LangSmith jest pusty. Dopisujesz true, restartujesz proces i ślady się pojawiają.", "remember": "Sam klucz bez TRACING=true = cisza w LangSmith.", "wrong": {"A": "Brak flagi tracingu nie kasuje modelu OpenAI. Dotyczy tylko wysyłania śladów.", "B": "input_variables szablonu nie zależą od LangSmith.", "C": "Menadżer pakietów nie odinstalowuje langchain z powodu tej pułapki konfiguracyjnej."}}}, {"n": 12, "d": "trudne", "c": "LLM", "p": "Dlaczego ważnej informacji nie warto chować w środku bardzo długiego kontekstu?", "o": {"A": "Środek kontekstu automatycznie zmienia się w embedding", "B": "Zjawisko lost in the middle sprawia, że model może gorzej wykorzystać informacje ze środka", "C": "Model czyta wyłącznie pierwszą wiadomość", "D": "Każda informacja w środku uruchamia tool calling"}, "correct": "B", "why": "Lost in the middle oznacza słabsze wykorzystanie informacji umieszczonych w środku długiego kontekstu.", "lesson": {"correct": "Model nie czyta długiego tekstu równo dobrze w każdym miejscu. Informacje ze środka bywają trudniejsze do zauważenia. To właśnie lost in the middle. Dlatego ważne dane stawia się bliżej początku lub końca albo skraca się kontekst.", "example": "W długiej rozmowie adres klienta siedzi na „stronie piętnastej”. Model może go przeoczyć. Gdy przeniesiesz adres obok bieżącego pytania, łatwiej go użyje.", "remember": "W długim kontekście środek łatwo ginie — ważne fakty trzymaj przy brzegach.", "wrong": {"A": "Embedding powstaje w osobnym kroku wektoryzacji. Położenie w środku tego nie robi samo.", "C": "Model może korzystać z wielu wiadomości, nie tylko z pierwszej.", "D": "Tool calling nie włącza się tylko dlatego, że coś leży w środku kontekstu."}}}, {"n": 13, "d": "średnie", "c": "LangSmith", "p": "Do czego służy zmienna LANGSMITH_ENDPOINT w konfiguracji projektu?", "o": {"A": "Wskazuje URL API LangSmith, np. https://api.smith.langchain.com", "B": "Ustawia temperature modelu chat", "C": "Wybiera bazę wektorową FAISS albo Chroma", "D": "Zastępuje plik .gitignore"}, "correct": "A", "why": "LANGSMITH_ENDPOINT podaje adres URL API LangSmith używany przy wysyłaniu trace’ów.", "lesson": {"correct": "Endpoint to adres serwisu, do którego program wysyła dane. LANGSMITH_ENDPOINT mówi klientowi, gdzie jest API LangSmith. W notatkach pojawia się m.in. adres US. Bez poprawnego adresu nawet dobry klucz może nie trafić we właściwe miejsce.", "example": "W .env ustawiasz LANGSMITH_ENDPOINT na https://api.smith.langchain.com. Po load_dotenv klient wie, dokąd wysyłać ślady. Reszta kodu łańcucha pozostaje bez zmian.", "remember": "ENDPOINT to adres drzwi LangSmith.", "wrong": {"B": "Temperature ustawiasz przy tworzeniu modelu, nie przez LANGSMITH_ENDPOINT.", "C": "Wybór FAISS czy Chroma dotyczy RAG, nie adresu API LangSmith.", "D": ".gitignore chroni sekrety i artefakty. Endpointem tego nie zastąpisz."}}}, {"n": 14, "d": "łatwe", "c": "LLM", "p": "Która cecha odróżnia agenta od samego pipeline’u RAG?", "o": {"A": "Agent zawsze korzysta z FAISS, a RAG nigdy", "B": "RAG samodzielnie planuje dowolną liczbę działań", "C": "Agent decyduje o kolejnych krokach i użyciu narzędzi, a RAG przede wszystkim dostarcza kontekst z dokumentów", "D": "Agent nie może korzystać z dokumentów"}, "correct": "C", "why": "RAG dostarcza kontekst z dokumentów; agent dodatkowo decyduje o krokach i narzędziach.", "lesson": {"correct": "RAG wyszukuje fragmenty i dokłada je do promptu. Model odpowiada na podstawie tej wiedzy. Agent ma pętlę decyzji i może wybierać narzędzia. Oba podejścia mogą współpracować, ale nie są tym samym.", "example": "RAG znajduje instrukcję zwrotu i przekazuje ją modelowi. Agent może znaleźć instrukcję, sprawdzić zamówienie w API i utworzyć zgłoszenie. To kolejne decyzje, nie tylko dostarczenie tekstu.", "remember": "RAG przynosi wiedzę, agent wybiera następne działanie.", "wrong": {"A": "FAISS to tylko jedna możliwa baza. Agent nie musi jej używać, a RAG właśnie może.", "B": "Samo RAG opisuje pobranie kontekstu. Planowanie działań to cecha agenta.", "D": "Agent może użyć retrievera i dokumentów jako narzędzia."}}}, {"n": 15, "d": "trudne", "c": "LangSmith", "p": "Dlaczego load_dotenv() powinno być wywołane przed utworzeniem klienta LLM, gdy chcesz korzystać z automatycznego tracingu?", "o": {"A": "Bo dopiero wtedy PromptTemplate staje się bazą wektorową", "B": "Bo zmienne LANGSMITH_* muszą trafić do środowiska procesu zanim LangChain zacznie wysyłać ślady", "C": "Bo inaczej Ollama zawsze nadpisze temperature", "D": "Bo invoke przestaje przyjmować słownik wejściowy"}, "correct": "B", "why": "load_dotenv() wczytuje LANGSMITH_* do środowiska procesu; bez tego automatyczny tracing nie ma kompletnej konfiguracji.", "lesson": {"correct": "Plik .env sam z siebie nie ustawia zmiennych w procesie. load_dotenv czyta plik i wstawia wartości do środowiska. Klient LangChain i tracing patrzą na te zmienne. Jeśli utworzysz LLM za wcześnie, konfiguracja tracingu może być jeszcze nieobecna.", "example": "Najpierw wołasz load_dotenv, potem tworzysz ChatOpenAI i łańcuch. invoke widzi już LANGSMITH_TRACING i klucz. Gdybyś odwrócił kolejność, proces mógłby nie znać tych wartości w chwili startu klienta.", "remember": "Najpierw załaduj .env, potem buduj klienta i łańcuch.", "wrong": {"A": "PromptTemplate nie staje się bazą wektorową przez load_dotenv.", "C": "Ollama nie nadpisuje temperature z powodu kolejności load_dotenv.", "D": "Kontrakt invoke ze słownikiem nie znika przez brak wcześniejszego load_dotenv."}}}, {"n": 16, "d": "średnie", "c": "LangGraph", "p": "Jakie trzy elementy opisują graf stanów w LangGraph?", "o": {"A": "Prompt, temperatura i klucz API", "B": "Chunk, embedding i baza wektorowa", "C": "Model lokalny, model chmurowy i menedżer pakietów", "D": "Węzły przetwarzające stan, krawędzie wyznaczające przejścia oraz współdzielony stan"}, "correct": "D", "why": "Graf LangGraph składa się z węzłów, krawędzi i współdzielonego stanu.", "lesson": {"correct": "LangGraph opisuje przepływ jako graf. Węzeł wykonuje krok i przetwarza stan. Krawędź wskazuje następny krok i może być warunkowa. Stan niesie wspólne dane między węzłami.", "example": "Jeden węzeł pyta model, czy potrzebne jest narzędzie. Krawędź prowadzi do węzła narzędzia albo do końca. Stan niesie pytanie użytkownika i wyniki przez cały przebieg.", "remember": "LangGraph: węzły, drogi między nimi i wspólny stan.", "wrong": {"A": "Prompt, temperatura i klucz to konfiguracja LLM, nie definicja grafu.", "B": "Chunk, embedding i baza należą do RAG.", "C": "Wybór modelu i menedżera pakietów nie definiuje grafu stanów."}}}, {"n": 17, "d": "trudne", "c": "LangSmith", "p": "Które elementy przebiegu LangSmith typowo pomaga śledzić według notatek?", "o": {"A": "Input, output, czas i tokeny wywołań łańcucha lub agenta", "B": "Wyłącznie kolory przycisków w interfejsie Black", "C": "Tylko listę plików w .gitignore", "D": "Wyłącznie wagi modelu open-weight na dysku"}, "correct": "A", "why": "Tracing LangSmith obejmuje m.in. input, output, czas i tokeny wywołań łańcucha lub agenta.", "lesson": {"correct": "LangSmith służy do obserwowalności aplikacji LLM. Tracing pokazuje, co weszło do kroku i co z niego wyszło. Widać też czas oraz zużycie tokenów. To pomaga debugować decyzje łańcucha lub agenta.", "example": "Łańcuch ma zrobić summary i dwa fakty. W LangSmith widzisz wejściowy tekst osoby, wygenerowaną odpowiedź, ile to trwało i ile tokenów zużyto. Łatwiej wtedy znaleźć, czy problem leży w prompcie czy w modelu.", "remember": "Trace = wejście, wyjście, czas i tokeny pod lupą.", "wrong": {"B": "Black formatuje kod. Nie jest platformą tracingu przebiegów LLM.", "C": ".gitignore chroni przed commitowaniem sekretów i artefaktów, nie śledzi wywołań modelu.", "D": "LangSmith nie zastępuje narzędzi do zarządzania lokalnymi wagami modelu."}}}, {"n": 18, "d": "średnie", "c": "LLM", "p": "Jaki kompromis wiąże się z użyciem bardzo małego lokalnego modelu, np. Gemma 3 270M?", "o": {"A": "Większe zużycie pamięci i brak pracy offline", "B": "Zawsze lepsze rozumowanie przy wyższym rachunku API", "C": "Mniejsze wymagania i szybsze działanie kosztem zwykle słabszej jakości odpowiedzi", "D": "Brak możliwości uruchomienia z terminala"}, "correct": "C", "why": "Mały model ma mniejsze wymagania i bywa szybszy, ale zwykle daje słabszą jakość niż większy model.", "lesson": {"correct": "270M to około 270 milionów parametrów. Taki model jest lekki i szybciej się pobiera. Często działa też szybciej na skromniejszym sprzęcie. W zamian gorzej radzi sobie z trudnymi poleceniami.", "example": "Mały laptop łatwiej uruchomi wariant 270M. Proste „Hello” działa szybko. Przy złożonej analizie większy model zwykle wygra jakością, ale zje więcej pamięci.", "remember": "Mniejszy model: lżejszy i szybszy, zwykle mniej dokładny.", "wrong": {"A": "Mały model zwykle zmniejsza zużycie pamięci i pozwala pracować offline.", "B": "Mały lokalny model nie obiecuje zawsze lepszego rozumowania ani rachunku API.", "D": "Model można sprawdzić poleceniem ollama run w terminalu."}}}, {"n": 19, "d": "średnie", "c": "LangSmith", "p": "Jaką rolę pełni pakiet langsmith w zależnościach projektu według notatek o konfiguracji?", "o": {"A": "Zastępuje python-dotenv przy ładowaniu .env", "B": "Jest SDK tracingu i ewaluacji (zależność LangChain wymagająca konfiguracji w .env)", "C": "Trenuje lokalnie wagi Gemmy 3", "D": "Formatuje importy zamiast isort"}, "correct": "B", "why": "langsmith to SDK tracingu/ewaluacji; jest zależnością LangChain i wymaga konfiguracji w .env.", "lesson": {"correct": "Pakiet langsmith dostarcza narzędzia do śledzenia i oceny przebiegów. W projekcie pojawia się jako zależność związana z LangChain. Aby tracing działał praktycznie, potrzebujesz zmiennych w .env. Samo zainstalowanie pakietu bez konfiguracji nie wystarczy.", "example": "Po uv sync masz dostęp do klienta LangSmith. Ustawiasz LANGSMITH_TRACING i LANGSMITH_API_KEY, wołasz load_dotenv i dopiero wtedy sprawdzasz połączenie. Bez .env SDK nie ma kompletnych danych do pracy.", "remember": "langsmith = SDK śladów i ewaluacji, ale .env nadal potrzebne.", "wrong": {"A": "Ładowaniem .env zajmuje się python-dotenv, nie langsmith.", "C": "langsmith nie trenuje lokalnych wag Gemmy. Do lokalnych modeli służy m.in. Ollama.", "D": "Sortowaniem importów zajmuje się isort, nie langsmith."}}}, {"n": 20, "d": "trudne", "c": "LangChain", "p": "Co zwykle wystarczy zmienić, by dobrze zaprojektowany łańcuch przełączyć z OpenAI na lokalną Gemmę 3 przez Ollama?", "o": {"A": "Całą logikę promptu, RAG i format odpowiedzi", "B": "Język programowania oraz menedżer pakietów", "C": "Wszystkie dane wejściowe na embeddingi", "D": "Głównie klienta integracji i nazwę modelu, pozostawiając resztę łańcucha podobną"}, "correct": "D", "why": "Dzięki wspólnej abstrakcji zwykle zmienia się klienta i nazwę modelu, a reszta łańcucha zostaje podobna.", "lesson": {"correct": "LangChain oddziela logikę aplikacji od dostawcy modelu. Obiekty chat mają podobny sposób użycia. Podmieniasz ChatOpenAI na ChatOllama i ustawiasz właściwą nazwę modelu. Prompt oraz invoke mogą zostać prawie bez zmian.", "example": "Łańcuch to prompt | llm. Najpierw llm to ChatOpenAI z GPT. Potem podstawiasz ChatOllama z gemma3:270m. Wywołanie invoke wygląda podobnie.", "remember": "Zmieniasz silnik, nie cały samochód.", "wrong": {"A": "Cel abstrakcji to uniknąć przebudowy całej logiki aplikacji.", "B": "Oba warianty mogą działać w tej samej aplikacji Python.", "C": "Embeddingi dotyczą RAG. Sama podmiana modelu chat nie zamienia każdego wejścia w embedding."}}}];
const quiz=document.querySelector("#quiz"),count=document.querySelector("#count"),results=document.querySelector("#results");
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
quiz.innerHTML=Q.map(q=>`<article class="card" id="card${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag">${q.d}</span><span class="tag">${q.c}</span></div><p class="prompt">${esc(q.p)}</p><div class="options">${["A","B","C","D"].map(l=>`<label class="opt"><input type="radio" name="q${q.n}" value="${l}"><span class="letter">${l})</span><span>${esc(q.o[l])}</span></label>`).join("")}<label class="opt idk"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span><strong>Nie mam pojęcia</strong> — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność: <select name="c${q.n}"><option value="">—</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join("")}</select></label><div class="feedback" id="feedback${q.n}" hidden></div></article>`).join("");
}
function collect(){
return Q.map(q=>({n:q.n,answer:quiz.querySelector(`input[name=q${q.n}]:checked`)?.value||"",confidence:quiz.querySelector(`select[name=c${q.n}]`).value||"—"}));
}
function lesson(q,mode,picked){
const l=q.lesson,parts=[];
if(mode==="bad"){parts.push(`<h3>BŁĄD · Twoja: ${picked} · Poprawna: ${q.correct}</h3><h4>Twoja odpowiedź</h4><p>${esc(l.wrong[picked])}</p>`);}
if(mode==="idk"){parts.push(`<h3>NIE WIEM · Poprawna: ${q.correct}</h3><p>Bez zgadywania — oto wyjaśnienie.</p>`);}
parts.push(`<h4>Poprawna myśl</h4><p>${esc(l.correct)}</p><h4>Przykład</h4><p>${esc(l.example)}</p><h4>Zapamiętaj</h4><p class="remember">${esc(l.remember)}</p>`);
return parts.join("");
}
let last=null;
function grade(){
const rows=collect(),missing=rows.filter(r=>!r.answer);
if(missing.length){alert("Brak odpowiedzi w pytaniach: "+missing.map(r=>r.n).join(", "));return null;}
let ok=0,idk=0;
const detail=rows.map(r=>{
const q=Q[r.n-1],isIdk=r.answer==="?",isOk=r.answer===q.correct;
if(isOk)ok++;if(isIdk)idk++;
const card=document.querySelector(`#card${r.n}`),box=document.querySelector(`#feedback${r.n}`);
card.className=`card ${isOk?"ok":isIdk?"learn":"bad"}`;box.hidden=false;
if(isOk){box.className="feedback okbox";box.innerHTML=`<h3>OK</h3><p>${esc(q.why)}</p>`;}
else if(isIdk){box.className="feedback learnbox";box.innerHTML=lesson(q,"idk",r.answer);}
else{box.className="feedback badbox";box.innerHTML=lesson(q,"bad",r.answer);}
return {...r,correct:q.correct,result:isOk?"OK":isIdk?"NIE WIEM":"BŁĄD",why:q.why,isOk};
});
const pct=Math.round(ok/Q.length*100);
document.querySelector("#score").textContent=`Wynik: ${ok}/20`;document.querySelector("#percent").textContent=`Skuteczność: ${pct}%`;document.querySelector("#idkCount").textContent=`Nie wiem: ${idk}`;document.querySelector("#status").textContent="Sprawdzono";results.classList.add("show");last={ok,idk,pct,detail};results.scrollIntoView({behavior:"smooth"});return last;
}
function download(name,text){
const a=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type:"text/markdown;charset=utf-8"}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}
function myAnswers(rows){
return [`# Moje odpowiedzi – ${DATE}`,"","| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |","|---|-----------------------------|---------------|-------|",...rows.map(r=>`| ${r.n} | ${r.answer} | ${r.confidence==="—"?"":r.confidence} | |`),"","## Notatki",""].join("\n");
}
function resultMd(g){
const strong=g.detail.filter(r=>r.isOk),review=g.detail.filter(r=>!r.isOk);
return [`# Wynik quizu — ${DATE}`,"","## Wynik","",`- Poprawne odpowiedzi: ${g.ok}/20`,`- Skuteczność: ${g.pct}%`,`- Nie wiem: ${g.idk}`,"","## Szczegóły","","| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |","|---|---|---|---|---|---|",...g.detail.map(r=>`| ${r.n} | ${r.answer} | ${r.correct} | ${r.result} | ${r.confidence} | ${r.why} |`),"","## Mocne strony","",strong.length?`- Poprawnie rozwiązane pytania: ${strong.map(r=>r.n).join(", ")}.`:"- Brak poprawnych odpowiedzi w tej próbie.","","## Obszary do powtórki","",...(review.length?review.map(r=>`- Pytanie ${r.n} (${r.result}): ${r.why}`):["- Brak — wszystkie odpowiedzi są poprawne."]),""].join("\n");
}
quiz.addEventListener("change",()=>count.textContent=collect().filter(r=>r.answer).length);
document.querySelector("#check").addEventListener("click",grade);
document.querySelector("#reset").addEventListener("click",()=>{quiz.reset();last=null;results.classList.remove("show");document.querySelector("#status").textContent="W trakcie";Q.forEach(q=>{const c=document.querySelector(`#card${q.n}`),f=document.querySelector(`#feedback${q.n}`);c.className="card";f.hidden=true;f.innerHTML="";});count.textContent="0";});
document.querySelector("#downloadAnswers").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_my_answers.md`,myAnswers(g.detail));});
document.querySelector("#downloadResults").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_results.md`,resultMd(g));});
render();
</script>

const DATE="29.09.2026";
const Q=[{"n": 1, "d": "łatwe", "c": "LangChain", "p": "Dla której wersji LangChain kurs był przygotowany w momencie nagrywania według notatek o kompatybilności?", "o": {"A": "LangChain 1.0.2", "B": "LangChain 0.1.0 wyłącznie", "C": "Wyłącznie LangChain 3.x", "D": "Dowolna wersja bez numeru"}, "correct": "A", "why": "Kurs był przygotowany dla LangChain 1.0.2.", "lesson": {"correct": "Autor nagrywał materiał na konkretnej wersji biblioteki. Ta wersja to LangChain 1.0.2. Numer wersji mówi, na czym powstały przykłady. Gdy później coś działa inaczej, porównujesz swoją wersję z tą z kursu. To pierwszy punkt kontroli kompatybilności.", "example": "Wyobraź sobie przepis na ciasto napisany przy piekarniku modelu 1.0.2. Kupujesz nowszy piekarnik 1.0.7. Często ciasto wyjdzie podobnie. Ale jeśli masz zupełnie inną linię, np. 3.x, ustawienia mogą być inne. Dlatego najpierw sprawdzasz: u autora było 1.0.2 — a u mnie?", "remember": "Kurs = LangChain 1.0.2 na starcie — od tego zaczynaj porównanie.", "wrong": {"B": "0.1.0 to inna, starsza linia. Notatki wskazują 1.0.2 jako wersję z nagrywania.", "C": "Kurs jest w linii 1.x, nie 3.x. Skok major byłby dużą zmianą API.", "D": "Wersja ma konkretny numer. Dowolna bez numeru nie pomaga w debugowaniu kompatybilności."}}}, {"n": 2, "d": "łatwe", "c": "LLM", "p": "Co oznacza ustawienie temperature=0 przy modelu chat w typowym ćwiczeniu ze streszczeniem?", "o": {"A": "Model zawsze trenuje nowe wagi lokalnie", "B": "Model automatycznie włącza Pinecone", "C": "Odpowiedzi mają być bardziej przewidywalne i powtarzalne", "D": "PromptTemplate przestaje przyjmować parametry"}, "correct": "C", "why": "temperature=0 dąży do bardziej przewidywalnych, powtarzalnych odpowiedzi.", "lesson": {"correct": "Temperature steruje losowością odpowiedzi. Przy zero model mniej zgaduje kreatywnie. Przy streszczeniu i faktach chcesz spokojny, powtarzalny wynik. Wyższa temperatura bardziej miesza i urozmaica tekst. Dlatego w ćwiczeniach typu summary plus facts często stawia się 0.", "example": "Prosisz o krótkie podsumowanie biografii i dwa fakty. Przy temperature=0 dwa uruchomienia wyglądają bardzo podobnie. Przy 0.9 model może raz dodać żart, a raz zmienić kolejność faktów. Do stabilnego formatu zero jest bezpieczniejsze.", "remember": "Zero jak chłodna głowa: mniej losowości, więcej powtarzalności.", "wrong": {"A": "Wywołanie z temperature nie trenuje wag. Model tylko generuje odpowiedź.", "B": "Pinecone to baza wektorowa. Temperature jej nie włącza.", "D": "PromptTemplate nadal przyjmuje parametry. Temperature dotyczy modelu, nie szablonu."}}}, {"n": 3, "d": "średnie", "c": "LangChain", "p": "Co w semantic versioningu oznacza część MAJOR (np. cyfra 1 w zapisie 1.0.2)?", "o": {"A": "Wyłącznie poprawkę literówki w dokumentacji", "B": "Dużą zmianę linii wersji, która może łamać API i wymagać zmian w kodzie", "C": "Wyłącznie nazwę projektu w LangSmith", "D": "Temperaturę modelu chat"}, "correct": "B", "why": "MAJOR to duża zmiana linii wersji; może łamać API i wymagać zmian w kodzie.", "lesson": {"correct": "W zapisie MAJOR.MINOR.PATCH pierwsza liczba to MAJOR. Skok MAJOR (1.x do 2.x) bywa jak przeprowadzka do nowego domu. Stare wtyczki mogą nie pasować. Kod z kursu może wymagać poprawek. Dlatego MAJOR traktuje się ostrożniej niż drobny patch.", "example": "Masz aplikację na LangChain 1.x. Wychodzi 2.0. Niektóre klasy lub importy mogą mieć inne nazwy. Zanim zaktualizujesz, sprawdzasz changelog i poprawiasz wywołania. To właśnie ryzyko MAJOR.", "remember": "MAJOR = duży skok; API może się połamać.", "wrong": {"A": "Literówki i drobne bugfixy to raczej PATCH, nie MAJOR.", "C": "Nazwa projektu LangSmith to osobna zmienna środowiskowa, nie część semver biblioteki.", "D": "Temperature ustawiasz w modelu. Nie jest częścią numeru wersji biblioteki."}}}, {"n": 4, "d": "średnie", "c": "Narzędzia", "p": "Które polecenie Ollamy pobiera lokalnie wariant Gemma 3 270M?", "o": {"A": "ollama list gemma3:270m", "B": "uv sync gemma3:270m", "C": "python install gemma3:270m", "D": "ollama pull gemma3:270m"}, "correct": "D", "why": "Model pobiera się poleceniem ollama pull gemma3:270m.", "lesson": {"correct": "Ollama zarządza lokalnymi modelami. Polecenie pull ściąga wybrany model na komputer. Tag gemma3:270m wskazuje mały wariant. Po pobraniu list pokazuje model, a run go uruchamia. Najpierw pull, potem test w terminalu.", "example": "Chcesz Gemmę lokalnie. Wpisujesz ollama pull gemma3:270m i czekasz. Potem ollama list potwierdza obecność, a ollama run pozwala napisać Hello i zobaczyć odpowiedź.", "remember": "Pull pobiera, list pokazuje, run uruchamia.", "wrong": {"A": "list pokazuje modele już lokalne. Samo list nie pobiera Gemmy.", "B": "uv sync instaluje pakiety Pythona. Nie pobiera modeli Ollamy.", "C": "Nie ma takiego standardowego polecenia do pobierania Gemmy. Tym zajmuje się ollama pull."}}}, {"n": 5, "d": "trudne", "c": "LangChain", "p": "Jaka jest praktyczna różnica między zakresem w deklaracji zależności a dokładną wersją w pliku lock?", "o": {"A": "Zakres i lock zawsze oznaczają to samo i nie mają sensu przy debugowaniu", "B": "Lock zastępuje PromptTemplate w LCEL", "C": "Zakres mówi, co jest akceptowalne (np. co najmniej X), a lock utrwala konkretną zainstalowaną wersję dla powtarzalności", "D": "Zakres dotyczy wyłącznie temperature, a lock wyłącznie endpointu LangSmith"}, "correct": "C", "why": "Zakres mówi, co jest akceptowalne; lock utrwala konkretną wersję dla powtarzalności.", "lesson": {"correct": "Deklaracja często mówi: weź wersję co najmniej taką. To zakres. Lock zapisuje: w tym środowisku naprawdę stoi wersja dokładnie taka. Dzięki temu wszyscy z tym samym lockiem mają te same biblioteki. Przy błędzie u mnie inaczej patrzysz na pin z locka, nie tylko na luźny zakres.", "example": "Deklaracja akceptuje 1.3.11 lub nowsze w linii 1.x. Lock mówi: zainstalowano konkretną 1.3.11. Kolega bez aktualnego locka może dostać inną wersję i zobaczyć inne zachowanie. Porównanie locków od razu pokazuje różnicę.", "remember": "Zakres = drzwi otwarte; lock = konkretny numer na półce.", "wrong": {"A": "To nie to samo. Zakres jest elastyczny, lock jest dokładny — właśnie dlatego pomaga w debugowaniu.", "B": "Lock dotyczy wersji pakietów. Nie zastępuje szablonów promptu ani LCEL.", "D": "Temperature i endpoint to konfiguracja runtime, nie znaczenie zakresu i locka zależności."}}}, {"n": 6, "d": "średnie", "c": "LangSmith", "p": "Co jest potrzebne oprócz LANGSMITH_TRACING=true, aby ślady wywołań trafiały do LangSmith?", "o": {"A": "Ustawiony LANGSMITH_API_KEY", "B": "Wyłącznie formatowanie kodu przez Black", "C": "Wyłącznie temperature=1", "D": "Wyłącznie baza FAISS bez klucza"}, "correct": "A", "why": "Do wysyłania trace’ów potrzebny jest też LANGSMITH_API_KEY.", "lesson": {"correct": "Tracing ma włącznik i klucz. LANGSMITH_TRACING=true mówi wysyłaj ślady. LANGSMITH_API_KEY mówi na jakie konto. Bez klucza włącznik nie ma autoryzacji. Oba elementy działają razem po załadowaniu środowiska.", "example": "Masz TRACING=true, ale pusty API key. Uruchamiasz chain.invoke i panel jest pusty. Dopisujesz poprawny LANGSMITH_API_KEY, ładujesz środowisko i ślady pojawiają się w projekcie.", "remember": "Tracing = włącznik true + klucz LangSmith.", "wrong": {"B": "Black formatuje kod. Nie autoryzuje wysyłania trace’ów.", "C": "Temperature steruje losowością odpowiedzi, nie tracingiem.", "D": "FAISS to baza wektorowa do RAG. Nie zastępuje klucza LangSmith."}}}, {"n": 7, "d": "łatwe", "c": "LangChain", "p": "Co zwykle oznacza zmiana PATCH w semantic versioningu (np. 1.0.2 do 1.0.3)?", "o": {"A": "Skok na zupełnie nową major linię API", "B": "Drobne poprawki i bugfixy", "C": "Obowiązkową zmianę języka programowania", "D": "Wyłączenie wszystkich modeli chat"}, "correct": "B", "why": "PATCH zwykle oznacza drobne poprawki i bugfixy.", "lesson": {"correct": "Trzecia liczba w MAJOR.MINOR.PATCH to PATCH. Rośnie, gdy ktoś naprawia błąd albo robi drobną poprawkę. Zwykle nie przebudowuje całego API. Dlatego 1.0.2 do 1.0.3 bywa bezpieczne dla ćwiczeń z kursu. Nadal warto sprawdzić, gdy coś dziwnie działa.", "example": "W 1.0.2 jest mały błąd w komunikacie. Autorzy wydają 1.0.3 z poprawką. Twój kod prompt pipe llm wygląda tak samo. To klasyczny patch.", "remember": "PATCH = mała łatka, nie przebudowa domu.", "wrong": {"A": "Nowa major linia to zmiana MAJOR, nie PATCH.", "C": "Patch biblioteki nie każe zmieniać języka programowania.", "D": "Patch nie wyłącza modeli chat. Dotyczy drobnych poprawek pakietu."}}}, {"n": 8, "d": "średnie", "c": "LLM", "p": "Co oznacza, że Gemma 3 jest modelem open-weight?", "o": {"A": "Model działa wyłącznie bez żadnej pamięci RAM", "B": "Każda rozmowa jest zawsze publiczna", "C": "Model może działać wyłącznie przez płatne API i nigdy lokalnie", "D": "Wagi modelu są dostępne do pobrania, więc można go uruchomić we własnym środowisku"}, "correct": "D", "why": "Open-weight oznacza dostępność wag do pobrania i możliwość uruchomienia we własnym środowisku.", "lesson": {"correct": "Wagi to liczby opisujące zachowanie modelu. W modelu open-weight możesz je pobrać. Dzięki temu uruchomisz model lokalnie, na serwerze albo w wybranej chmurze. To nie kasuje wymagań sprzętowych. Nie gwarantuje też zawsze lepszej jakości niż model w API.", "example": "Pobierasz Gemmę 3 przez Ollamę. Pliki zostają na Twoim komputerze. Pytania możesz liczyć lokalnie, bez wysyłania każdej prośby do zewnętrznego API. To właśnie sens open-weight.", "remember": "Open-weight: wagi możesz pobrać i wybrać miejsce uruchomienia.", "wrong": {"A": "Uruchomiony model potrzebuje zasobów, np. RAM lub VRAM. Open-weight tego nie usuwa.", "B": "Open-weight dotyczy wag, nie publiczności rozmów. Lokalnie dane mogą zostać u Ciebie.", "C": "Właśnie dostępność wag pozwala uniknąć obowiązkowego płatnego API."}}}, {"n": 9, "d": "trudne", "c": "LangChain", "p": "Jak notatki opisują przejście z LangChain 1.0.x na nowszy MINOR w tej samej linii MAJOR (np. 1.3.x)?", "o": {"A": "Zwykle oznacza nowe możliwości i poprawki, a nie automatyczne łamanie API jak przy skoku 1.x do 2.x", "B": "Zawsze wymaga przepisania całej aplikacji na inny język", "C": "Jest równoważne skokowi MAJOR i zawsze łamie cały kontrakt API", "D": "Kasuje PromptTemplate i LCEL z ekosystemu"}, "correct": "A", "why": "MINOR w obrębie tego samego MAJOR zwykle dodaje możliwości bez automatycznego łamania jak przy skoku MAJOR.", "lesson": {"correct": "W linii 1.x zmiana z 1.0 na 1.3 to głównie MINOR. Semver mówi: nowe funkcje, bez dużego łamania kompatybilności. To łagodniejsze niż skok na 2.x. Nadal możesz zobaczyć drobne różnice. Ale nie traktuj 1.3 jak całkowitej przebudowy API z automatu.", "example": "Kurs był na 1.0.2. Twój projekt ma nowszy 1.3.x. PromptTemplate, pipe i invoke nadal są tym samym wzorcem. Sprawdzasz różnice tylko gdy coś konkretnego nie działa, zamiast panikować jak przy major 2.0.", "remember": "W tej samej jedynce MINOR zwykle dokłada, MAJOR przebudowuje.", "wrong": {"B": "Zmiana minor w Pythonowym ekosystemie nie wymusza zmiany języka.", "C": "Równoważność z MAJOR jest fałszywa. MAJOR jest właśnie tym bardziej ryzykownym skokiem.", "D": "PromptTemplate i LCEL pozostają podstawą pracy w LangChain 1.x."}}}, {"n": 10, "d": "średnie", "c": "LangChain", "p": "Co zwykle dzieje się w łańcuchu LCEL zapisanym jako prompt | model?", "o": {"A": "Model jest trenowany od zera na treści promptu", "B": "Operator tworzy automatycznie serwer MCP", "C": "Wynik wypełnienia szablonu staje się wejściem modelu w złożonym obiekcie Runnable", "D": "Historia rozmowy jest zawsze zapisywana w Pinecone"}, "correct": "C", "why": "LCEL przekazuje wynik szablonu jako wejście modelu w obiekcie Runnable.", "lesson": {"correct": "Operator pionowej kreski składa kroki w kolejność. Najpierw szablon dostaje dane i buduje prompt. Potem wynik idzie do modelu. Całość to jeden Runnable. Wywołujesz go przez invoke ze słownikiem wejściowym.", "example": "Szablon ma miejsce na information. Podajesz biografię w słowniku. Szablon wypełnia lukę, a model dostaje gotową instrukcję: zrób summary i dwa fakty. Nie sklejasz tego ręcznie w wielu osobnych wywołaniach.", "remember": "LCEL pipe: wynik lewej strony podaj prawej.", "wrong": {"A": "Wywołanie łańcucha nie trenuje modelu. Model generuje odpowiedź.", "B": "MCP to standard narzędzi i kontekstu. Operator LCEL go nie uruchamia.", "D": "Pinecone to baza wektorowa. Prosty łańcuch prompt|model nie zapisuje tam historii automatycznie."}}}, {"n": 11, "d": "łatwe", "c": "LangChain", "p": "Jakie trzy części ma typowy zapis semantic versioningu?", "o": {"A": "temperature, endpoint, project", "B": "MAJOR.MINOR.PATCH", "C": "Thought.Action.Observation", "D": "chunk.embedding.retriever"}, "correct": "B", "why": "Semantic versioning zapisuje się jako MAJOR.MINOR.PATCH.", "lesson": {"correct": "Semantic versioning porządkuje numery wydań. Pierwsza część to MAJOR, druga MINOR, trzecia PATCH. Przykład 1.0.2 czyta się właśnie tak. Dzięki temu od razu wiesz, czy zmiana wygląda na dużą, średnią czy drobną. To wspólny język przy kompatybilności bibliotek.", "example": "Widzisz 1.0.2. Jedynka to major linia. Zero to minor. Dwójka to patch. Gdy później jest 1.0.3, rośnie tylko łatka. Gdy jest 2.0.0, rośnie major i ostrożność.", "remember": "Semver śpiewaj: MAJOR kropka MINOR kropka PATCH.", "wrong": {"A": "To elementy konfiguracji modelu i LangSmith, nie format semver.", "C": "Thought/Action/Observation to wzorzec ReAct, nie numer wersji.", "D": "Chunk, embedding i retriever to elementy RAG, nie semver."}}}, {"n": 12, "d": "trudne", "c": "LangSmith", "p": "Co oznacza metryka P90 czasu odpowiedzi w LangSmith?", "o": {"A": "Że model zawsze odpowiada w dokładnie 90 sekund", "B": "Że tracing jest wyłączony dla 90% runów", "C": "Że temperature musi wynosić 0.9", "D": "Że 90% wywołań zakończyło się w czasie równym lub krótszym od tej wartości"}, "correct": "D", "why": "P90: 90% wywołań zakończyło się w czasie mniejszym lub równym tej wartości.", "lesson": {"correct": "P90 to percentyl. Patrzysz na wiele runów i znajdujesz próg, poniżej którego mieści się 90% czasów. To nie jest zawsze 90 sekund. Pomaga zobaczyć typowe wolniejsze przypadki lepiej niż sama średnia. Obok bywa P50, czyli praktycznie mediana.", "example": "P50 wynosi 2 s, P90 wynosi 6 s. Połowa odpowiedzi kończy się w max 2 sekundy. Dziewięć na dziesięć kończy się w max 6 sekund. Jedna na dziesięć może być jeszcze wolniejsza.", "remember": "P90: dziewięć na dziesięć zdążyło w tym czasie lub szybciej.", "wrong": {"A": "P90 to próg dla 90% próbek, nie stała wartość zawsze 90 sekund.", "B": "P90 nie wyłącza tracingu. To metryka czasu.", "C": "Temperature nie wynika z P90. To osobny parametr modelu."}}}, {"n": 13, "d": "średnie", "c": "LangChain", "p": "Co zwykle wnosi zmiana MINOR (np. 1.0.x do 1.1.x) według semantic versioningu?", "o": {"A": "Nową funkcjonalność bez dużego łamania kompatybilności", "B": "Obowiązkowe usunięcie wszystkich modeli lokalnych", "C": "Wyłącznie zmianę nazwy pliku .env", "D": "Skok MAJOR, który zawsze łamie API"}, "correct": "A", "why": "MINOR zwykle wnosi nową funkcjonalność bez dużego łamania kompatybilności.", "lesson": {"correct": "MINOR to środkowa liczba w semver. Rośnie, gdy biblioteka dostaje nowe możliwości. Z założenia nie powinna mocno łamać starego sposobu użycia. To inny sygnał niż MAJOR. Patch jest jeszcze drobniejszy.", "example": "Wersja 1.0 umie składać prompt z modelem. Wersja 1.1 dokłada wygodniejszą funkcję pomocniczą. Twój stary kod invoke nadal działa, a możesz skorzystać z nowości.", "remember": "MINOR dokłada zabawki, zwykle bez wywracania stołu.", "wrong": {"B": "Minor biblioteki nie każe usuwać lokalnych modeli.", "C": "Nazwa .env nie jest sensem zmiany MINOR w semver pakietu.", "D": "Skok MAJOR to osobna, bardziej ryzykowna zmiana pierwszej liczby."}}}, {"n": 14, "d": "łatwe", "c": "Narzędzia", "p": "Dlaczego klucza API nie należy zapisywać w kodzie ani commitować pliku .env?", "o": {"A": "Bo PromptTemplate przestanie być Runnable", "B": "Bo Ollama usunie lokalne modele", "C": "Bo grozi ujawnieniem sekretu; klucz powinien zostać w zmiennej środowiskowej", "D": "Bo temperature wzrośnie automatycznie"}, "correct": "C", "why": "Commit sekretu grozi wyciekiem; klucz ma zostać w zmiennej środowiskowej.", "lesson": {"correct": "Klucz API otwiera usługę na Twoim koncie. Jeśli trafi do Gita, ktoś może go zobaczyć i użyć. Dlatego trzymasz go w lokalnym .env albo innej zmiennej środowiska. Sam .env powinien być ignorowany przez Git. W repo może zostać szablon pustych nazw.", "example": "Program woła load_dotenv i czyta OPENAI_API_KEY. W repozytorium jest kod, ale nie ma prawdziwej wartości klucza. Szablon pustych nazw może leżeć osobno jako przykład.", "remember": "Sekret do środowiska, nigdy do kodu ani commita.", "wrong": {"A": "PromptTemplate pozostaje Runnable niezależnie od miejsca klucza. Problem to bezpieczeństwo.", "B": ".env nie steruje usuwaniem modeli Ollamy.", "D": "Temperature ustawiasz w konfiguracji modelu. Wyciek klucza jej nie podnosi."}}}, {"n": 15, "d": "trudne", "c": "LangChain", "p": "Przy debugowaniu „u mnie działa inaczej niż w kursie” co jest lepszym pierwszym porównaniem według notatek o wersjach?", "o": {"A": "Wyłącznie kolor motywu w edytorze", "B": "Dokładna wersja z locka względem wersji z kursu, a nie tylko luźny zakres z deklaracji", "C": "Wyłącznie liczba plików w katalogu quizów", "D": "Wyłącznie nazwa zmiennej OPEN_AI_KEY bez sprawdzania wersji biblioteki"}, "correct": "B", "why": "Przy różnicach zachowań porównuj dokładną wersję z locka, nie tylko luźny zakres.", "lesson": {"correct": "Zakres w deklaracji mówi tylko, co wolno zainstalować. Lock mówi, co naprawdę stoi. Gdy kod z kursu zachowuje się inaczej, najpierw porównujesz dokładną wersję LangChain i zależności. To szybsze niż zgadywanie w logice promptu. Potem dopiero szukasz innych przyczyn.", "example": "Deklaracja akceptuje szeroki zakres 1.x. U Ciebie lock ma inną dokładną wersję niż materiał kursu. Po wyrównaniu locka dziwny błąd znika. Okazuje się, że problemem była różnica wersji, nie Twój prompt.", "remember": "Najpierw pin z locka, potem reszta zagadek.", "wrong": {"A": "Motyw edytora nie zmienia API LangChain.", "C": "Liczba quizów nie wyjaśnia różnic w zachowaniu biblioteki.", "D": "Pomyłka w nazwie klucza bywa osobną pułapką, ale notatki o kompatybilności każą najpierw porównać wersję z locka."}}}, {"n": 16, "d": "średnie", "c": "LLM", "p": "Która cecha odróżnia agenta od samego pipeline’u RAG?", "o": {"A": "Agent zawsze korzysta wyłącznie z FAISS, a RAG nigdy", "B": "RAG samodzielnie planuje dowolną liczbę działań bez narzędzi", "C": "Agent nie może korzystać z dokumentów", "D": "Agent decyduje o kolejnych krokach i użyciu narzędzi, a RAG przede wszystkim dostarcza kontekst z dokumentów"}, "correct": "D", "why": "RAG dostarcza kontekst z dokumentów; agent dodatkowo decyduje o krokach i narzędziach.", "lesson": {"correct": "RAG wyszukuje fragmenty i dokłada je do promptu. Model odpowiada na podstawie tej wiedzy. Agent ma pętlę decyzji i może wybierać narzędzia. Oba podejścia mogą współpracować. Nie są jednak tym samym poziomem aplikacji.", "example": "RAG znajduje instrukcję zwrotu i przekazuje ją modelowi. Agent może znaleźć instrukcję, sprawdzić zamówienie w API i utworzyć zgłoszenie. To kolejne decyzje, nie tylko dostarczenie tekstu.", "remember": "RAG przynosi wiedzę, agent wybiera następne działanie.", "wrong": {"A": "FAISS to jedna możliwa baza. Agent nie musi jej używać, a RAG właśnie może.", "B": "Samo RAG opisuje pobranie kontekstu. Planowanie działań to cecha agenta.", "C": "Agent może użyć retrievera i dokumentów jako narzędzia."}}}, {"n": 17, "d": "trudne", "c": "LangChain", "p": "Dlaczego drobne aktualizacje w obrębie tej samej głównej linii wersji zwykle nie powinny psuć ćwiczeń z kursu?", "o": {"A": "Bo każda aktualizacja zawsze łamie API niezależnie od numeru", "B": "Bo patch i małe zmiany w tej samej linii MAJOR zwykle zawierają poprawki i ulepszenia bez dużego łamania sposobu użycia", "C": "Bo LangChain przestaje używać PromptTemplate po każdym patchu", "D": "Bo Ollama nadpisuje semantic versioning"}, "correct": "B", "why": "Patch i małe zmiany w tej samej linii MAJOR zwykle nie łamią mocno sposobu użycia.", "lesson": {"correct": "Autor kursu podkreśla, że niewielkie aktualizacje w tej samej linii zwykle są bezpieczne. Patch naprawia błędy. Małe ruchy w MAJOR 1.x dodają ulepszenia. Duże ryzyko zaczyna się przy skoku MAJOR. Dlatego 1.0.2 do nowszego 1.0.x lub bliskiego 1.x rzadko burzy całe ćwiczenie.", "example": "Oglądasz kurs rok później. Zamiast 1.0.2 masz 1.0.7. Twój łańcuch prompt z modelem i invoke wyglądają tak samo. Działa. Gdyby nagle była 2.0, dopiero wtedy spodziewasz się większych poprawek kodu.", "remember": "W tej samej jedynce drobnica zwykle nie wywraca ćwiczeń.", "wrong": {"A": "Semver właśnie rozróżnia bezpieczniejsze patche od ryzykownych majorów. Nie każda aktualizacja łamie API.", "C": "PromptTemplate pozostaje kluczową abstrakcją; patch go nie kasuje.", "D": "Ollama uruchamia modele lokalne. Nie nadpisuje reguł semantic versioning biblioteki."}}}, {"n": 18, "d": "trudne", "c": "LangGraph", "p": "Jakie trzy elementy opisują graf stanów w LangGraph?", "o": {"A": "Węzły przetwarzające stan, krawędzie wyznaczające przejścia oraz współdzielony stan", "B": "Prompt, temperatura i klucz API", "C": "Chunk, embedding i baza wektorowa", "D": "Model lokalny, model chmurowy i menedżer pakietów"}, "correct": "A", "why": "Graf LangGraph składa się z węzłów, krawędzi i współdzielonego stanu.", "lesson": {"correct": "LangGraph opisuje przepływ jako graf. Węzeł wykonuje krok i przetwarza stan. Krawędź wskazuje następny krok i może być warunkowa. Stan niesie wspólne dane między węzłami. Dzięki temu widać pętle i rozgałęzienia wyraźniej niż w jednej gęstej pętli.", "example": "Jeden węzeł pyta model, czy potrzebne jest narzędzie. Krawędź prowadzi do węzła narzędzia albo do końca. Stan niesie pytanie użytkownika i wyniki przez cały przebieg.", "remember": "LangGraph: węzły, drogi między nimi i wspólny stan.", "wrong": {"B": "Prompt, temperatura i klucz to konfiguracja LLM, nie definicja grafu.", "C": "Chunk, embedding i baza należą do RAG.", "D": "Wybór modelu i menedżera pakietów nie definiuje grafu stanów."}}}, {"n": 19, "d": "średnie", "c": "LangChain", "p": "Gdzie według notatek najpewniej sprawdzisz dokładne wersje zależności zainstalowane w projekcie kursu?", "o": {"A": "Wyłącznie w komentarzu wewnątrz PromptTemplate", "B": "Wyłącznie w temperature modelu", "C": "Wyłącznie w tagach runów LangSmith", "D": "W pliku lock zależności projektu (uv.lock)"}, "correct": "D", "why": "Dokładne wersje zależności sprawdza się w pliku lock (uv.lock).", "lesson": {"correct": "Plik lock utrwala dokładne wersje zainstalowanych pakietów. To najlepsze miejsce, by zobaczyć, co naprawdę siedzi w środowisku. Dzięki temu możesz odtworzyć setup zbliżony do kursu. Luźny zakres w deklaracji tego nie pokazuje tak precyzyjnie.", "example": "Chcesz wiedzieć, którą dokładnie wersję LangChain masz lokalnie. Otwierasz lock i czytasz wpis z numerem. Porównujesz go z 1.0.2 z materiału. Od razu wiesz, czy jesteś blisko nagrania.", "remember": "Dokładny numer szukaj w locku, nie w zgadywaniu.", "wrong": {"A": "PromptTemplate formatuje prompt. Nie jest rejestrem wersji zależności.", "B": "Temperature to parametr generowania, nie lista wersji pakietów.", "C": "Tagi LangSmith pomagają filtrować runy. Nie zastępują pliku lock."}}}, {"n": 20, "d": "łatwe", "c": "LLM", "p": "Czym jest PromptTemplate w programistycznym dostępie do LLM?", "o": {"A": "Bazą wektorową do wyszukiwania podobieństwa", "B": "Opakowaniem promptu, które przyjmuje parametry i formatuje wejście", "C": "Serwerem lokalnych modeli", "D": "Narzędziem do trenowania wag modelu"}, "correct": "B", "why": "PromptTemplate opakowuje prompt, przyjmuje parametry i formatuje wejście.", "lesson": {"correct": "PromptTemplate to szablon tekstu z miejscami do wypełnienia. Program podaje wartości, a szablon składa gotowy prompt. Ten sam szablon działa wiele razy z innymi danymi. Jako Runnable może wejść do łańcucha z modelem. Dlatego jest lepszy niż jednorazowy f-string bez kontraktu wejścia.", "example": "Szablon mówi: na podstawie information zrób krótkie podsumowanie i dwa fakty. Raz podajesz biografię osoby A, raz osoby B. Format zadania zostaje ten sam, zmienia się tylko treść.", "remember": "PromptTemplate to foremka, a parametry to nadzienie.", "wrong": {"A": "Baza wektorowa służy do wyszukiwania podobieństwa w RAG. PromptTemplate tylko przygotowuje tekst.", "C": "Serwerem lokalnych modeli może być Ollama. PromptTemplate buduje prompt, nie uruchamia serwera.", "D": "Szablon nie trenuje modelu i nie zmienia wag. Formatuje dane przed wywołaniem."}}}];
const quiz=document.querySelector("#quiz"),count=document.querySelector("#count"),results=document.querySelector("#results");
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
quiz.innerHTML=Q.map(q=>`<article class="card" id="card${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag">${q.d}</span><span class="tag">${q.c}</span></div><p class="prompt">${esc(q.p)}</p><div class="options">${["A","B","C","D"].map(l=>`<label class="opt"><input type="radio" name="q${q.n}" value="${l}"><span class="letter">${l})</span><span>${esc(q.o[l])}</span></label>`).join("")}<label class="opt idk"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span><strong>Nie mam pojęcia</strong> — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność: <select name="c${q.n}"><option value="">—</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join("")}</select></label><div class="feedback" id="feedback${q.n}" hidden></div></article>`).join("");
}
function collect(){
return Q.map(q=>({n:q.n,answer:quiz.querySelector(`input[name=q${q.n}]:checked`)?.value||"",confidence:quiz.querySelector(`select[name=c${q.n}]`).value||"—"}));
}
function lesson(q,mode,picked){
const l=q.lesson,parts=[];
if(mode==="bad"){parts.push(`<h3>BŁĄD · Twoja: ${picked} · Poprawna: ${q.correct}</h3><h4>Twoja odpowiedź</h4><p>${esc(l.wrong[picked])}</p>`);}
if(mode==="idk"){parts.push(`<h3>NIE WIEM · Poprawna: ${q.correct}</h3><p>Bez zgadywania — oto wyjaśnienie.</p>`);}
parts.push(`<h4>Poprawna myśl</h4><p>${esc(l.correct)}</p><h4>Przykład</h4><p>${esc(l.example)}</p><h4>Zapamiętaj</h4><p class="remember">${esc(l.remember)}</p>`);
return parts.join("");
}
let last=null;
function grade(){
const rows=collect(),missing=rows.filter(r=>!r.answer);
if(missing.length){alert("Brak odpowiedzi w pytaniach: "+missing.map(r=>r.n).join(", "));return null;}
let ok=0,idk=0;
const detail=rows.map(r=>{
const q=Q[r.n-1],isIdk=r.answer==="?",isOk=r.answer===q.correct;
if(isOk)ok++;if(isIdk)idk++;
const card=document.querySelector(`#card${r.n}`),box=document.querySelector(`#feedback${r.n}`);
card.className=`card ${isOk?"ok":isIdk?"learn":"bad"}`;box.hidden=false;
if(isOk){box.className="feedback okbox";box.innerHTML=`<h3>OK</h3><p>${esc(q.why)}</p>`;}
else if(isIdk){box.className="feedback learnbox";box.innerHTML=lesson(q,"idk",r.answer);}
else{box.className="feedback badbox";box.innerHTML=lesson(q,"bad",r.answer);}
return {...r,correct:q.correct,result:isOk?"OK":isIdk?"NIE WIEM":"BŁĄD",why:q.why,isOk};
});
const pct=Math.round(ok/Q.length*100);
document.querySelector("#score").textContent=`Wynik: ${ok}/20`;document.querySelector("#percent").textContent=`Skuteczność: ${pct}%`;document.querySelector("#idkCount").textContent=`Nie wiem: ${idk}`;document.querySelector("#status").textContent="Sprawdzono";results.classList.add("show");last={ok,idk,pct,detail};results.scrollIntoView({behavior:"smooth"});return last;
}
function download(name,text){
const a=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type:"text/markdown;charset=utf-8"}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}
function myAnswers(rows){
return [`# Moje odpowiedzi – ${DATE}`,"","| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |","|---|-----------------------------|---------------|-------|",...rows.map(r=>`| ${r.n} | ${r.answer} | ${r.confidence==="—"?"":r.confidence} | |`),"","## Notatki",""].join("\n");
}
function resultMd(g){
const strong=g.detail.filter(r=>r.isOk),review=g.detail.filter(r=>!r.isOk);
return [`# Wynik quizu — ${DATE}`,"","## Wynik","",`- Poprawne odpowiedzi: ${g.ok}/20`,`- Skuteczność: ${g.pct}%`,`- Nie wiem: ${g.idk}`,"","## Szczegóły","","| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |","|---|---|---|---|---|---|",...g.detail.map(r=>`| ${r.n} | ${r.answer} | ${r.correct} | ${r.result} | ${r.confidence} | ${r.why} |`),"","## Mocne strony","",strong.length?`- Poprawnie rozwiązane pytania: ${strong.map(r=>r.n).join(", ")}.`:"- Brak poprawnych odpowiedzi w tej próbie.","","## Obszary do powtórki","",...(review.length?review.map(r=>`- Pytanie ${r.n} (${r.result}): ${r.why}`):["- Brak — wszystkie odpowiedzi są poprawne."]),""].join("\n");
}
quiz.addEventListener("change",()=>count.textContent=collect().filter(r=>r.answer).length);
document.querySelector("#check").addEventListener("click",grade);
document.querySelector("#reset").addEventListener("click",()=>{quiz.reset();last=null;results.classList.remove("show");document.querySelector("#status").textContent="W trakcie";Q.forEach(q=>{const c=document.querySelector(`#card${q.n}`),f=document.querySelector(`#feedback${q.n}`);c.className="card";f.hidden=true;f.innerHTML="";});count.textContent="0";});
document.querySelector("#downloadAnswers").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_my_answers.md`,myAnswers(g.detail));});
document.querySelector("#downloadResults").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_results.md`,resultMd(g));});
render();
</script>
</body>
</html>

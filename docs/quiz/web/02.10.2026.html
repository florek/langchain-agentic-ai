const DATE="02.10.2026";
const Q=[{"n": 1, "d": "łatwe", "c": "LLM", "p": "Dlaczego sam LLM zwykle nie odpowie wiarygodnie na pytanie o dzisiejsze oferty pracy bez dodatkowego narzędzia?", "o": {"A": "Bo zawsze trenuje nowe wagi przy każdym pytaniu", "B": "Bo PromptTemplate kasuje dostęp do internetu", "C": "Bo model nie ma sam z siebie bieżącego dostępu do internetu", "D": "Bo temperature=0 wyłącza wszystkie API"}, "correct": "C", "why": "Sam LLM nie ma bieżącego dostępu do internetu; aktualne dane wymagają toola (np. web search).", "lesson": {"correct": "Model językowy uczy się na danych z przeszłości. Po treningu nie zagląda sam do sieci. Dlatego nie wie z dnia na dzień, jakie oferty właśnie wiszą na LinkedIn. Może zgadywać albo powtórzyć stare fakty. Żeby dostać świeże informacje, potrzebuje narzędzia. Web search to właśnie taki tool. Agent może zdecydować: najpierw wyszukam, potem odpowiem.", "example": "Wyobraź sobie pytanie: znajdź trzy oferty AI Engineer na dziś. Sam model mógłby wymyślić ładne nazwy firm. Z web search najpierw szuka w internecie. Dostaje prawdziwe wyniki. Potem pisze podsumowanie i dokłada linki. Użytkownik widzi aktualne oferty, a nie zgadywankę.", "remember": "Bez toola LLM nie patrzy do internetu — pamięć treningu to nie live search.", "wrong": {"A": "Model nie trenuje nowych wag przy każdym pytaniu użytkownika. To byłoby uczenie od zera, a tu chodzi o brak dostępu do sieci.", "B": "PromptTemplate tylko formatuje tekst promptu. Nie zabiera modelowi internetu, bo model i tak nie ma go sam z siebie.", "D": "Temperature wpływa na losowość odpowiedzi. Nie wyłącza API ani nie tłumaczy braku dostępu do sieci."}}}, {"n": 2, "d": "średnie", "c": "LLM", "p": "Które zadanie najbardziej typowo wymaga toola web search zamiast samej wiedzy z treningu?", "o": {"A": "Znalezienie aktualnych ofert pracy AI Engineer na LinkedIn", "B": "Wyjaśnienie, czym jest liczba pierwsza", "C": "Przetłumaczenie krótkiego zdania z angielskiego na polski", "D": "Poprawienie literówki w jednym wyrazie"}, "correct": "A", "why": "Aktualne oferty pracy zmieniają się i wymagają wyszukania, a nie samej wiedzy z treningu.", "lesson": {"correct": "Web search jest potrzebny, gdy dane szybko się zmieniają. Oferty pracy, ceny, wyniki sportowe, wiadomości — to przykłady. Wiedza z treningu może być stara. Agent powinien wtedy użyć narzędzia wyszukiwania. Potem buduje odpowiedź na świeżych wynikach. Do zadań językowych bez aktualności tool często nie jest konieczny.", "example": "Pytanie o definicję liczby pierwszej model zna z treningu. Pytanie o trzy oferty AI Engineer na LinkedIn wymaga dzisiejszych ogłoszeń. Agent włącza web search, zbiera wyniki i dopiero wtedy odpowiada. Bez wyszukiwania łatwo o zmyślone oferty.", "remember": "Zmieniające się fakty = często web search, nie sama pamięć modelu.", "wrong": {"B": "Definicja liczby pierwszej to wiedza stabilna. Nie wymaga bieżącego internetu.", "C": "Tłumaczenie krótkiego zdania to zadanie językowe. Nie potrzebuje aktualnych ofert z sieci.", "D": "Poprawa literówki nie wymaga wyszukiwania internetu. To lokalna edycja tekstu."}}}, {"n": 3, "d": "łatwe", "c": "LangChain", "p": "Czym jest PromptTemplate w programistycznym dostępie do modelu?", "o": {"A": "Bazą wektorową do indeksowania dokumentów", "B": "Serwerem lokalnych modeli open-weight", "C": "Narzędziem do trenowania wag od zera", "D": "Opakowaniem promptu z placeholderami, które przyjmuje parametry i formatuje wejście"}, "correct": "D", "why": "PromptTemplate opakowuje prompt, przyjmuje parametry i formatuje wejście do modelu.", "lesson": {"correct": "PromptTemplate to szablon tekstu. Ma miejsca do wypełnienia, na przykład information. Program podaje wartości, a szablon składa gotowy prompt. Ten sam szablon działa wiele razy z innymi danymi. Jako Runnable może wejść do łańcucha z modelem. Dlatego jest wygodniejszy niż jednorazowy f-string bez jasnego kontraktu wejścia.", "example": "Szablon mówi: na podstawie information zrób krótkie podsumowanie i dwa fakty. Raz podajesz biografię osoby A, raz osoby B. Format zadania zostaje ten sam. Zmienia się tylko treść wejścia.", "remember": "PromptTemplate to foremka, parametry to nadzienie.", "wrong": {"A": "Baza wektorowa służy do wyszukiwania podobieństwa w RAG. PromptTemplate tylko przygotowuje tekst.", "B": "Serwerem lokalnych modeli może być Ollama. PromptTemplate buduje prompt, nie uruchamia serwera.", "C": "Szablon nie trenuje modelu i nie zmienia wag. Formatuje dane przed wywołaniem."}}}, {"n": 4, "d": "trudne", "c": "LLM", "p": "Dlaczego w odpowiedzi agenta wyszukującego ważne są source URLs (linki do źródeł)?", "o": {"A": "Bo linki zastępują całkowicie potrzebę modelu językowego", "B": "Bo użytkownik może otworzyć źródło i zweryfikować, czy informacja naprawdę istnieje", "C": "Bo URL zawsze usuwa halucynacje bez żadnej weryfikacji człowieka", "D": "Bo źródła służą wyłącznie do zmiany temperature modelu"}, "correct": "B", "why": "Link źródła pozwala otworzyć oryginalną treść i sprawdzić, czy informacja naprawdę istnieje.", "lesson": {"correct": "Bez źródła dostajesz tylko tekst modelu. Tekst może brzmieć pewnie i nadal być zmyślony. Link pozwala wejść na stronę źródłową. Tam sprawdzasz, czy oferta albo fakt naprawdę istnieje. To zwiększa zaufanie do systemu. W wyszukiwaniu aktualnych danych źródła są częścią dobrej odpowiedzi. Treść plus URL to silniejszy pakiet niż sam opis.", "example": "Agent pisze: firma X szuka AI Engineera i dokłada link do ogłoszenia. Otwierasz URL i widzisz prawdziwe ogłoszenie. Bez linku mógłbyś tylko wierzyć modelowi na słowo. Jedno kliknięcie zmienia zgadywanie w sprawdzenie.", "remember": "Źródło = most do sprawdzenia, nie ozdoba odpowiedzi.", "wrong": {"A": "Linki nie zastępują LLM. Model nadal analizuje i podsumowuje. Źródła służą do weryfikacji.", "C": "Sam URL nic magicznie nie kasuje. Człowiek albo kolejny krok musi sprawdzić treść źródła.", "D": "Źródła nie służą do ustawiania temperature. Temperature to parametr losowości generowania."}}}, {"n": 5, "d": "średnie", "c": "LLM", "p": "Jak notatki opisują control flow w prostym chainie?", "o": {"A": "LLM samodzielnie wybiera dowolną kolejność wszystkich kroków", "B": "Kolejność jest losowana przy każdym invoke", "C": "Kolejność działań jest z góry ustalona przez programistę", "D": "Chain nie ma żadnych kroków ani kolejności"}, "correct": "C", "why": "W prostym chainie programista ustala z góry kolejność kroków (control flow jest hardcoded).", "lesson": {"correct": "Chain to ustalona sekwencja. Najpierw krok A, potem B, potem C. Programista wpisuje tę kolejność w kodzie. Model może pojawić się w jednym kroku, na przykład przy podsumowaniu. Ale model nie decyduje, czy najpierw wyszukać dane, czy od razu odpowiadać. Control flow jest z góry ustalony. Dlatego mówimy, że w chainie flow jest hardcoded.", "example": "Przepis na kanapkę: 1) weź chleb, 2) posmaruj masłem, 3) połóż ser. Zawsze w tej kolejności. Tak działa chain. Agent mógłby najpierw sprawdzić, czy jest ser, i dopiero potem zdecydować o kolejnych krokach.", "remember": "Chain: kolejność ustala programista, nie LLM.", "wrong": {"A": "Samodzielne ustalanie kolejności przez LLM to cecha agenta, nie prostego chaina.", "B": "Chain nie losuje kolejności. Ma ustaloną sekwencję kroków.", "D": "Chain właśnie ma kolejność — i to z góry zaplanowaną."}}}, {"n": 6, "d": "łatwe", "c": "LLM", "p": "Jak nazywa się zjawisko, gdy LLM generuje odpowiedź brzmiącą wiarygodnie, ale nieprawdziwą?", "o": {"A": "Halucynacja (hallucination)", "B": "Embedding", "C": "Chunking", "D": "Few-shot prompting"}, "correct": "A", "why": "Halucynacja to wiarygodnie brzmiąca, ale nieprawdziwa odpowiedź modelu.", "lesson": {"correct": "Halucynacja to zmyślona treść podana pewnym tonem. Model układa sensowne zdania. Brzmią logicznie. Wyglądają wiarygodnie. Ale fakt może być fałszywy. Dlatego przy aktualnych danych pokazujemy źródła. Użytkownik może sprawdzić oryginał. To ogranicza ryzyko slepej wiary w ładny tekst.", "example": "Model wymyśla nieistniejącą ofertę pracy z ładnym opisem technologiami LangChain i RAG. Brzmi jak prawdziwe ogłoszenie. Bez linku łatwo uwierzyć. Z URL-em od razu widać, czy ogłoszenie istnieje.", "remember": "Ładny tekst ≠ prawda — sprawdzaj źródła.", "wrong": {"B": "Embedding to wektorowa reprezentacja tekstu do podobieństwa. To nie nazwa zmyślania faktów.", "C": "Chunking to dzielenie dokumentów na fragmenty. Nie oznacza fałszywej odpowiedzi.", "D": "Few-shot to przykłady w prompcie. Nie nazywa zjawiska nieprawdziwej, ale wiarygodnej odpowiedzi."}}}, {"n": 7, "d": "średnie", "c": "LLM", "p": "Co oznacza Generative UI w kontekście demonstracji z agentem wyszukującym?", "o": {"A": "Trenowanie nowego modelu UI od zera przy każdym zapytaniu", "B": "Interfejs tworzony lub dostosowywany dynamicznie w zależności od tego, co agent aktualnie wykonuje", "C": "Wyłącznie statyczny HTML bez żadnych kart i linków", "D": "Wyłączenie wszystkich tools na rzecz samego tekstu"}, "correct": "B", "why": "Generative UI to interfejs tworzony lub dostosowywany dynamicznie do tego, co agent robi.", "lesson": {"correct": "Odpowiedź agenta nie musi być samym akapitem. Aplikacja może budować karty, przyciski, logo i linki. Interfejs dopasowuje się do wyniku wyszukiwania. To nazywamy Generative UI. Użytkownik dostaje bogatszą prezentację. Nadal może kliknąć źródło. Tekst i elementy UI idą razem.", "example": "Agent znajduje trzy oferty. Zamiast ściany tekstu pojawiają się karty: stanowisko, firma, logo serwisu, opis i link. Jedno spojrzenie mówi więcej niż sam paragraf. To właśnie dynamiczny interfejs wokół wyniku agenta.", "remember": "Generative UI = wynik agenta jako żywy interfejs, nie tylko tekst.", "wrong": {"A": "Nie trenujemy nowego modelu UI przy każdym pytaniu. Chodzi o dynamiczne elementy na podstawie wyniku.", "C": "Wręcz przeciwnie: demonstracja pokazuje karty, linki i bogatszy UI niż sam tekst.", "D": "Generative UI nie wyłącza tools. Często pokazuje efekty działania tools."}}}, {"n": 8, "d": "trudne", "c": "LLM", "p": "W pętli ReAct, co dzieje się zaraz po wykonaniu toola?", "o": {"A": "Agent zawsze kończy pracę bez dalszej analizy wyniku", "B": "Programista ręcznie wybiera następne narzędzie zamiast modelu", "C": "Model kasuje całą historię rozumowania", "D": "Agent otrzymuje observation (wynik toola), a wynik wraca do LLM do kolejnej decyzji"}, "correct": "D", "why": "Po toolu agent dostaje observation; wynik wraca do LLM, który decyduje o kolejnym kroku.", "lesson": {"correct": "ReAct działa w cyklu: myślenie, działanie, obserwacja. Po wywołaniu toola pojawia się wynik. Ten wynik nazywamy observation. Observation wraca do modelu. Model pyta siebie: czy mam już odpowiedź, czy potrzebuję kolejnej akcji. Jeśli nie, pętla idzie dalej. Jeśli tak, powstaje final answer. Bez observation agent nie wiedziałby, co tool naprawdę zwrócił.", "example": "Agent szuka CEO firmy X. Tool zwraca: CEO to osoba Y. To observation. Model myśli dalej: teraz potrzebuję wieku Y. Woła kolejne wyszukiwanie. Dostaje 52 lata. Dopiero wtedy kończy: CEO ma 52 lata.", "remember": "Po Act zawsze Observe, potem znowu Reason.", "wrong": {"A": "Agent nie musi kończyć zaraz po toolu. Często potrzebuje kolejnych kroków.", "B": "W ReAct o kolejnym kroku decyduje LLM, nie ręczne wybieranie toola przez programistę w trakcie pętli.", "C": "Wynik toola ma trafić do modelu. Kasowanie historii rozumowania nie jest kolejnym krokiem pętli."}}}, {"n": 9, "d": "średnie", "c": "Narzędzia", "p": "Dlaczego klucza API nie należy zapisywać w kodzie ani commitować pliku `.env`?", "o": {"A": "Bo grozi ujawnieniem sekretu; klucz powinien zostać w zmiennej środowiskowej", "B": "Bo PromptTemplate przestanie być Runnable", "C": "Bo lokalny serwer modeli usunie wszystkie modele", "D": "Bo temperature wzrośnie automatycznie"}, "correct": "A", "why": "Commit sekretu grozi wyciekiem; klucz ma zostać w zmiennej środowiskowej.", "lesson": {"correct": "Klucz API otwiera usługę na Twoim koncie. Jeśli trafi do Gita, ktoś może go zobaczyć i użyć. Dlatego trzymasz go w lokalnym .env albo innej zmiennej środowiska. Sam .env powinien być ignorowany przez Git. W repo może zostać szablon pustych nazw.", "example": "Program woła load_dotenv i czyta klucz z środowiska. W repozytorium jest kod, ale nie ma prawdziwej wartości sekretu. Dzięki temu ćwiczenie działa lokalnie bez ujawniania hasła w historii Gita.", "remember": "Sekret do środowiska, nigdy do kodu ani commita.", "wrong": {"B": "PromptTemplate pozostaje Runnable niezależnie od miejsca klucza. Problem to bezpieczeństwo.", "C": "Plik .env nie steruje usuwaniem lokalnych modeli.", "D": "Temperature ustawiasz w konfiguracji modelu. Wyciek klucza jej nie podnosi."}}}, {"n": 10, "d": "łatwe", "c": "LLM", "p": "Jak notatki opisują wiedzę modelu względem danych treningowych?", "o": {"A": "Model automatycznie odświeża internet co godzinę", "B": "Model zawsze zna przyszłe wydarzenia sprzed treningu", "C": "Wiedza modelu jest zasadniczo statyczna względem danych, na których został wytrenowany", "D": "Model sam wykonuje Google search bez toola"}, "correct": "C", "why": "Wiedza modelu jest zasadniczo statyczna względem danych treningowych.", "lesson": {"correct": "Model uczy się na zbiorze danych zebranym do pewnego momentu. Po zakończeniu treningu ta wiedza nie aktualizuje się sama. Nie wie automatycznie, co wydarzyło się później. Nie otwiera Google bez toola. Dlatego rozróżniamy wiedzę modelu i aktualne dane z zewnątrz. Web search dokłada świeże informacje do rozumowania LLM.", "example": "Model wytrenowany dawno temu może nie znać dzisiejszych ofert pracy. Pytasz o LinkedIn na teraz. Bez toola zgaduje. Z web search pobiera bieżące wyniki i dopiero wtedy odpowiada.", "remember": "Wiedza z treningu stoi w miejscu — świeżość daje tool.", "wrong": {"A": "Model nie odświeża internetu co godzinę sam z siebie. Potrzebuje zewnętrznego toola.", "B": "Model nie zna przyszłych wydarzeń po dacie zbierania danych treningowych.", "D": "Sam LLM nie wykonuje Google search. Do tego służy tool."}}}, {"n": 11, "d": "trudne", "c": "LLM", "p": "Czym search agent różni się od klasycznej wyszukiwarki zwracającej listę linków?", "o": {"A": "Agent zwraca wyłącznie surowe URL-e bez analizy", "B": "Agent może wyszukać, przeczytać, porównać, wybrać, podsumować i podać źródła", "C": "Agent nigdy nie może podać źródeł", "D": "Agent działa wyłącznie bez LLM"}, "correct": "B", "why": "Search agent nie tylko listuje linki: analizuje, porównuje, podsumowuje i podaje źródła.", "lesson": {"correct": "Klasyczna wyszukiwarka daje listę linków. Ty sam czytasz i wybierasz. Search agent idzie dalej. Może wyszukać, przeczytać wyniki, porównać je i wybrać istotne. Potem robi podsumowanie. Na końcu dokłada źródła. To łączy wyszukiwanie z rozumowaniem LLM. Dlatego agent jest mocniejszy niż surowa lista URL-i.", "example": "Pytasz o trzy oferty AI Engineer. Wyszukiwarka pokazuje dziesięć linków. Agent wybiera trzy sensowne, streszcza wymagania i dokłada URL-e. Dostajesz gotowe podsumowanie plus możliwość sprawdzenia źródła.", "remember": "Wyszukiwarka listuje; agent listuje, myśli i podsumowuje.", "wrong": {"A": "To opis bardziej klasycznej listy linków. Agent właśnie ma iść dalej niż same URL-e.", "C": "Notatki podkreślają, że dobre odpowiedzi agenta zawierają źródła.", "D": "Agent korzysta z LLM do decyzji i podsumowań. Bez modelu nie byłby tym samym systemem."}}}, {"n": 12, "d": "średnie", "c": "LangChain", "p": "Co zwykle dzieje się w łańcuchu LCEL zapisanym jako `prompt | model`?", "o": {"A": "Model jest trenowany od zera na treści promptu", "B": "Operator tworzy automatycznie serwer MCP", "C": "Historia rozmowy jest zawsze zapisywana w Pinecone", "D": "Wynik wypełnienia szablonu staje się wejściem modelu w złożonym obiekcie Runnable"}, "correct": "D", "why": "LCEL przekazuje wynik szablonu jako wejście modelu w obiekcie Runnable.", "lesson": {"correct": "Operator pionowej kreski składa kroki w kolejność. Najpierw szablon dostaje dane i buduje prompt. Potem wynik idzie do modelu. Całość to jeden Runnable. Wywołujesz go przez invoke ze słownikiem wejściowym. To podstawowy wzorzec prompt, potem model.", "example": "Szablon ma miejsce na information. Podajesz biografię w słowniku. Szablon wypełnia lukę, a model dostaje gotową instrukcję: zrób summary i dwa fakty.", "remember": "LCEL pipe: wynik lewej strony podaj prawej.", "wrong": {"A": "Wywołanie łańcucha nie trenuje modelu. Model generuje odpowiedź.", "B": "MCP to standard narzędzi i kontekstu. Operator LCEL go nie uruchamia.", "C": "Pinecone to baza wektorowa. Prosty łańcuch prompt|model nie zapisuje tam historii automatycznie."}}}, {"n": 13, "d": "trudne", "c": "LLM", "p": "Dlaczego źródła i możliwość weryfikacji są szczególnie ważne w systemach agentowych?", "o": {"A": "Bo agent może podejmować kolejne decyzje na podstawie danych; błędne dane mogą psuć kolejne kroki", "B": "Bo źródła zastępują całkowicie pętlę ReAct", "C": "Bo bez źródeł model nie może mieć temperature", "D": "Bo źródła służą wyłącznie do formatowania kodu Blackiem"}, "correct": "A", "why": "Błędne dane z internetu mogą psuć kolejne decyzje agenta, stąd waga źródeł i weryfikacji.", "lesson": {"correct": "Agent nie zawsze kończy na jednej odpowiedzi. Może wykonać kilka kroków. Każdy krok buduje na poprzednim. Jeśli pierwszy wynik z sieci jest zły, kolejne decyzje też mogą być złe. Dlatego źródła i weryfikacja są krytyczne. Użytkownik albo system mogą sprawdzić dane. To chroni cały łańcuch działań, nie tylko jeden akapit tekstu.", "example": "Agent najpierw znajduje złą firmę jako pracodawcę. Potem na tej podstawie szuka wymagań i pisze plan aplikacji. Cały plan stoi na fałszywym fundamencie. Gdyby od razu widać było źródło, ktoś mógłby wyłapać błąd wcześniej.", "remember": "Złe dane na wejściu = złe decyzje później — sprawdzaj źródła.", "wrong": {"B": "Źródła nie zastępują ReAct. ReAct to pętla rozumowania i działania. Źródła pomagają weryfikować dane.", "C": "Temperature działa niezależnie od podawania URL-i. To inny parametr.", "D": "Black formatuje kod. Nie jest powodem podawania źródeł w odpowiedzi agenta."}}}, {"n": 14, "d": "łatwe", "c": "LLM", "p": "Od jakich słów pochodzi nazwa architektury ReAct?", "o": {"A": "Retrieval + Caching", "B": "Routing + Evaluation", "C": "Reasoning + Acting", "D": "Rendering + Acceleration"}, "correct": "C", "why": "ReAct pochodzi od Reasoning + Acting (rozumowanie + działanie).", "lesson": {"correct": "ReAct to skrót od Reasoning plus Acting. Po polsku: rozumowanie plus działanie. Najpierw model myśli, czego potrzebuje. Potem wykonuje akcję, zwykle przez tool. Potem patrzy na wynik. I tak w kółko, aż rozwiąże zadanie. Nazwa ma przypominać te dwie części: myśl i działaj.", "example": "Pytanie: ile lat ma CEO firmy X. Reason: muszę wiedzieć, kto jest CEO. Act: wyszukaj CEO. Observation: to osoba Y. Reason: teraz wiek Y. Act: wyszukaj wiek. Final: 52 lata.", "remember": "ReAct = Reasoning + Acting.", "wrong": {"A": "Retrieval i caching dotyczą raczej wyszukiwania dokumentów i pamięci podręcznej, nie nazwy ReAct.", "B": "Routing i evaluation to inne pojęcia. Nie składają nazwy ReAct.", "D": "Rendering i acceleration nie mają związku z nazwą tej architektury agentowej."}}}, {"n": 15, "d": "średnie", "c": "LangSmith", "p": "Co jest potrzebne oprócz `LANGSMITH_TRACING=true`, aby ślady wywołań trafiały do LangSmith?", "o": {"A": "Wyłącznie formatowanie kodu przez Black", "B": "Ustawiony `LANGSMITH_API_KEY`", "C": "Wyłącznie `temperature=1`", "D": "Wyłącznie baza FAISS bez klucza"}, "correct": "B", "why": "Do wysyłania trace’ów potrzebny jest też LANGSMITH_API_KEY.", "lesson": {"correct": "Tracing ma włącznik i klucz. LANGSMITH_TRACING=true mówi: wysyłaj ślady. LANGSMITH_API_KEY mówi: na jakie konto. Bez klucza włącznik nie ma autoryzacji. Oba elementy działają razem po załadowaniu środowiska.", "example": "Masz TRACING=true, ale pusty API key. Uruchamiasz chain.invoke i panel jest pusty. Dopisujesz poprawny klucz, ładujesz środowisko i ślady pojawiają się w projekcie.", "remember": "Tracing = włącznik true + klucz LangSmith.", "wrong": {"A": "Black formatuje kod. Nie autoryzuje wysyłania trace’ów.", "C": "Temperature steruje losowością odpowiedzi, nie tracingiem.", "D": "FAISS to baza wektorowa do RAG. Nie zastępuje klucza LangSmith."}}}, {"n": 16, "d": "trudne", "c": "LLM", "p": "Jaki typowy workflow search agenta opisują notatki po otrzymaniu pytania wymagającego aktualnych danych?", "o": {"A": "LLM ocenia potrzebę internetu → web search → analiza wyników → odpowiedź ze źródłami", "B": "Model od razu kończy bez toola, a źródła dodaje programista ręcznie poza systemem", "C": "Agent kasuje pytanie użytkownika i generuje losowe linki", "D": "Web search uruchamia się dopiero po final answer"}, "correct": "A", "why": "Typowy przebieg: ocena potrzeby → web search → analiza → odpowiedź ze źródłami.", "lesson": {"correct": "Najpierw użytkownik zadaje pytanie. LLM ocenia, czy potrzebuje aktualnych danych. Jeśli tak, woła web search. Dostaje wyniki. Potem analizuje i wybiera istotne informacje. Na końcu generuje odpowiedź i dokłada źródła. To łączy decyzję modelu z narzędziem i weryfikowalnym wynikiem. Schemat jest bliski ReAct: reason, act, observe, answer.", "example": "Pytanie: znajdź trzy oferty AI Engineer. Model decyduje: potrzebuję internetu. Woła web search. Czyta wyniki. Wybiera trzy. Pisze podsumowanie z linkami. Użytkownik dostaje treść plus URL-e do sprawdzenia.", "remember": "Najpierw decyzja, potem search, potem analiza i odpowiedź ze źródłami.", "wrong": {"B": "Cały sens agenta jest taki, że model sam może użyć toola. Źródła mają powstać w odpowiedzi systemu, nie tylko poza nim.", "C": "Agent nie kasuje pytania ani nie rzuca losowymi linkami. Ma analizować wyniki.", "D": "Web search jest przed finalną odpowiedzią, nie po niej. Wyniki mają wejść do rozumowania."}}}, {"n": 17, "d": "średnie", "c": "LLM", "p": "Jaką metaforą notatki opisują rolę LLM i tools w agencie?", "o": {"A": "LLM = baza wektorowa, tools = embeddingi", "B": "LLM = plik lock, tools = zakres zależności", "C": "LLM = wyłącznie parser, tools = wyłącznie PromptTemplate", "D": "LLM = mózg (decyduje), tools = ręce (wykonują operacje)"}, "correct": "D", "why": "Metafora: LLM = mózg (decyzje), tools = ręce (konkretne operacje).", "lesson": {"correct": "Notatki używają prostej metafory. LLM jest jak mózg. Myśli i decyduje, co zrobić. Tools są jak ręce. Wykonują konkretną operację: wywołanie API, wyszukanie, zapis. Mózg bez rąk tylko planuje. Ręce bez mózgu nie wiedzą, co robić. Razem dają działający system agentowy.", "example": "Mózg mówi: sprawdź pogodę w Londynie. Ręce wołają API pogodowe. Mózg dostaje 12 stopni i pisze odpowiedź użytkownikowi. Bez rąk zostałby przy samym zgadywaniu tekstu.", "remember": "LLM myśli, tools robią.", "wrong": {"A": "Baza wektorowa i embeddingi należą do RAG. To nie metafora LLM i tools z tej lekcji.", "B": "Lock i zakres dotyczą wersji pakietów, nie ról w agencie.", "C": "LLM nie jest tylko parserem, a tools nie są PromptTemplate. PromptTemplate formatuje tekst wejściowy."}}}, {"n": 18, "d": "łatwe", "c": "LLM", "p": "Czym jest web search w architekturze agenta według notatek?", "o": {"A": "Jedynym możliwym toollem w całym ekosystemie GenAI", "B": "Zastępnikiem PromptTemplate", "C": "Jednym z możliwych tools (obok calculator, database, API itd.)", "D": "Mechanizmem trenowania wag modelu"}, "correct": "C", "why": "Web search to jeden z wielu możliwych tools obok calculator, database, API itd.", "lesson": {"correct": "Tool to zewnętrzna funkcja lub system. Web search jest jednym przykładem. Obok niego mogą być calculator, baza danych, email, kalendarz, Python, API albo system plików. Agent dostaje zestaw narzędzi. Sam wybiera, którego potrzebuje. Web search pasuje do aktualnych faktów z internetu. Inne tools pasują do innych zadań.", "example": "Przy pytaniu o oferty pracy agent bierze web search. Przy pytaniu ile to 17 razy 24 może wziąć calculator. Te same ramy agenta, różne narzędzia.", "remember": "Web search to jeden tool w skrzynce, nie cała skrzynka.", "wrong": {"A": "Nie jest jedynym toollem. Notatki wymieniają wiele innych możliwości.", "B": "PromptTemplate formatuje prompt. Web search pobiera dane z internetu. To różne rzeczy.", "D": "Web search nie trenuje wag modelu. Dostarcza wyniki wyszukiwania."}}}, {"n": 19, "d": "średnie", "c": "LangChain", "p": "Jaka jest praktyczna różnica między `ChatOpenAI` a `ChatOllama` przy tym samym promptcie i łańcuchu?", "o": {"A": "`ChatOpenAI` działa tylko offline, a `ChatOllama` tylko w chmurze", "B": "Zmienia się backend modelu (API chmurowe vs lokalny serwer), a logika zadania może zostać ta sama", "C": "`ChatOllama` kasuje PromptTemplate", "D": "Tylko `ChatOpenAI` obsługuje `invoke`"}, "correct": "B", "why": "Ten sam prompt i łańcuch mogą działać na innym backendzie; zmienia się głównie obiekt modelu.", "lesson": {"correct": "LangChain oddziela zadanie od dostawcy modelu. PromptTemplate i łańcuch LCEL mogą zostać. Zmieniasz obiekt LLM: ChatOpenAI albo ChatOllama. Jeden mówi do API w chmurze. Drugi mówi do lokalnego serwera Ollama. Idea jest taka, że modele da się podmieniać stosunkowo łatwo.", "example": "Masz łańcuch summary_prompt | llm. Najpierw llm to ChatOpenAI. Potem wstawiasz ChatOllama z lokalną Gemmą. Invoke ze słownikiem information wygląda podobnie.", "remember": "Zmieniasz model, nie całe zadanie.", "wrong": {"A": "Jest odwrotnie w typowym setupie: OpenAI jest w chmurze, Ollama lokalnie.", "C": "ChatOllama nie kasuje PromptTemplate. Szablon zostaje.", "D": "Invoke działa dla Runnable niezależnie od wybranego backendu chat."}}}, {"n": 20, "d": "trudne", "c": "LLM", "p": "Na czym polega pułapka „lost in the middle” w context engineeringu?", "o": {"A": "Model zawsze ignoruje początek i koniec kontekstu", "B": "Każdy dokument RAG musi mieć dokładnie 90 tokenów", "C": "Tracing LangSmith działa tylko dla środkowych kroków chaina", "D": "Modele gorzej wykorzystują informacje ze środka długiego kontekstu; kluczowe dane lepiej umieszczać na początku lub końcu"}, "correct": "D", "why": "„Lost in the middle”: informacje ze środka długiego kontekstu są gorzej wykorzystywane.", "lesson": {"correct": "Okno kontekstu to cała treść, którą model widzi naraz. Gdy jest bardzo długa, środek bywa gorzej wykorzystywany. To nazywamy lost in the middle. Dlatego ważne fakty lepiej stawiać na początku albo na końcu. Context engineering dba o to, co i w jakiej kolejności trafia do modelu.", "example": "Masz długą historię rozmowy i dokumenty. Najważniejszą regułę biznesową wkładasz na sam koniec promptu. Model częściej ją zauważa, niż gdy schowasz ją głęboko w środku ściany tekstu.", "remember": "W długim kontekście środek łatwiej ginie — ważne na brzegach.", "wrong": {"A": "Pułapka dotyczy środka, nie tego, że zawsze ignorowany jest początek i koniec.", "B": "Nie ma reguły, że każdy dokument musi mieć dokładnie 90 tokenów.", "C": "Tracing LangSmith nie ogranicza się do środkowych kroków. To osobny temat obserwowalności."}}}];
const quiz=document.querySelector("#quiz"),count=document.querySelector("#count"),results=document.querySelector("#results");
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
quiz.innerHTML=Q.map(q=>`<article class="card" id="card${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag">${q.d}</span><span class="tag">${q.c}</span></div><p class="prompt">${esc(q.p)}</p><div class="options">${["A","B","C","D"].map(l=>`<label class="opt"><input type="radio" name="q${q.n}" value="${l}"><span class="letter">${l})</span><span>${esc(q.o[l])}</span></label>`).join("")}<label class="opt idk"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span><strong>Nie mam pojęcia</strong> — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność: <select name="c${q.n}"><option value="">—</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join("")}</select></label><div class="feedback" id="feedback${q.n}" hidden></div></article>`).join("");
}
function collect(){
return Q.map(q=>({n:q.n,answer:quiz.querySelector(`input[name=q${q.n}]:checked`)?.value||"",confidence:quiz.querySelector(`select[name=c${q.n}]`).value||"—"}));
}
function lesson(q,mode,picked){
const l=q.lesson,parts=[];
if(mode==="bad"){parts.push(`<h3>BŁĄD · Twoja: ${picked} · Poprawna: ${q.correct}</h3><h4>Twoja odpowiedź</h4><p>${esc(l.wrong[picked])}</p>`);}
if(mode==="idk"){parts.push(`<h3>NIE WIEM · Poprawna: ${q.correct}</h3><p>Bez zgadywania — oto wyjaśnienie.</p>`);}
parts.push(`<h4>Poprawna myśl</h4><p>${esc(l.correct)}</p><h4>Przykład</h4><p>${esc(l.example)}</p><h4>Zapamiętaj</h4><p class="remember">${esc(l.remember)}</p>`);
return parts.join("");
}
let last=null;
function grade(){
const rows=collect(),missing=rows.filter(r=>!r.answer);
if(missing.length){alert("Brak odpowiedzi w pytaniach: "+missing.map(r=>r.n).join(", "));return null;}
let ok=0,idk=0;
const detail=rows.map(r=>{
const q=Q[r.n-1],isIdk=r.answer==="?",isOk=r.answer===q.correct;
if(isOk)ok++;if(isIdk)idk++;
const card=document.querySelector(`#card${r.n}`),box=document.querySelector(`#feedback${r.n}`);
card.className=`card ${isOk?"ok":isIdk?"learn":"bad"}`;box.hidden=false;
if(isOk){box.className="feedback okbox";box.innerHTML=`<h3>OK</h3><p>${esc(q.why)}</p>`;}
else if(isIdk){box.className="feedback learnbox";box.innerHTML=lesson(q,"idk",r.answer);}
else{box.className="feedback badbox";box.innerHTML=lesson(q,"bad",r.answer);}
return {...r,correct:q.correct,result:isOk?"OK":isIdk?"NIE WIEM":"BŁĄD",why:q.why,isOk};
});
const pct=Math.round(ok/Q.length*100);
document.querySelector("#score").textContent=`Wynik: ${ok}/20`;document.querySelector("#percent").textContent=`Skuteczność: ${pct}%`;document.querySelector("#idkCount").textContent=`Nie wiem: ${idk}`;document.querySelector("#status").textContent="Sprawdzono";results.classList.add("show");last={ok,idk,pct,detail};results.scrollIntoView({behavior:"smooth"});return last;
}
function download(name,text){
const a=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type:"text/markdown;charset=utf-8"}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}
function myAnswers(rows){
return [`# Moje odpowiedzi – ${DATE}`,"","| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |","|---|-----------------------------|---------------|-------|",...rows.map(r=>`| ${r.n} | ${r.answer} | ${r.confidence==="—"?"":r.confidence} | |`),"","## Notatki",""].join("\n");
}
function resultMd(g){
const strong=g.detail.filter(r=>r.isOk),review=g.detail.filter(r=>!r.isOk);
return [`# Wynik quizu — ${DATE}`,"","## Wynik","",`- Poprawne odpowiedzi: ${g.ok}/20`,`- Skuteczność: ${g.pct}%`,`- Nie wiem: ${g.idk}`,"","## Szczegóły","","| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |","|---|---|---|---|---|---|",...g.detail.map(r=>`| ${r.n} | ${r.answer} | ${r.correct} | ${r.result} | ${r.confidence} | ${r.why} |`),"","## Mocne strony","",strong.length?`- Poprawnie rozwiązane pytania: ${strong.map(r=>r.n).join(", ")}.`:"- Brak poprawnych odpowiedzi w tej próbie.","","## Obszary do powtórki","",...(review.length?review.map(r=>`- Pytanie ${r.n} (${r.result}): ${r.why}`):["- Brak — wszystkie odpowiedzi są poprawne."]),""].join("\n");
}
quiz.addEventListener("change",()=>count.textContent=collect().filter(r=>r.answer).length);
document.querySelector("#check").addEventListener("click",grade);
document.querySelector("#reset").addEventListener("click",()=>{quiz.reset();last=null;results.classList.remove("show");document.querySelector("#status").textContent="W trakcie";Q.forEach(q=>{const c=document.querySelector(`#card${q.n}`),f=document.querySelector(`#feedback${q.n}`);c.className="card";f.hidden=true;f.innerHTML="";});count.textContent="0";});
document.querySelector("#downloadAnswers").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_my_answers.md`,myAnswers(g.detail));});

<html lang="pl">
<head>
<meta charset="UTF-8" />

<title>LangChain Agentic AI Quiz — 23.09.2026</title>
<style>
:root {
  --bg: #f0f4f8;
  --bg-accent: #e2eef6;
  --surface: #ffffff;
  --surface-2: #eef3f7;
  --border: #c5d0db;
  --text: #1a2332;
  --muted: #5a6a7a;
  --accent: #0d6e6e;
  --accent-soft: #d4ecec;
  --accent-hover: #0a5555;
  --ok: #1a7f4b;
  --ok-bg: #e6f5ec;
  --bad: #b42318;
  --bad-bg: #fcebea;
  --easy: #1d6fa5;
  --mid: #b45309;
  --hard: #9f1239;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(26, 35, 50, 0.04), 0 8px 24px rgba(26, 35, 50, 0.06);
  --font-display: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
  background:
    radial-gradient(ellipse 65% 40% at 0% 0%, #d4e8e8 0%, transparent 55%),
    radial-gradient(ellipse 50% 35% at 100% 0%, #d6e4f0 0%, transparent 50%),
    var(--bg);
  line-height: 1.55;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
header {
  margin-bottom: 1.75rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
}
header .eyebrow {
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  margin: 0 0 0.4rem;
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.75rem, 4vw, 2.35rem);
  margin: 0 0 0.5rem;
  letter-spacing: -0.02em;
  color: #1a2332;
}
.sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
.progress {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 1rem;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1rem;
  margin: 0 0 1.5rem;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.progress strong { color: var(--accent); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
}
.card.ok {
  border-color: color-mix(in srgb, var(--ok) 45%, var(--border));
  background: linear-gradient(180deg, var(--ok-bg), var(--surface) 40%);
}
.card.bad {
  border-color: color-mix(in srgb, var(--bad) 40%, var(--border));
  background: linear-gradient(180deg, var(--bad-bg), var(--surface) 40%);
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 0.65rem;
}
.tag {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.22rem 0.55rem;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--border);
}
.tag.diff-łatwe { color: var(--easy); background: #e8f3fa; border-color: #c5dde9; }
.tag.diff-średnie { color: var(--mid); background: #faf0e4; border-color: #ead5b8; }
.tag.diff-trudne { color: var(--hard); background: #fce8ef; border-color: #e9c0cd; }
.q-title {
  font-family: var(--font-display);
  font-size: 1.15rem;
  margin: 0 0 0.9rem;
  font-weight: 600;
}
.q-title .num { color: var(--accent); margin-right: 0.35rem; }
.prompt { margin: 0 0 1rem; white-space: pre-wrap; }
.options { display: grid; gap: 0.45rem; }
label.opt {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  padding: 0.7rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  background: #f7fafc;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
label.opt:hover {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  background: var(--accent-soft);
}
label.opt:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
}
label.opt input { margin-top: 0.25rem; accent-color: var(--accent); }
.letter {
  font-weight: 700;
  color: var(--accent);
  min-width: 1.1rem;
}
.confidence {
  margin-top: 0.85rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
  color: var(--muted);
  font-size: 0.85rem;
}
.confidence select {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.35rem 0.55rem;
}
.why {
  margin-top: 0.85rem;
  padding: 0.8rem 0.95rem;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: 0.9rem;
  color: var(--muted);
}
.why strong { color: var(--text); }
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-top: 1.5rem;
  position: sticky;
  bottom: 1rem;
}
button, .btn {
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  padding: 0.8rem 1.25rem;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
button.primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(13, 110, 110, 0.25);
}
button.primary:hover { background: var(--accent-hover); }
button.ghost, .btn.ghost {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
button.ghost:hover, .btn.ghost:hover {
  border-color: var(--accent);
  color: var(--accent);
}
#results { display: none; margin-bottom: 1.5rem; }
#results.show { display: block; }
#results .score-line {
  font-family: var(--font-display);
  font-size: 1.75rem;
  margin: 0 0 0.35rem;
}
#results .score-line span { color: var(--accent); }
.hint { color: var(--muted); font-size: 0.85rem; margin: 0.5rem 0 0; }
code {
  font-size: 0.9em;
  background: var(--surface-2);
  padding: 0.1em 0.35em;
  border-radius: 4px;
  border: 1px solid var(--border);
}
</style>
</head>

const form = document.getElementById('quiz-form');
const answeredCount = document.getElementById('answered-count');

const resultsEl = document.getElementById('results');
let graded = false;
let lastGrade = null;

function esc(s) {
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}

function renderForm() {
  form.innerHTML = QUIZ.questions.map(q => {
    const opts = ['A','B','C','D'].map(L => `
      <label class="opt">
        <input type="radio" name="q${q.n}" value="${L}" />
        <span class="letter">${L})</span>
        <span>${esc(q.options[L] || '')}</span>
      </label>`).join('');
    return `
      <article class="card" id="card-${q.n}" data-n="${q.n}">
        <div class="meta">
          <span class="tag">#${q.n}</span>
          <span class="tag diff-${esc(q.difficulty)}">${esc(q.difficulty)}</span>
          <span class="tag">${esc(q.category)}</span>
        </div>
        <h2 class="q-title"><span class="num">${q.n}.</span></h2>
        <p class="prompt">${esc(q.prompt)}</p>
        <div class="options">${opts}</div>
        <div class="confidence">
          <span>Pewność:</span>
          <select name="c${q.n}" aria-label="Pewność pytania ${q.n}">
            <option value="">—</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        <div class="why" id="why-${q.n}" hidden></div>
      </article>`;
  }).join('');
}

function collect() {
  return QUIZ.questions.map(q => {
    const picked = form.querySelector(`input[name="q${q.n}"]:checked`);
    const conf = form.querySelector(`select[name="c${q.n}"]`);
    return {
      n: q.n,
      answer: picked ? picked.value : '',
      confidence: conf && conf.value ? conf.value : '—',
    };
  });
}

function updateProgress() {
  const n = collect().filter(x => x.answer).length;
  answeredCount.textContent = String(n);
}

function grade() {
  const rows = collect();
  const missing = rows.filter(r => !r.answer).map(r => r.n);
  if (missing.length) {
    alert('Brak odpowiedzi w pytaniach: ' + missing.join(', '));
    return null;
  }
  let ok = 0;
  const detail = rows.map(r => {
    const key = QUIZ.answers[r.n];
    const correct = key.correct;
    const isOk = r.answer === correct;
    if (isOk) ok += 1;
    const card = document.getElementById('card-' + r.n);
    const why = document.getElementById('why-' + r.n);
    card.classList.remove('ok', 'bad');
    card.classList.add(isOk ? 'ok' : 'bad');
    why.hidden = false;
    why.innerHTML = `<strong>${isOk ? 'OK' : 'BŁĄD'}</strong> · Twoja: ${r.answer} · Poprawna: ${correct}<br>${esc(key.why)}`;
    return { ...r, correct, isOk, why: key.why };
  });
  const pct = Math.round((ok / 20) * 100);
  document.getElementById('score-text').textContent = `${ok}/20`;
  document.getElementById('pct-text').textContent = `Skuteczność: ${pct}%`;
  resultsEl.classList.add('show');
  statusLabel.textContent = 'Sprawdzono';
  graded = true;
  lastGrade = { ok, pct, detail };
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  return lastGrade;
}

function download(filename, content) {
  const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function buildMyAnswers(detail) {
  const lines = [
    `# Moje odpowiedzi – ${QUIZ.date}`,
    '',
    '| # | Twoja odpowiedź (A/B/C/D) | Pewność (1-5) | Uwagi |',
    '|---|---------------------------|---------------|-------|',
  ];
  for (const r of detail) {
    lines.push(`| ${r.n} | ${r.answer} | ${r.confidence === '—' ? '' : r.confidence} | |`);
  }
  lines.push('', '## Notatki', '');
  return lines.join('\n');
}

function buildResults(grade) {
  const lines = [
    `# Wynik quizu — ${QUIZ.date}`,
    '',
    '## Wynik',
    '',
    `- Poprawne odpowiedzi: ${grade.ok}/20`,
    `- Skuteczność: ${grade.pct}%`,
    '',
    '## Szczegóły',
    '',
    '| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |',
    '|---|---|---|---|---|---|',
  ];
  for (const r of grade.detail) {
    const wynik = r.isOk ? 'OK' : 'BŁĄD';
    const pew = r.confidence === '—' ? '—' : r.confidence;
    lines.push(`| ${r.n} | ${r.answer} | ${r.correct} | ${wynik} | ${pew} | ${r.why} |`);
  }
  const wrong = grade.detail.filter(r => !r.isOk);
  lines.push('', '## Mocne strony', '');
  if (grade.ok >= 15) {
    lines.push('- Wysoki wynik ogólny — solidne opanowanie większości zagadnień z notatek.');
  } else if (grade.ok >= 10) {
    lines.push('- Część zagadnień opanowana poprawnie — warto utrwalić błędne pytania poniżej.');
  } else {
    lines.push('- Warto wrócić do notatek i powtórzyć pytania oznaczone jako BŁĄD.');
  }
  lines.push('', '## Obszary do powtórki', '');
  if (!wrong.length) {
    lines.push('- Brak — pełny wynik.');
  } else {
    for (const r of wrong) {
      lines.push(`- Pyt. ${r.n}: ${r.why}`);
    }
  }
  lines.push('');
  return lines.join('\n');
}

form.addEventListener('change', updateProgress);
document.getElementById('submit-btn').addEventListener('click', () => grade());
document.getElementById('reset-btn').addEventListener('click', () => {
  form.reset();
  graded = false;
  lastGrade = null;
  resultsEl.classList.remove('show');
  statusLabel.textContent = 'W trakcie';
  QUIZ.questions.forEach(q => {
    const card = document.getElementById('card-' + q.n);
    const why = document.getElementById('why-' + q.n);
    card.classList.remove('ok', 'bad');
    why.hidden = true;
    why.innerHTML = '';
  });
  updateProgress();
});
document.getElementById('dl-answers').addEventListener('click', () => {
  const g = lastGrade || grade();
  if (!g) return;
  download(`${QUIZ.date}_my_answers.md`, buildMyAnswers(g.detail));
});
document.getElementById('dl-results').addEventListener('click', () => {
  const g = lastGrade || grade();
  if (!g) return;
  download(`${QUIZ.date}_results.md`, buildResults(g));
});

renderForm();
updateProgress();
</script>
</body>
</html>

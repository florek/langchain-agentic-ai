<script>
const DATE="01.10.2026";
const Q=[{"n": 1, "d": "łatwe", "c": "LLM", "p": "Według definicji z kursu, co jest najważniejszym elementem odróżniającym agenta AI od zwykłego chaina?", "o": {"A": "To LLM decyduje, co zrobić dalej", "B": "Agent zawsze trenuje model od zera", "C": "Agent nie może używać żadnych narzędzi", "D": "Chain zawsze sam wybiera narzędzia bez programisty"}, "correct": "A", "why": "Agent to system, w którym LLM decyduje, jakie działania wykonać dalej; to odróżnia go od chaina.", "lesson": {"correct": "Agent to program, który korzysta z modelu językowego do decyzji. Model nie tylko pisze tekst. On wybiera kolejny krok. To może być wywołanie narzędzia albo odpowiedź końcowa. W zwykłym chainie kolejność kroków ustala człowiek z góry. Dlatego najważniejsza cecha agenta brzmi: LLM decyduje, co zrobić dalej.", "example": "Wyobraź sobie pytanie o pogodę w Londynie. Agent myśli: nie znam aktualnej pogody, więc najpierw wywołam narzędzie pogodowe. Potem czyta wynik i dopiero odpowiada. W prostym chainie programista z góry napisałby: zawsze najpierw tool, potem podsumowanie, bez takiej decyzji modelu.", "remember": "Agent = LLM wybiera następny ruch.", "wrong": {"B": "Agent nie trenuje modelu od zera. Korzysta z gotowego LLM do decyzji i działań.", "C": "Wręcz przeciwnie: agenci zwykle mają tools. Brak narzędzi nie jest cechą agenta.", "D": "To nie chain wybiera narzędzia zamiast programisty. W chainie control flow ustala programista."}}}, {"n": 2, "d": "średnie", "c": "LLM", "p": "Jak w notatkach opisano control flow w prostym chainie?", "o": {"A": "LLM samodzielnie ustala kolejność wszystkich kroków", "B": "Kolejność jest losowa przy każdym wywołaniu", "C": "Chain nie ma żadnej kolejności kroków", "D": "Kolejność działań jest z góry ustalona przez programistę"}, "correct": "D", "why": "W prostym chainie programista ustala z góry kolejność kroków (control flow jest hardcoded).", "lesson": {"correct": "Chain to ustalona sekwencja. Najpierw krok A, potem B, potem C. Programista wpisuje tę kolejność w kodzie. Model może pojawić się w jednym kroku, na przykład przy podsumowaniu. Ale model nie decyduje, czy najpierw wyszukać dane, czy od razu odpowiadać. Control flow jest z góry ustalony. Dlatego mówimy, że w chainie flow jest hardcoded.", "example": "Przepis na kanapkę: 1) weź chleb, 2) posmaruj masłem, 3) połóż ser. Zawsze w tej kolejności. Tak działa chain. Agent mógłby najpierw sprawdzić, czy jest ser, i dopiero potem zdecydować o kolejnych krokach.", "remember": "Chain: kolejność ustala programista, nie LLM.", "wrong": {"A": "Samodzielne ustalanie kolejności przez LLM to cecha agenta, nie prostego chaina.", "B": "Chain nie losuje kolejności. Ma ustaloną sekwencję kroków.", "C": "Chain właśnie ma kolejność — i to z góry zaplanowaną."}}}, {"n": 3, "d": "łatwe", "c": "LangChain", "p": "Czym jest PromptTemplate w programistycznym dostępie do modelu?", "o": {"A": "Bazą wektorową do wyszukiwania dokumentów", "B": "Opakowaniem promptu z placeholderami, które przyjmuje parametry i formatuje wejście", "C": "Serwerem lokalnych modeli", "D": "Narzędziem do trenowania wag LLM"}, "correct": "B", "why": "PromptTemplate opakowuje prompt, przyjmuje parametry i formatuje wejście do modelu.", "lesson": {"correct": "PromptTemplate to szablon tekstu. Ma miejsca do wypełnienia, na przykład information. Program podaje wartości, a szablon składa gotowy prompt. Ten sam szablon działa wiele razy z innymi danymi. Jako Runnable może wejść do łańcucha z modelem. Dlatego jest wygodniejszy niż jednorazowy f-string bez jasnego kontraktu wejścia.", "example": "Szablon mówi: na podstawie information zrób krótkie podsumowanie i dwa fakty. Raz podajesz biografię osoby A, raz osoby B. Format zadania zostaje ten sam. Zmienia się tylko treść wejścia.", "remember": "PromptTemplate to foremka, parametry to nadzienie.", "wrong": {"A": "Baza wektorowa służy do wyszukiwania podobieństwa w RAG. PromptTemplate tylko przygotowuje tekst.", "C": "Serwerem lokalnych modeli może być Ollama. PromptTemplate buduje prompt, nie uruchamia serwera.", "D": "Szablon nie trenuje modelu i nie zmienia wag. Formatuje dane przed wywołaniem."}}}, {"n": 4, "d": "średnie", "c": "LLM", "p": "Czym w praktyce są tools udostępniane agentowi?", "o": {"A": "Wyłącznie wagami modelu open-weight", "B": "Wyłącznie zmiennymi środowiskowymi z .env", "C": "Wyłącznie metrykami P90 w panelu obserwowalności", "D": "Funkcjami napisanymi przez programistę, które model może wywołać"}, "correct": "D", "why": "Tools to zwykle funkcje napisane przez programistę, które agent (LLM) może wywołać.", "lesson": {"correct": "Tool to narzędzie. W praktyce to funkcja w kodzie. Programista pisze na przykład get_weather albo search_database. Agent dostaje opis: masz takie funkcje i możesz ich używać. Sam LLM głównie generuje tekst. Dzięki tools może też działać: czytać dane, wołać API, liczyć. Programista przygotowuje narzędzia. Model wybiera, kiedy i którego użyć.", "example": "Masz funkcję get_weather(city). Użytkownik pyta o pogodę w Warszawie. Agent decyduje: potrzebuję toola. Woła get_weather z argumentem Warszawa. Dostaje 12 stopni i dopiero wtedy pisze odpowiedź po ludzku.", "remember": "Tool = funkcja programisty, którą LLM może wywołać.", "wrong": {"A": "Wagi open-weight dotyczą uruchamiania modelu lokalnie. To nie definicja tools agenta.", "B": "Zmienne z .env to sekrety i konfiguracja. Nie są narzędziami wywoływanymi przez agenta.", "C": "P90 to metryka czasu w obserwowalności. Nie jest toollem agenta."}}}, {"n": 5, "d": "średnie", "c": "LLM", "p": "Co zwykle oznacza ustawienie temperature=0 przy modelu chat w zadaniach typu streszczenie i fakty?", "o": {"A": "PromptTemplate przestaje przyjmować parametry", "B": "Model automatycznie włącza bazę wektorową", "C": "Odpowiedzi mają być bardziej przewidywalne i powtarzalne", "D": "Tracing LangSmith zostaje wyłączony"}, "correct": "C", "why": "temperature=0 dąży do bardziej przewidywalnych, powtarzalnych odpowiedzi.", "lesson": {"correct": "Temperature steruje losowością odpowiedzi. Przy zero model mniej zgaduje kreatywnie. Przy streszczeniu i faktach chcesz spokojny, powtarzalny wynik. Wyższa temperatura bardziej miesza i urozmaica tekst. Dlatego w ćwiczeniach typu summary plus facts często stawia się 0.", "example": "Prosisz o krótkie podsumowanie biografii i dwa fakty. Przy temperature=0 dwa uruchomienia wyglądają bardzo podobnie. Przy 0.9 model może raz dodać żart, a raz zmienić kolejność faktów.", "remember": "Zero jak chłodna głowa: mniej losowości, więcej powtarzalności.", "wrong": {"A": "PromptTemplate nadal przyjmuje parametry. Temperature dotyczy modelu, nie szablonu.", "B": "Baza wektorowa nie włącza się przez temperature. To osobny element RAG.", "D": "Tracing LangSmith ustawiasz osobnymi zmiennymi. Temperature go nie wyłącza."}}}, {"n": 6, "d": "trudne", "c": "LLM", "p": "W pętli ReAct, co dzieje się zaraz po wykonaniu toola?", "o": {"A": "Agent zawsze kończy pracę bez dalszej analizy", "B": "Programista ręcznie wybiera następne narzędzie zamiast modelu", "C": "Agent otrzymuje observation (wynik toola), a wynik wraca do LLM do kolejnej decyzji", "D": "Model kasuje całą historię rozumowania"}, "correct": "C", "why": "Po toolu agent dostaje observation; wynik wraca do LLM, który decyduje o kolejnym kroku.", "lesson": {"correct": "ReAct działa w cyklu: myślenie, działanie, obserwacja. Po wywołaniu toola pojawia się wynik. Ten wynik nazywamy observation. Observation wraca do modelu. Model pyta siebie: czy mam już odpowiedź, czy potrzebuję kolejnej akcji. Jeśli nie, pętla idzie dalej. Jeśli tak, powstaje final answer. Bez observation agent nie wiedziałby, co tool naprawdę zwrócił.", "example": "Agent szuka CEO firmy X. Tool zwraca: CEO to osoba Y. To observation. Model myśli dalej: teraz potrzebuję wieku Y. Woła kolejne wyszukiwanie. Dostaje 52 lata. Dopiero wtedy kończy: CEO ma 52 lata.", "remember": "Po Act zawsze Observe, potem znowu Reason.", "wrong": {"A": "Agent nie musi kończyć zaraz po toolu. Często potrzebuje kolejnych kroków.", "B": "W ReAct o kolejnym kroku decyduje LLM, nie ręczne wybieranie toola przez programistę w trakcie pętli.", "D": "Wynik toola ma trafić do modelu. Kasowanie historii rozumowania nie jest kolejnym krokiem pętli."}}}, {"n": 7, "d": "trudne", "c": "LangChain", "p": "Przy debugowaniu „u mnie działa inaczej niż w kursie”, co jest lepszym pierwszym porównaniem według notatek o wersjach?", "o": {"A": "Wyłącznie motyw kolorystyczny edytora", "B": "Dokładna wersja z pliku lock względem wersji z kursu, a nie tylko luźny zakres z deklaracji", "C": "Wyłącznie liczba plików quizu", "D": "Wyłącznie nazwa zmiennej temperature"}, "correct": "B", "why": "Przy różnicach zachowań porównuj dokładną wersję z locka, nie tylko luźny zakres deklaracji.", "lesson": {"correct": "Zakres w deklaracji mówi tylko, co wolno zainstalować. Lock mówi, co naprawdę stoi. Gdy kod z kursu zachowuje się inaczej, najpierw porównujesz dokładną wersję biblioteki. To szybsze niż zgadywanie w logice promptu. Potem dopiero szukasz innych przyczyn.", "example": "Deklaracja akceptuje szeroki zakres 1.x. U Ciebie lock ma inną dokładną wersję niż materiał kursu. Po wyrównaniu locka dziwny błąd znika. Okazuje się, że problemem była różnica wersji, nie Twój prompt.", "remember": "Najpierw pin z locka, potem reszta zagadek.", "wrong": {"A": "Motyw edytora nie zmienia API biblioteki.", "C": "Liczba quizów nie wyjaśnia różnic w zachowaniu zależności.", "D": "Temperature to parametr generowania. Nie zastępuje porównania wersji z locka."}}}, {"n": 8, "d": "łatwe", "c": "LLM", "p": "Od jakich słów pochodzi nazwa architektury ReAct?", "o": {"A": "Retrieval + Caching", "B": "Routing + Evaluation", "C": "Rendering + Acceleration", "D": "Reasoning + Acting"}, "correct": "D", "why": "ReAct pochodzi od Reasoning + Acting (rozumowanie + działanie).", "lesson": {"correct": "ReAct to skrót od Reasoning plus Acting. Po polsku: rozumowanie plus działanie. Najpierw model myśli, czego potrzebuje. Potem wykonuje akcję, zwykle przez tool. Potem patrzy na wynik. I tak w kółko, aż rozwiąże zadanie. Nazwa ma przypominać te dwie części: myśl i działaj.", "example": "Pytanie: ile lat ma CEO firmy X. Reason: muszę wiedzieć, kto jest CEO. Act: wyszukaj CEO. Observation: to osoba Y. Reason: teraz wiek Y. Act: wyszukaj wiek. Final: 52 lata.", "remember": "ReAct = Reasoning + Acting.", "wrong": {"A": "Retrieval i caching dotyczą raczej wyszukiwania dokumentów i pamięci podręcznej, nie nazwy ReAct.", "B": "Routing i evaluation to inne pojęcia. Nie składają nazwy ReAct.", "C": "Rendering i acceleration nie mają związku z nazwą tej architektury agentowej."}}}, {"n": 9, "d": "średnie", "c": "LangSmith", "p": "Co jest potrzebne oprócz LANGSMITH_TRACING=true, aby ślady wywołań trafiały do LangSmith?", "o": {"A": "Ustawiony LANGSMITH_API_KEY", "B": "Wyłącznie formatowanie kodu przez Black", "C": "Wyłącznie temperature=1", "D": "Wyłącznie baza FAISS bez klucza"}, "correct": "A", "why": "Do wysyłania trace’ów potrzebny jest też LANGSMITH_API_KEY.", "lesson": {"correct": "Tracing ma włącznik i klucz. LANGSMITH_TRACING=true mówi: wysyłaj ślady. LANGSMITH_API_KEY mówi: na jakie konto. Bez klucza włącznik nie ma autoryzacji. Oba elementy działają razem po załadowaniu środowiska.", "example": "Masz TRACING=true, ale pusty API key. Uruchamiasz chain.invoke i panel jest pusty. Dopisujesz poprawny klucz, ładujesz środowisko i ślady pojawiają się w projekcie.", "remember": "Tracing = włącznik true + klucz LangSmith.", "wrong": {"B": "Black formatuje kod. Nie autoryzuje wysyłania trace’ów.", "C": "Temperature steruje losowością odpowiedzi, nie tracingiem.", "D": "FAISS to baza wektorowa do RAG. Nie zastępuje klucza LangSmith."}}}, {"n": 10, "d": "średnie", "c": "LLM", "p": "Kto decyduje, którego toola użyć, gdy agent ma listę narzędzi (np. search, calculator, database)?", "o": {"A": "Zawsze wyłącznie użytkownik końcowy w UI", "B": "LLM analizuje zadanie i może wybrać odpowiednie narzędzie", "C": "Zawsze wyłącznie plik lock zależności", "D": "Narzędzie wybiera się wyłącznie losowo"}, "correct": "B", "why": "Programista przygotowuje tools, ale model wybiera, którego użyć.", "lesson": {"correct": "Programista przygotowuje zestaw narzędzi. To jak skrzynka z kluczami. Agent dostaje listę: search_web, calculator, database. Potem LLM patrzy na pytanie użytkownika. Sam wybiera, które narzędzie pasuje. Przy liczeniu może wziąć calculator. Przy aktualnych faktach może wziąć search. To właśnie dynamiczny wybór toola.", "example": "Pytanie: ile to 17 razy 24? Agent wybiera calculator. Inne pytanie: co dziś piszą o firmie X? Agent wybiera search_web. Te same tools, inna decyzja modelu.", "remember": "Programista daje tools, LLM wybiera które.", "wrong": {"A": "Użytkownik zadaje pytanie. Nie musi ręcznie klikać każdego toola w typowym agencie ReAct.", "C": "Plik lock dotyczy wersji pakietów. Nie wybiera toola w runtime.", "D": "Wybór nie jest losowy. Model dobiera tool do zadania."}}}, {"n": 11, "d": "łatwe", "c": "Narzędzia", "p": "Dlaczego klucza API nie należy zapisywać w kodzie ani commitować pliku .env?", "o": {"A": "Bo PromptTemplate przestanie być Runnable", "B": "Bo lokalny serwer modeli usunie wszystkie modele", "C": "Bo grozi ujawnieniem sekretu; klucz powinien zostać w zmiennej środowiskowej", "D": "Bo temperature wzrośnie automatycznie"}, "correct": "C", "why": "Commit sekretu grozi wyciekiem; klucz ma zostać w zmiennej środowiskowej.", "lesson": {"correct": "Klucz API otwiera usługę na Twoim koncie. Jeśli trafi do Gita, ktoś może go zobaczyć i użyć. Dlatego trzymasz go w lokalnym .env albo innej zmiennej środowiska. Sam .env powinien być ignorowany przez Git. W repo może zostać szablon pustych nazw.", "example": "Program woła load_dotenv i czyta klucz z środowiska. W repozytorium jest kod, ale nie ma prawdziwej wartości sekretu. Dzięki temu ćwiczenie działa lokalnie bez ujawniania hasła w historii Gita.", "remember": "Sekret do środowiska, nigdy do kodu ani commita.", "wrong": {"A": "PromptTemplate pozostaje Runnable niezależnie od miejsca klucza. Problem to bezpieczeństwo.", "B": "Plik .env nie steruje usuwaniem lokalnych modeli.", "D": "Temperature ustawiasz w konfiguracji modelu. Wyciek klucza jej nie podnosi."}}}, {"n": 12, "d": "trudne", "c": "LLM", "p": "Do czego służy state (stan) w bardziej zaawansowanych systemach agentowych?", "o": {"A": "Do utrzymywania informacji o wykonanych krokach, wynikach i dalszych działaniach w dłuższych procesach", "B": "Do zastąpienia wszystkich modeli chat jednym stringiem", "C": "Do wyłączenia tools na stałe", "D": "Do trenowania wag modelu przy każdym invoke"}, "correct": "A", "why": "State pomaga pamiętać wykonane kroki, wyniki i pozostałe działania w dłuższych procesach.", "lesson": {"correct": "State to pamięć robocza przebiegu. Agent może pamiętać, co już zrobił. Może trzymać wyniki tooli. Może wiedzieć, co jeszcze zostało. Dzięki temu dłuższy proces nie zaczyna się od zera po każdym kroku. State jest szczególnie ważny przy złożonych workflow i w narzędziach do grafów agentowych.", "example": "Agent ma znaleźć lot, hotel i podsumowanie. Po znalezieniu lotu zapisuje wynik w stanie. Potem szuka hotelu, mając lot w pamięci. Na końcu robi podsumowanie z obu wyników. Bez stanu musiałby wszystko odkrywać od nowa.", "remember": "State = co już wiem i co jeszcze przed agentem.", "wrong": {"B": "State nie zastępuje modeli chat jednym stringiem. To nośnik informacji o przebiegu.", "C": "State nie wyłącza tools. Wręcz wspiera dłuższe użycie narzędzi.", "D": "Invoke nie trenuje wag. State dotyczy przebiegu zadania, nie uczenia modelu."}}}, {"n": 13, "d": "średnie", "c": "LangChain", "p": "Co zwykle dzieje się w łańcuchu LCEL zapisanym jako prompt | model?", "o": {"A": "Model jest trenowany od zera na treści promptu", "B": "Operator tworzy automatycznie serwer MCP", "C": "Historia rozmowy jest zawsze zapisywana w Pinecone", "D": "Wynik wypełnienia szablonu staje się wejściem modelu w złożonym obiekcie Runnable"}, "correct": "D", "why": "LCEL przekazuje wynik szablonu jako wejście modelu w obiekcie Runnable.", "lesson": {"correct": "Operator pionowej kreski składa kroki w kolejność. Najpierw szablon dostaje dane i buduje prompt. Potem wynik idzie do modelu. Całość to jeden Runnable. Wywołujesz go przez invoke ze słownikiem wejściowym. To podstawowy wzorzec prompt, potem model.", "example": "Szablon ma miejsce na information. Podajesz biografię w słowniku. Szablon wypełnia lukę, a model dostaje gotową instrukcję: zrób summary i dwa fakty.", "remember": "LCEL pipe: wynik lewej strony podaj prawej.", "wrong": {"A": "Wywołanie łańcucha nie trenuje modelu. Model generuje odpowiedź.", "B": "MCP to standard narzędzi i kontekstu. Operator LCEL go nie uruchamia.", "C": "Pinecone to baza wektorowa. Prosty łańcuch prompt|model nie zapisuje tam historii automatycznie."}}}, {"n": 14, "d": "średnie", "c": "LLM", "p": "Jaką metaforą notatki opisują rolę LLM i tools w agencie?", "o": {"A": "LLM = baza wektorowa, tools = embeddingi", "B": "LLM = plik lock, tools = zakres zależności", "C": "LLM = mózg (decyduje co zrobić), tools = ręce (wykonują operację)", "D": "LLM = wyłącznie parser, tools = wyłącznie PromptTemplate"}, "correct": "C", "why": "Metafora: LLM = mózg (decyzje), tools = ręce (konkretne operacje).", "lesson": {"correct": "Notatki używają prostej metafory. LLM jest jak mózg. Myśli i decyduje, co zrobić. Tools są jak ręce. Wykonują konkretną operację: wywołanie API, wyszukanie, zapis. Mózg bez rąk tylko planuje. Ręce bez mózgu nie wiedzą, co robić. Razem dają działający system agentowy.", "example": "Mózg mówi: sprawdź pogodę w Londynie. Ręce wołają API pogodowe. Mózg dostaje 12 stopni i pisze odpowiedź użytkownikowi. Bez rąk zostałby przy samym zgadywaniu tekstu.", "remember": "LLM myśli, tools robią.", "wrong": {"A": "Baza wektorowa i embeddingi należą do RAG. To nie metafora LLM i tools z tej lekcji.", "B": "Lock i zakres dotyczą wersji pakietów, nie ról w agencie.", "D": "LLM nie jest tylko parserem, a tools nie są PromptTemplate. PromptTemplate formatuje tekst wejściowy."}}}, {"n": 15, "d": "trudne", "c": "LLM", "p": "Która cecha najlepiej odróżnia agenta od samego pipeline’u RAG?", "o": {"A": "Agent zawsze korzysta wyłącznie z FAISS, a RAG nigdy", "B": "Agent decyduje o kolejnych krokach i użyciu narzędzi, a RAG przede wszystkim dostarcza kontekst z dokumentów", "C": "RAG samodzielnie planuje dowolną liczbę działań bez narzędzi", "D": "Agent nie może korzystać z dokumentów"}, "correct": "B", "why": "RAG dostarcza kontekst z dokumentów; agent dodatkowo decyduje o krokach i narzędziach.", "lesson": {"correct": "RAG wyszukuje fragmenty i dokłada je do promptu. Model odpowiada na podstawie tej wiedzy. Agent ma pętlę decyzji i może wybierać narzędzia. Oba podejścia mogą współpracować. Nie są jednak tym samym poziomem aplikacji. RAG daje wiedzę. Agent steruje przebiegiem.", "example": "RAG znajduje instrukcję zwrotu i przekazuje ją modelowi. Agent może znaleźć instrukcję, sprawdzić zamówienie w API i utworzyć zgłoszenie. To kolejne decyzje, nie tylko dostarczenie tekstu.", "remember": "RAG przynosi wiedzę, agent wybiera następne działanie.", "wrong": {"A": "FAISS to jedna możliwa baza. Agent nie musi jej używać, a RAG właśnie może.", "C": "Samo RAG opisuje pobranie kontekstu. Planowanie działań to cecha agenta.", "D": "Agent może użyć retrievera i dokumentów jako narzędzia."}}}, {"n": 16, "d": "łatwe", "c": "LLM", "p": "Co dają tools samemu LLM według notatek o agentach?", "o": {"A": "Możliwość działania poza samym generowaniem tekstu (np. API, wyszukiwanie, kod)", "B": "Automatyczne trenowanie nowych wag modelu", "C": "Usunięcie potrzeby jakiegokolwiek promptu", "D": "Wyłącznie zmianę numeru wersji MAJOR biblioteki"}, "correct": "A", "why": "Tools dają LLM możliwość działania poza samym generowaniem tekstu.", "lesson": {"correct": "Sam LLM przede wszystkim generuje tekst. To mocne przy rozumieniu języka i decyzjach. Ale bez tools trudno mu sięgnąć po aktualne dane albo wykonać operację w systemie. Tools dokładają ręce: czytanie, wyszukiwanie, API, kod, obliczenia. Połączenie LLM i tools daje potężniejsze systemy.", "example": "Bez toola model może tylko zgadywać dzisiejszą pogodę z pamięci treningu. Z toolem pogodowym pobiera aktualny wynik i odpowiada konkretnie.", "remember": "Tools = LLM wychodzi poza samo pisanie tekstu.", "wrong": {"B": "Wywołanie toola nie trenuje nowych wag modelu.", "C": "Prompt nadal jest potrzebny. Tools go nie kasują.", "D": "Tools nie są mechanizmem zmiany MAJOR wersji biblioteki."}}}, {"n": 17, "d": "średnie", "c": "LangChain", "p": "Jaka jest praktyczna różnica między ChatOpenAI a ChatOllama przy tym samym promptcie i łańcuchu?", "o": {"A": "ChatOpenAI działa tylko offline, a ChatOllama tylko w chmurze", "B": "Zmienia się backend modelu (API chmurowe vs lokalny serwer), a logika zadania może zostać ta sama", "C": "ChatOllama kasuje PromptTemplate", "D": "Tylko ChatOpenAI obsługuje invoke"}, "correct": "B", "why": "Ten sam prompt i łańcuch mogą działać na innym backendzie; zmienia się głównie obiekt modelu.", "lesson": {"correct": "LangChain oddziela zadanie od dostawcy modelu. PromptTemplate i łańcuch LCEL mogą zostać. Zmieniasz obiekt LLM: ChatOpenAI albo ChatOllama. Jeden mówi do API w chmurze. Drugi mówi do lokalnego serwera Ollama. Idea jest taka, że modele da się podmieniać stosunkowo łatwo.", "example": "Masz łańcuch summary_prompt | llm. Najpierw llm to ChatOpenAI. Potem wstawiasz ChatOllama z lokalną Gemmą. Invoke ze słownikiem information wygląda podobnie.", "remember": "Zmieniasz model, nie całe zadanie.", "wrong": {"A": "Jest odwrotnie w typowym setupie: OpenAI jest w chmurze, Ollama lokalnie.", "C": "ChatOllama nie kasuje PromptTemplate. Szablon zostaje.", "D": "Invoke działa dla Runnable niezależnie od wybranego backendu chat."}}}, {"n": 18, "d": "trudne", "c": "LLM", "p": "Dlaczego agent może obsłużyć pytanie o aktualną pogodę lepiej niż sam LLM bez narzędzi?", "o": {"A": "Bo agent zawsze zna pogodę z wag modelu bez żadnych danych zewnętrznych", "B": "Bo może zdecydować o wywołaniu toola (np. API pogodowego), pobrać wynik i dopiero wtedy odpowiedzieć", "C": "Bo chain hardcoded zawsze sam wybiera API bez LLM", "D": "Bo temperature=0 zastępuje potrzebę aktualnych danych"}, "correct": "B", "why": "Agent może wywołać tool (np. API pogodowe), pobrać wynik i dopiero odpowiedzieć.", "lesson": {"correct": "Aktualna pogoda zmienia się co chwilę. Sam model może nie mieć świeżych danych. Agent rozumie pytanie i decyduje: potrzebuję API. Woła tool. Dostaje observation. Potem generuje odpowiedź na podstawie wyniku. To klasyczny przykład, po co agentom tools.", "example": "Pytanie: jaka jest dziś pogoda w Londynie? Agent: 1) zrozum pytanie, 2) wybierz tool pogodowy, 3) pobierz wynik, 4) odpowiedz użytkownikowi. Bez toola zostałby przy niepewnej wiedzy z treningu.", "remember": "Świeże fakty = często tool, nie sama pamięć modelu.", "wrong": {"A": "Wagi modelu nie gwarantują aktualnej pogody. Po to właśnie są tools.", "C": "Hardcoded chain bez decyzji LLM to nie wyjaśnienie przewagi agenta z tools.", "D": "Temperature wpływa na losowość tekstu. Nie dostarcza aktualnych pomiarów pogody."}}}, {"n": 19, "d": "trudne", "c": "LLM", "p": "Na czym polega pułapka „lost in the middle” w context engineeringu?", "o": {"A": "Model zawsze ignoruje początek i koniec kontekstu", "B": "Każdy dokument RAG musi mieć dokładnie 90 tokenów", "C": "Modele gorzej wykorzystują informacje ze środka długiego kontekstu; kluczowe dane lepiej umieszczać na początku lub końcu", "D": "Tracing LangSmith działa tylko dla środkowych kroków chaina"}, "correct": "C", "why": "„Lost in the middle”: informacje ze środka długiego kontekstu są gorzej wykorzystywane.", "lesson": {"correct": "Okno kontekstu to cała treść, którą model widzi naraz. Gdy jest bardzo długa, środek bywa gorzej wykorzystywany. To nazywamy lost in the middle. Dlatego ważne fakty lepiej stawiać na początku albo na końcu. Context engineering dba o to, co i w jakiej kolejności trafia do modelu.", "example": "Masz długą historię rozmowy i dokumenty. Najważniejszą regułę biznesową wkładasz na sam koniec promptu. Model częściej ją zauważa, niż gdy schowasz ją głęboko w środku ściany tekstu.", "remember": "W długim kontekście środek łatwiej ginie — ważne na brzegach.", "wrong": {"A": "Pułapka dotyczy środka, nie tego, że zawsze ignorowany jest początek i koniec.", "B": "Nie ma reguły, że każdy dokument musi mieć dokładnie 90 tokenów.", "D": "Tracing LangSmith nie ogranicza się do środkowych kroków. To osobny temat obserwowalności."}}}, {"n": 20, "d": "łatwe", "c": "Narzędzia", "p": "Co oznacza, że model jest open-weight?", "o": {"A": "Wagi modelu są dostępne do pobrania, więc można go uruchomić we własnym środowisku", "B": "Model działa zawsze bez żadnej pamięci RAM", "C": "Każda rozmowa musi być publiczna", "D": "Model może działać wyłącznie przez płatne API i nigdy lokalnie"}, "correct": "A", "why": "Open-weight oznacza dostępność wag do pobrania i możliwość uruchomienia we własnym środowisku.", "lesson": {"correct": "Wagi to liczby opisujące zachowanie modelu. W modelu open-weight możesz je pobrać. Dzięki temu uruchomisz model lokalnie, na serwerze albo w wybranej chmurze. To nie kasuje wymagań sprzętowych. Nie gwarantuje też zawsze lepszej jakości niż model w API.", "example": "Pobierasz Gemmę 3 przez Ollamę. Pliki zostają na Twoim komputerze. Pytania możesz liczyć lokalnie, bez wysyłania każdej prośby do zewnętrznego API.", "remember": "Open-weight: wagi możesz pobrać i wybrać miejsce uruchomienia.", "wrong": {"B": "Uruchomiony model potrzebuje zasobów, np. RAM lub VRAM. Open-weight tego nie usuwa.", "C": "Open-weight dotyczy wag, nie publiczności rozmów.", "D": "Właśnie dostępność wag pozwala uniknąć obowiązkowego płatnego API."}}}];
const quiz=document.querySelector("#quiz"),count=document.querySelector("#count"),results=document.querySelector("#results");
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
quiz.innerHTML=Q.map(q=>`<article class="card" id="card${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag">${q.d}</span><span class="tag">${q.c}</span></div><p class="prompt">${esc(q.p)}</p><div class="options">${["A","B","C","D"].map(l=>`<label class="opt"><input type="radio" name="q${q.n}" value="${l}"><span class="letter">${l})</span><span>${esc(q.o[l])}</span></label>`).join("")}<label class="opt idk"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span><strong>Nie mam pojęcia</strong> — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność: <select name="c${q.n}"><option value="">—</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join("")}</select></label><div class="feedback" id="feedback${q.n}" hidden></div></article>`).join("");
}
function collect(){
return Q.map(q=>({n:q.n,answer:quiz.querySelector(`input[name=q${q.n}]:checked`)?.value||"",confidence:quiz.querySelector(`select[name=c${q.n}]`).value||"—"}));
}
function lesson(q,mode,picked){
const l=q.lesson,parts=[];
if(mode==="bad"){parts.push(`<h3>BŁĄD · Twoja: ${picked} · Poprawna: ${q.correct}</h3><h4>Twoja odpowiedź</h4><p>${esc(l.wrong[picked])}</p>`);}
if(mode==="idk"){parts.push(`<h3>NIE WIEM · Poprawna: ${q.correct}</h3><p>Bez zgadywania — oto wyjaśnienie.</p>`);}
parts.push(`<h4>Poprawna myśl</h4><p>${esc(l.correct)}</p><h4>Przykład</h4><p>${esc(l.example)}</p><h4>Zapamiętaj</h4><p class="remember">${esc(l.remember)}</p>`);
return parts.join("");
}
let last=null;
function grade(){
const rows=collect(),missing=rows.filter(r=>!r.answer);
if(missing.length){alert("Brak odpowiedzi w pytaniach: "+missing.map(r=>r.n).join(", "));return null;}
let ok=0,idk=0;
const detail=rows.map(r=>{
const q=Q[r.n-1],isIdk=r.answer==="?",isOk=r.answer===q.correct;
if(isOk)ok++;if(isIdk)idk++;
const card=document.querySelector(`#card${r.n}`),box=document.querySelector(`#feedback${r.n}`);
card.className=`card ${isOk?"ok":isIdk?"learn":"bad"}`;box.hidden=false;
if(isOk){box.className="feedback okbox";box.innerHTML=`<h3>OK</h3><p>${esc(q.why)}</p>`;}
else if(isIdk){box.className="feedback learnbox";box.innerHTML=lesson(q,"idk",r.answer);}
else{box.className="feedback badbox";box.innerHTML=lesson(q,"bad",r.answer);}
return {...r,correct:q.correct,result:isOk?"OK":isIdk?"NIE WIEM":"BŁĄD",why:q.why,isOk};
});
const pct=Math.round(ok/Q.length*100);
document.querySelector("#score").textContent=`Wynik: ${ok}/20`;document.querySelector("#percent").textContent=`Skuteczność: ${pct}%`;document.querySelector("#idkCount").textContent=`Nie wiem: ${idk}`;document.querySelector("#status").textContent="Sprawdzono";results.classList.add("show");last={ok,idk,pct,detail};results.scrollIntoView({behavior:"smooth"});return last;
}
function download(name,text){
const a=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type:"text/markdown;charset=utf-8"}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}
function myAnswers(rows){
return [`# Moje odpowiedzi – ${DATE}`,"","| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |","|---|-----------------------------|---------------|-------|",...rows.map(r=>`| ${r.n} | ${r.answer} | ${r.confidence==="—"?"":r.confidence} | |`),"","## Notatki",""].join("\n");
}
function resultMd(g){
const strong=g.detail.filter(r=>r.isOk),review=g.detail.filter(r=>!r.isOk);
return [`# Wynik quizu — ${DATE}`,"","## Wynik","",`- Poprawne odpowiedzi: ${g.ok}/20`,`- Skuteczność: ${g.pct}%`,`- Nie wiem: ${g.idk}`,"","## Szczegóły","","| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |","|---|---|---|---|---|---|",...g.detail.map(r=>`| ${r.n} | ${r.answer} | ${r.correct} | ${r.result} | ${r.confidence} | ${r.why} |`),"","## Mocne strony","",strong.length?`- Poprawnie rozwiązane pytania: ${strong.map(r=>r.n).join(", ")}.`:"- Brak poprawnych odpowiedzi w tej próbie.","","## Obszary do powtórki","",...(review.length?review.map(r=>`- Pytanie ${r.n} (${r.result}): ${r.why}`):["- Brak — wszystkie odpowiedzi są poprawne."]),""].join("\n");
}
quiz.addEventListener("change",()=>count.textContent=collect().filter(r=>r.answer).length);
document.querySelector("#check").addEventListener("click",grade);
document.querySelector("#reset").addEventListener("click",()=>{quiz.reset();last=null;results.classList.remove("show");document.querySelector("#status").textContent="W trakcie";Q.forEach(q=>{const c=document.querySelector(`#card${q.n}`),f=document.querySelector(`#feedback${q.n}`);c.className="card";f.hidden=true;f.innerHTML="";});count.textContent="0";});
document.querySelector("#downloadAnswers").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_my_answers.md`,myAnswers(g.detail));});
document.querySelector("#downloadResults").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_results.md`,resultMd(g));});
render();
</script>
</body>

const DATE="05.10.2026";
const Q=[{"n": 1, "d": "łatwe", "c": "LLM", "p": "W klasycznym, promptowym ReAct model komunikował zamiar użycia narzędzia przede wszystkim przez:", "o": {"A": "natywne JSON tool call bez tekstu", "B": "bezpośredni zapis do bazy wektorowej", "C": "tekst w stylu Action / Action Input", "D": "automatyczne trenowanie nowego modelu"}, "correct": "C", "why": "W klasycznym promptowym ReAct model wskazywał tool tekstem (Action / Action Input).", "lesson": {"correct": "Dawniej agent ReAct działał głównie przez prompt. Model pisał tekst: Thought, potem Action, potem Action Input. To nie było osobne strukturalne wywołanie funkcji. System czytał ten tekst i dopiero wtedy próbował uruchomić narzędzie. Idea była prosta: model opisuje, co chce zrobić. Potem runtime interpretuje opis. To był pierwszy etap ewolucji agentów.", "example": "Wyobraź sobie, że model pisze: Action: search oraz Action Input: latest AI news. To wygląda jak zwykła odpowiedź tekstowa. Program musi znaleźć słowo Action, odczytać search i wyciągnąć argument. Dopiero potem woła wyszukiwanie. Dziś częściej dostajemy gotowe strukturalne tool call, ale klasyczny ReAct zaczynał od takiego tekstu.", "remember": "Klasyczny ReAct mówił o toolu tekstem: Action + Action Input.", "wrong": {"A": "Natywne JSON tool call to późniejszy etap. Klasyczny promptowy ReAct opierał się na tekście Action/Observation.", "B": "Zapis do bazy wektorowej dotyczy RAG, nie sposobu komunikacji zamiaru użycia toola w klasycznym ReAct.", "D": "Agent nie trenuje nowego modelu przy każdej akcji. Chodziło o tekstowe wskazanie narzędzia."}}}, {"n": 2, "d": "średnie", "c": "LLM", "p": "Jaka jest kluczowa różnica między prostym chainem a agentem?", "o": {"A": "Chain zawsze używa web search, a agent nigdy", "B": "W chainie kolejność ustala programista, w agencie o kolejnym kroku decyduje LLM", "C": "Agent nie może korzystać z tools", "D": "Chain nie może zawierać wywołania LLM"}, "correct": "B", "why": "W chainie control flow ustala programista; w agencie o kolejnym kroku decyduje LLM.", "lesson": {"correct": "Chain to ustalona kolejność kroków. Programista mówi: najpierw A, potem B, potem C. Model może pojawić się w jednym kroku, ale nie wybiera całej ścieżki. Agent działa inaczej. LLM patrzy na sytuację i decyduje, co dalej. Może wybrać tool, odpowiedzieć albo zrobić kolejny krok. To dynamiczne sterowanie jest sednem agenta.", "example": "Chain jak przepis: 1) weź chleb, 2) posmaruj, 3) połóż ser. Zawsze tak. Agent jak kucharz: najpierw sprawdza, czy jest ser. Jeśli nie, idzie do lodówki. Potem dopiero robi kanapkę. Kolejność zależy od tego, co znajdzie po drodze.", "remember": "Chain: kolejność programisty. Agent: kolejność LLM.", "wrong": {"A": "Ani chain nie musi zawsze używać web search, ani agent nie jest od niego odcięty. Różnica dotyczy tego, kto steruje flow.", "C": "Właśnie tools są typowe dla agentów. Agent może i często powinien z nich korzystać.", "D": "Chain jak najbardziej może zawierać wywołanie LLM. Problem nie w obecności modelu, tylko w tym, kto ustala kolejne kroki."}}}, {"n": 3, "d": "trudne", "c": "LLM", "p": "Dlaczego tekstowe Action: search / Action Input: ... było problematyczne w praktyce?", "o": {"A": "System musiał później parsować luźny tekst, rozpoznać tool i argumenty, a dopiero potem uruchomić funkcję", "B": "Bo modele nie potrafiły w ogóle generować tekstu", "C": "Bo Observation zawsze kasowała cały prompt", "D": "Bo LangGraph zabrania jakiegokolwiek tekstu w odpowiedzi"}, "correct": "A", "why": "Tekstowa akcja wymagała parsowania odpowiedzi, rozpoznania toola i argumentów przed uruchomieniem.", "lesson": {"correct": "Gdy model pisze Action i Action Input zwykłym tekstem, runtime nie dostaje gotowej struktury. Musi odczytać odpowiedź. Potem zgadnąć, gdzie jest nazwa narzędzia. Potem wyciągnąć argumenty. Dopiero wtedy uruchamia funkcję. To dodatkowe parsowanie bywa kruche. Mała zmiana formatu potrafi wszystko zepsuć. Dlatego tool calling był ważnym krokiem naprzód.", "example": "Model zamiast Action: search napisze Szukam: search albo pomyli cudzysłowy w Action Input. Parser się gubi. Funkcja nie startuje albo startuje ze złymi argumentami. Przy strukturalnym tool calling model zwraca jasne: narzędzie X, argumenty Y. Runtime nie musi czytać wróżb z luźnego tekstu.", "remember": "Tekstowa akcja = trzeba parsować. Struktura = mniej zgadywania.", "wrong": {"B": "Modele generują tekst bardzo dobrze. Problem nie był brakiem generowania, tylko koniecznością parsowania formatu akcji.", "C": "Observation to wynik toola wracający do modelu. Nie oznacza automatycznego kasowania całego promptu.", "D": "LangGraph nie zabrania tekstu w odpowiedzi. Chodziło o kruchość tekstowego formatu Action przed erą tool callingu."}}}, {"n": 4, "d": "łatwe", "c": "LLM", "p": "Od jakich słów pochodzi nazwa architektury ReAct?", "o": {"A": "Retrieval + Caching", "B": "Routing + Evaluation", "C": "Rendering + Acceleration", "D": "Reasoning + Acting"}, "correct": "D", "why": "ReAct pochodzi od Reasoning + Acting (rozumowanie + działanie).", "lesson": {"correct": "ReAct to skrót od Reasoning plus Acting. Po polsku: rozumowanie plus działanie. Najpierw model myśli, czego potrzebuje. Potem wykonuje akcję, zwykle przez tool. Potem patrzy na wynik. I tak w kółko, aż rozwiąże zadanie. Nazwa ma przypominać te dwie części: myśl i działaj.", "example": "Pytanie: ile lat ma CEO firmy X. Reason: muszę wiedzieć, kto jest CEO. Act: wyszukaj CEO. Observation: to osoba Y. Reason: teraz wiek Y. Act: wyszukaj wiek. Final: 52 lata.", "remember": "ReAct = Reasoning + Acting.", "wrong": {"A": "Retrieval i caching dotyczą raczej wyszukiwania dokumentów i pamięci podręcznej, nie nazwy ReAct.", "B": "Routing i evaluation to inne pojęcia. Nie składają nazwy ReAct.", "C": "Rendering i acceleration nie mają związku z nazwą tej architektury agentowej."}}}, {"n": 5, "d": "średnie", "c": "LLM", "p": "Co pozostaje niezmienne po pojawieniu się tool callingu względem idei ReAct?", "o": {"A": "Że agent musi działać wyłącznie bez narzędzi", "B": "Pętla reasoning → wybór działania → tool → observation → kolejna decyzja", "C": "Że Action musi być zawsze tylko zwykłym tekstem", "D": "Że Observation nigdy nie wraca do modelu"}, "correct": "B", "why": "Tool calling zmienia sposób wywołania tools, ale zachowuje pętlę ReAct z observation.", "lesson": {"correct": "Tool calling nie kasuje ReAct. Nadal jest rozumowanie. Nadal wybór działania. Nadal tool. Nadal observation. Nadal kolejna decyzja. Zmienia się techniczny sposób powiedzenia: użyj narzędzia X z argumentami Y. Zamiast luźnego tekstu mamy strukturę. Idea pętli zostaje. Dlatego mówimy, że ReAct nadal obowiązuje.", "example": "Dawniej model pisał Action: get_weather. Dziś może zwrócić strukturalne wywołanie get_weather z city=London. W obu przypadkach potem dostaje wynik: 12 stopni. Potem decyduje, czy odpowiedzieć użytkownikowi. Pętla ta sama, format akcji inny.", "remember": "Tool calling zmienia format akcji, nie zabiera pętli ReAct.", "wrong": {"A": "Wręcz przeciwnie: tool calling ułatwia używanie narzędzi, nie każe działać bez nich.", "C": "Tool calling właśnie odchodzi od obowiązku czysto tekstowego Action.", "D": "Observation nadal wraca do modelu. Bez tego agent nie mógłby kontynuować rozumowania."}}}, {"n": 6, "d": "średnie", "c": "LangChain", "p": "Czym jest PromptTemplate w programistycznym dostępie do modelu?", "o": {"A": "Opakowaniem promptu z placeholderami, które przyjmuje parametry i formatuje wejście", "B": "Bazą wektorową do indeksowania dokumentów", "C": "Serwerem lokalnych modeli open-weight", "D": "Narzędziem do trenowania wag od zera"}, "correct": "A", "why": "PromptTemplate opakowuje prompt, przyjmuje parametry i formatuje wejście do modelu.", "lesson": {"correct": "PromptTemplate to szablon tekstu. Ma miejsca do wypełnienia, na przykład information. Program podaje wartości, a szablon składa gotowy prompt. Ten sam szablon działa wiele razy z innymi danymi. Jako Runnable może wejść do łańcucha z modelem. Dlatego jest wygodniejszy niż jednorazowy f-string bez jasnego kontraktu wejścia.", "example": "Szablon mówi: na podstawie information zrób krótkie podsumowanie i dwa fakty. Raz podajesz biografię osoby A, raz osoby B. Format zadania zostaje ten sam. Zmienia się tylko treść wejścia.", "remember": "PromptTemplate to foremka, parametry to nadzienie.", "wrong": {"B": "Baza wektorowa służy do wyszukiwania podobieństwa w RAG. PromptTemplate tylko przygotowuje tekst.", "C": "Serwerem lokalnych modeli może być Ollama. PromptTemplate buduje prompt, nie uruchamia serwera.", "D": "Szablon nie trenuje modelu i nie zmienia wag. Formatuje dane przed wywołaniem."}}}, {"n": 7, "d": "trudne", "c": "LangGraph", "p": "Dlaczego LangGraph jest szczególnie ważny w aplikacjach produkcyjnych agentów?", "o": {"A": "Bo zastępuje całkowicie potrzebę LLM", "B": "Bo usuwa możliwość używania tools", "C": "Bo daje większą kontrolę nad stanem, długością wykonania, przepływem, błędami i złożonym workflow", "D": "Bo działa wyłącznie bez grafu stanów"}, "correct": "C", "why": "LangGraph daje produkcyjną kontrolę nad stanem, przepływem, błędami i złożonym workflow.", "lesson": {"correct": "W demo agent może być krótką pętlą LLM-tool-LLM. W produkcji potrzebujesz więcej kontroli. LangGraph modeluje workflow jako graf stanów i przejść. Łatwiej ogarnąć rozgałęzienia, stan, długie procesy i błędy. Możesz jawnie opisać: kiedy iść do toola, kiedy kończyć, jak wracać. To pomaga budować odporniejsze systemy agentowe.", "example": "Wyobraź sobie agenta do długiego zadania: zbierz dane, sprawdź błąd, spróbuj ponownie, zapisz stan, wróć jutro. Prosta pętla szybko robi się chaotyczna. Graf mówi: węzeł LLM, węzeł TOOL, krawędź warunkowa do FINAL. Widać przepływ i da się nim sterować.", "remember": "LangGraph = kontrola stanu i przepływu, nie tylko krótka pętla demo.", "wrong": {"A": "LangGraph nie zastępuje LLM. Organizuje przepływ wokół modelu i narzędzi.", "B": "LangGraph nie usuwa tools. Wręcz pomaga modelować ich użycie w grafie.", "D": "Sednem LangGraph jest właśnie graf stanów i przejść, nie działanie bez grafu."}}}, {"n": 8, "d": "łatwe", "c": "LangChain", "p": "Ustawienie temperature=0 przy modelu chat zwykle oznacza:", "o": {"A": "obowiązkowe włączenie web search", "B": "dążenie do bardziej deterministycznych, powtarzalnych odpowiedzi", "C": "wyłączenie PromptTemplate", "D": "automatyczne usunięcie klucza API"}, "correct": "B", "why": "temperature=0 dąży do bardziej deterministycznych, powtarzalnych odpowiedzi.", "lesson": {"correct": "Temperature steruje losowością odpowiedzi. Niska wartość, zwłaszcza bliska zeru, zmniejsza wahania. Model częściej daje podobny wynik przy tym samym wejściu. To przydatne przy streszczeniach i faktach. Przy kreatywnym pisaniu czasem chcesz wyższą temperature. Świadomy wybór parametru to dobra praktyka.", "example": "Masz prompt: zrób krótkie summary i dwa fakty. Z temperature=0 wyniki są zwykle stabilniejsze. Z wysoką temperature model częściej zmienia sformułowania i strukturę. Przy zadaniach formalnych zero jest bezpieczniejszym startem.", "remember": "temperature=0 = mniej losowości, więcej powtarzalności.", "wrong": {"A": "Temperature nie włącza web search. To osobny tool i decyzja agenta.", "C": "PromptTemplate działa niezależnie od temperature. Temperature dotyczy generowania modelu.", "D": "Temperature nie kasuje klucza API. Klucz to konfiguracja środowiska."}}}, {"n": 9, "d": "średnie", "c": "LangChain", "p": "Do czego służy create_agent w LangChain 1.0 według notatek?", "o": {"A": "Do trenowania nowego LLM od zera", "B": "Do zastąpienia PromptTemplate bazą FAISS", "C": "Do wyłączenia wszystkich tools", "D": "Do uproszczenia tworzenia nowoczesnych agentów wysokopoziomowym interfejsem"}, "correct": "D", "why": "create_agent upraszcza tworzenie nowoczesnych agentów wysokopoziomowym API LangChain 1.0.", "lesson": {"correct": "W LangChain 1.0 pojawia się create_agent. To prosty, wysokopoziomowy sposób zbudowania nowoczesnego agenta. Chodzi o to, by szybciej podłączyć tools i uruchomić agenta. Nie musisz od razu składać całej architektury ręcznie. Pod spodem nadal jest dojrzała implementacja. Użytkownik dostaje wygodny interfejs, a szczegóły są ukryte głębiej.", "example": "Zamiast od razu budować cały graf i pętlę od zera, zaczynasz od create_agent z modelem i listą tools. Uruchamiasz agenta i patrzysz, jak działa. Później kurs schodzi niżej i pokazuje, co kryje się pod tym prostym wywołaniem.", "remember": "create_agent = prosty wierzchołek, dojrzała architektura pod spodem.", "wrong": {"A": "create_agent nie trenuje nowego LLM. Tworzy i uruchamia agenta na istniejącym modelu.", "B": "FAISS to baza wektorowa do RAG. Nie zastępuje roli create_agent ani PromptTemplate.", "C": "Interfejs ma ułatwiać pracę z nowoczesnymi agentami i tools, nie wyłączać narzędzi."}}}, {"n": 10, "d": "trudne", "c": "Prompt Engineering", "p": "Na czym polega pułapka „lost in the middle” w context engineeringu?", "o": {"A": "Modele gorzej wykorzystują informacje ze środka długiego kontekstu; kluczowe dane lepiej umieszczać na początku lub końcu", "B": "Model zawsze ignoruje początek i koniec kontekstu", "C": "Każdy dokument RAG musi mieć dokładnie 90 tokenów", "D": "Tracing LangSmith działa tylko dla środkowych kroków chaina"}, "correct": "A", "why": "„Lost in the middle”: informacje ze środka długiego kontekstu są gorzej wykorzystywane.", "lesson": {"correct": "Okno kontekstu to cała treść, którą model widzi naraz. Gdy jest bardzo długa, środek bywa gorzej wykorzystywany. To nazywamy lost in the middle. Dlatego ważne fakty lepiej stawiać na początku albo na końcu. Context engineering dba o to, co i w jakiej kolejności trafia do modelu.", "example": "Masz długą historię rozmowy i dokumenty. Najważniejszą regułę biznesową wkładasz na sam koniec promptu. Model częściej ją zauważa, niż gdy schowasz ją głęboko w środku ściany tekstu.", "remember": "W długim kontekście środek łatwiej ginie — ważne na brzegach.", "wrong": {"B": "Pułapka dotyczy środka, nie tego, że zawsze ignorowany jest początek i koniec.", "C": "Nie ma reguły, że każdy dokument musi mieć dokładnie 90 tokenów.", "D": "Tracing LangSmith nie ogranicza się do środkowych kroków. To osobny temat obserwowalności."}}}, {"n": 11, "d": "łatwe", "c": "LLM", "p": "Pierwszy etap ewolucji implementacji agentów ReAct opisany w notatkach to:", "o": {"A": "wyłącznie create_agent bez wcześniejszej historii", "B": "wyłącznie LangGraph bez jakiegokolwiek promptu", "C": "promptowy ReAct z tekstowym Reasoning / Action / Observation", "D": "wyłącznie embeddingi bez modelu językowego"}, "correct": "C", "why": "Pierwszy etap to promptowy ReAct z tekstowym Reasoning / Action / Observation.", "lesson": {"correct": "Ewolucja zaczyna się od OG ReAct. Wszystko jest opisane tekstem: Reasoning, Action, Observation. Model myśli i działa przez prompt. Potem pojawia się tool calling. Potem LangGraph. Na końcu create_agent jako prosty interfejs. Ważne, by pamiętać kolejność: najpierw tekstowy ReAct, nie od razu najnowsze API.", "example": "Schemat z notatek: promptowy ReAct → function/tool calling → LangGraph → LangChain 1.0 create_agent. Pierwszy klocek to tekst Thought/Action/Observation. Dopiero później dostajemy wygodniejsze warstwy.", "remember": "Start ewolucji = tekstowy ReAct, nie create_agent.", "wrong": {"A": "create_agent to późniejszy, wysokopoziomowy etap, nie początek historii.", "B": "LangGraph jest kolejnym krokiem po tool callingu, nie pierwszym etapem.", "D": "Embeddingi należą do RAG. Nie opisują pierwszego etapu implementacji ReAct."}}}, {"n": 12, "d": "średnie", "c": "LLM", "p": "Jaką metaforą notatki opisują rolę LLM i tools w agencie?", "o": {"A": "LLM = baza wektorowa, tools = embeddingi", "B": "LLM = mózg (decyduje), tools = ręce (wykonują operacje)", "C": "LLM = wyłącznie parser, tools = wyłącznie PromptTemplate", "D": "LLM = plik lock, tools = zakres zależności"}, "correct": "B", "why": "Metafora: LLM = mózg (decyzje), tools = ręce (konkretne operacje).", "lesson": {"correct": "Notatki używają prostej metafory. LLM jest jak mózg. Myśli i decyduje, co zrobić. Tools są jak ręce. Wykonują konkretną operację: wywołanie API, wyszukanie, zapis. Mózg bez rąk tylko planuje. Ręce bez mózgu nie wiedzą, co robić. Razem dają działający system agentowy.", "example": "Mózg mówi: sprawdź pogodę w Londynie. Ręce wołają API pogodowe. Mózg dostaje 12 stopni i pisze odpowiedź użytkownikowi. Bez rąk zostałby przy samym zgadywaniu tekstu.", "remember": "LLM myśli, tools robią.", "wrong": {"A": "Baza wektorowa i embeddingi należą do RAG. To nie metafora LLM i tools z tej lekcji.", "C": "LLM nie jest tylko parserem, a tools nie są PromptTemplate. PromptTemplate formatuje tekst wejściowy.", "D": "Lock i zakres dotyczą wersji pakietów, nie ról w agencie."}}}, {"n": 13, "d": "trudne", "c": "LangChain", "p": "Co według notatek znajduje się „pod spodem” prostego interfejsu create_agent?", "o": {"A": "Wyłącznie ręczna konkatenacja f-stringów bez Runnable", "B": "Wyłącznie klasyczny string→string LLM bez tooli", "C": "Wyłącznie statyczny HTML bez żadnego modelu", "D": "Mechanizmy oparte o LangGraph — dojrzała architektura grafowa"}, "correct": "D", "why": "Pod spodem create_agent wykorzystuje architekturę opartą o LangGraph.", "lesson": {"correct": "create_agent wygląda prosto z zewnątrz. Pod spodem korzysta jednak z mechanizmów LangGraph. Dostajesz wygodny wierzchołek API. Pod nim jest graf, stan i control flow. To dlatego nowoczesny agent nie jest magią. Prosty interfejs stoi na dojrzałej architekturze. Kurs chce to później rozłożyć na części.", "example": "Wywołujesz create_agent i podajesz tools. Agent działa. Za kulisami przebieg może być modelowany jak START → LLM → czy potrzebny tool? → TOOL → z powrotem do LLM → FINAL. Ty widzisz prostą funkcję. System widzi graf.", "remember": "Prosty create_agent, pod spodem LangGraph.", "wrong": {"A": "To nie jest opis create_agent. Pod spodem jest LangGraph, nie sama ręczna konkatenacja stringów.", "B": "Nowoczesny agent korzysta z tooli i bogatszej architektury, nie z samego klasycznego string→string LLM.", "C": "HTML nie jest warstwą pod create_agent. Chodzi o LangGraph."}}}, {"n": 14, "d": "łatwe", "c": "LLM", "p": "Dlaczego sam LLM zwykle nie odpowie wiarygodnie na pytanie o dzisiejsze oferty pracy bez dodatkowego narzędzia?", "o": {"A": "Bo model nie ma sam z siebie bieżącego dostępu do internetu", "B": "Bo PromptTemplate kasuje dostęp do internetu", "C": "Bo temperature=0 wyłącza wszystkie API", "D": "Bo zawsze trenuje nowe wagi przy każdym pytaniu"}, "correct": "A", "why": "Sam LLM nie ma bieżącego dostępu do internetu; aktualne dane wymagają toola.", "lesson": {"correct": "Model językowy uczy się na danych z przeszłości. Po treningu nie zagląda sam do sieci. Dlatego nie wie z dnia na dzień, jakie oferty właśnie wiszą na LinkedIn. Może zgadywać albo powtórzyć stare fakty. Żeby dostać świeże informacje, potrzebuje narzędzia. Web search to właśnie taki tool. Agent może zdecydować: najpierw wyszukam, potem odpowiem.", "example": "Wyobraź sobie pytanie: znajdź trzy oferty AI Engineer na dziś. Sam model mógłby wymyślić ładne nazwy firm. Z web search najpierw szuka w internecie. Dostaje prawdziwe wyniki. Potem pisze podsumowanie i dokłada linki.", "remember": "Bez toola LLM nie patrzy do internetu — pamięć treningu to nie live search.", "wrong": {"B": "PromptTemplate tylko formatuje tekst promptu. Nie zabiera modelowi internetu, bo model i tak nie ma go sam z siebie.", "C": "Temperature wpływa na losowość odpowiedzi. Nie wyłącza API ani nie tłumaczy braku dostępu do sieci.", "D": "Model nie trenuje nowych wag przy każdym pytaniu użytkownika. Chodzi o brak bieżącego dostępu do sieci."}}}, {"n": 15, "d": "średnie", "c": "LLM", "p": "Po co kurs pokazuje później starsze implementacje agentów, skoro istnieje nowoczesne API?", "o": {"A": "Wyłącznie po to, by usunąć tool calling", "B": "Wyłącznie po to, by zastąpić ReAct chainem bez pętli", "C": "Bo starsze wersje wyraźniej pokazują pętlę ReAct, wybór toola, observation i control flow ukryte w nowym API", "D": "Bo nowoczesne API nie pozwala w ogóle uruchomić agenta"}, "correct": "C", "why": "Starsze implementacje wyraźniej pokazują pętlę, wybór toola, observation i control flow.", "lesson": {"correct": "Nowoczesne API jest wygodne, ale dużo ukrywa. Możesz mieć wrażenie, że agent działa magicznie. Starsze implementacje pokazują wnętrze. Widać, gdzie jest pętla ReAct. Widać, jak wybierany jest tool. Widać, jak observation wraca do modelu. Widać control flow. Dlatego kurs schodzi warstwami: najpierw użyj, potem zrozum.", "example": "Najpierw uruchamiasz create_agent i dostajesz wynik. Potem patrzysz na starszy wariant, gdzie kroki Thought/Action/Observation są bardziej jawne. Nagle wiesz, co nowoczesna funkcja chowa pod spodem. Magia zamienia się w mechanizm.", "remember": "Stare API uczy wnętrza, nowe API uczy użycia.", "wrong": {"A": "Kurs nie pokazuje starszych wersji po to, by usunąć tool calling. Tool calling jest ważnym etapem ewolucji.", "B": "Celem nie jest zastąpienie ReAct chainem. Celem jest zrozumienie pętli i architektury.", "D": "Nowoczesne API właśnie pozwala uruchomić agenta wygodnie. Problem to ukryte szczegóły, nie brak działania."}}}, {"n": 16, "d": "średnie", "c": "LangSmith", "p": "Co jest potrzebne oprócz LANGSMITH_TRACING=true, aby ślady wywołań trafiały do LangSmith?", "o": {"A": "Wyłącznie formatowanie kodu przez Black", "B": "Wyłącznie temperature=1", "C": "Wyłącznie baza FAISS bez klucza", "D": "Ustawiony LANGSMITH_API_KEY"}, "correct": "D", "why": "Do wysyłania trace’ów potrzebny jest też LANGSMITH_API_KEY.", "lesson": {"correct": "Tracing ma włącznik i klucz. LANGSMITH_TRACING=true mówi: wysyłaj ślady. LANGSMITH_API_KEY mówi: na jakie konto. Bez klucza włącznik nie ma autoryzacji. Oba elementy działają razem po załadowaniu środowiska.", "example": "Masz TRACING=true, ale pusty API key. Uruchamiasz chain.invoke i panel jest pusty. Dopisujesz poprawny klucz, ładujesz środowisko i ślady pojawiają się w projekcie.", "remember": "Tracing = włącznik true + klucz LangSmith.", "wrong": {"A": "Black formatuje kod. Nie autoryzuje wysyłania trace’ów.", "B": "Temperature steruje losowością odpowiedzi, nie tracingiem.", "C": "FAISS to baza wektorowa do RAG. Nie zastępuje klucza LangSmith."}}}, {"n": 17, "d": "trudne", "c": "LLM", "p": "Co przede wszystkim się zmieniło w ewolucji agentów, a co pozostało podobne?", "o": {"A": "Zmieniła się idea ReAct, a sposób wywoływania tools pozostał zawsze tekstowy", "B": "Idea pętli LLM → decyzja → akcja → obserwacja → LLM pozostała; zmieniły się reprezentacja akcji, uruchamianie tools, stan i control flow", "C": "Zniknęła całkowicie observation, a tools przestały istnieć", "D": "LangGraph usunął możliwość jakiegokolwiek rozumowania"}, "correct": "B", "why": "Idea pętli ReAct zostaje; zmieniają się reprezentacja akcji, tools, stan i control flow.", "lesson": {"correct": "Notatki rozróżniają dwie rzeczy. Co się nie zmieniło: nadal LLM, decyzja, akcja, obserwacja, znowu LLM. To istota ReAct. Co się zmieniło: jak reprezentujemy akcję, jak uruchamiamy tools, jak zarządzamy stanem i jak organizujemy control flow. Technologia dojrzewa. Idea pętli zostaje. Dlatego ewolucja to ulepszenie implementacji, nie wyrzucenie ReAct do kosza.", "example": "Dawniej Action było tekstem. Potem strukturalnym tool call. Potem kroki weszły w graf LangGraph. Na końcu create_agent ukrył złożoność. W każdym etapie agent nadal myśli, działa i patrzy na wynik.", "remember": "Pętla zostaje, zmienia się sposób budowy i sterowania.", "wrong": {"A": "Jest odwrotnie: idea ReAct zostaje, a tekstowy sposób wywoływania tools właśnie się zmienia.", "C": "Observation i tools nie znikają. Observation nadal wraca do modelu.", "D": "LangGraph nie usuwa rozumowania. Pomaga lepiej kontrolować workflow wokół niego."}}}, {"n": 18, "d": "łatwe", "c": "LangChain", "p": "Co zwykle dzieje się w łańcuchu LCEL zapisanym jako prompt | model?", "o": {"A": "Model jest trenowany od zera na treści promptu", "B": "Operator tworzy automatycznie serwer MCP", "C": "Wynik wypełnienia szablonu staje się wejściem modelu w złożonym obiekcie Runnable", "D": "Historia rozmowy jest zawsze zapisywana w Pinecone"}, "correct": "C", "why": "LCEL przekazuje wynik szablonu jako wejście modelu w obiekcie Runnable.", "lesson": {"correct": "Operator pionowej kreski składa kroki w kolejność. Najpierw szablon dostaje dane i buduje prompt. Potem wynik idzie do modelu. Całość to jeden Runnable. Wywołujesz go przez invoke ze słownikiem wejściowym. To podstawowy wzorzec prompt, potem model.", "example": "Szablon ma miejsce na information. Podajesz biografię w słowniku. Szablon wypełnia lukę, a model dostaje gotową instrukcję: zrób summary i dwa fakty.", "remember": "LCEL pipe: wynik lewej strony podaj prawej.", "wrong": {"A": "Wywołanie łańcucha nie trenuje modelu. Model generuje odpowiedź.", "B": "MCP to standard narzędzi i kontekstu. Operator LCEL go nie uruchamia.", "D": "Pinecone to baza wektorowa. Prosty łańcuch prompt|model nie zapisuje tam historii automatycznie."}}}, {"n": 19, "d": "średnie", "c": "LLM", "p": "Jakie podejście dydaktyczne opisują notatki dla nauki agentów w tym kursie?", "o": {"A": "Najpierw użyć gotowego prostego interfejsu, potem zobaczyć starszą implementację, zrozumieć mechanizm i budować solidną architekturę", "B": "Od razu pominąć tools i zostać przy samym f-stringu", "C": "Uczyć wyłącznie historii bez uruchamiania jakiegokolwiek API", "D": "Zaczynać wyłącznie od niskopoziomowego parsowania tekstu Action bez pokazania nowoczesnego API"}, "correct": "A", "why": "Kurs idzie warstwami: prosty interfejs → starsza implementacja → mechanizm → solidna architektura.", "lesson": {"correct": "Nauka agentów może przytłaczać. Dlatego kurs zaczyna od góry. Najpierw prosty interfejs: stwórz agenta, podłącz tools, uruchom. Potem schodzi do starszej implementacji. Potem pokazuje mechanizm. Na końcu celuje w solidną, produkcyjną architekturę. To nauka warstwami, nie skok od razu w każdy szczegół.", "example": "Dzień 1: create_agent działa i daje wynik. Dzień 2: patrzysz, jak wyglądała wcześniejsza pętla. Dzień 3: rozumiesz tool calling i observation. Dzień 4: budujesz bardziej odporny workflow z kontrolą stanu. Każda warstwa dokłada jedną cegłę.", "remember": "Najpierw użyj, potem zajrzyj do środka, na końcu buduj solidnie.", "wrong": {"B": "Kurs nie każe pomijać tools. Tools są centralne dla agentów.", "C": "Celem nie jest sama historia bez praktyki. Kurs łączy użycie API ze zrozumieniem mechanizmu.", "D": "Notatki mówią odwrotnie: najpierw nowoczesny prosty interfejs, dopiero później szczegóły i starsze warstwy."}}}, {"n": 20, "d": "trudne", "c": "Narzędzia", "p": "Dlaczego mylenie OPEN_AI_KEY z OPENAI_API_KEY jest typową pułapką konfiguracji?", "o": {"A": "Bo obie nazwy są zawsze identyczne dla każdej integracji", "B": "Bo PromptTemplate wymaga wyłącznie pierwszej nazwy", "C": "Bo LangSmith czyta tylko OPEN_AI_KEY", "D": "Bo integracja LangChain OpenAI oczekuje OPENAI_API_KEY; zła nazwa zmiennej kończy się brakiem klucza mimo obecnego .env"}, "correct": "D", "why": "LangChain OpenAI oczekuje OPENAI_API_KEY; zła nazwa zmiennej = brak klucza mimo .env.", "lesson": {"correct": "Plik .env może istnieć i nadal nic nie działa. Ważna jest dokładna nazwa zmiennej. Integracja LangChain OpenAI oczekuje OPENAI_API_KEY. Jeśli zapiszesz OPEN_AI_KEY, program może czytać inną nazwę albo None. Wtedy wygląda, jakby klucz ginął. To klasyczna pułapka konfiguracji środowiska.", "example": "W .env masz OPEN_AI_KEY=sk-... i load_dotenv działa. ChatOpenAI i tak szuka OPENAI_API_KEY. Dostajesz błąd braku klucza. Zmieniasz nazwę na OPENAI_API_KEY i wszystko nagle działa bez zmiany logiki łańcucha.", "remember": "Zły klucz w .env często oznacza złą nazwę zmiennej, nie brak pliku.", "wrong": {"A": "Nazwy nie są dowolnie zamienne. Konkretna integracja oczekuje konkretnej zmiennej.", "B": "PromptTemplate formatuje prompt. Nie decyduje o nazwie klucza OpenAI.", "C": "LangSmith ma własne zmienne, np. LANGSMITH_API_KEY. To nie wyjaśnia pułapki OPENAI_API_KEY."}}}];
const quiz=document.querySelector("#quiz"),count=document.querySelector("#count"),results=document.querySelector("#results");
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
quiz.innerHTML=Q.map(q=>`<article class="card" id="card${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag">${q.d}</span><span class="tag">${q.c}</span></div><p class="prompt">${esc(q.p)}</p><div class="options">${["A","B","C","D"].map(l=>`<label class="opt"><input type="radio" name="q${q.n}" value="${l}"><span class="letter">${l})</span><span>${esc(q.o[l])}</span></label>`).join("")}<label class="opt idk"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span><strong>Nie mam pojęcia</strong> — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność: <select name="c${q.n}"><option value="">—</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join("")}</select></label><div class="feedback" id="feedback${q.n}" hidden></div></article>`).join("");
}
function collect(){
return Q.map(q=>({n:q.n,answer:quiz.querySelector(`input[name=q${q.n}]:checked`)?.value||"",confidence:quiz.querySelector(`select[name=c${q.n}]`).value||"—"}));
}
function lesson(q,mode,picked){
const l=q.lesson,parts=[];
if(mode==="bad"){parts.push(`<h3>BŁĄD · Twoja: ${picked} · Poprawna: ${q.correct}</h3><h4>Twoja odpowiedź</h4><p>${esc(l.wrong[picked])}</p>`);}
if(mode==="idk"){parts.push(`<h3>NIE WIEM · Poprawna: ${q.correct}</h3><p>Bez zgadywania — oto wyjaśnienie.</p>`);}
parts.push(`<h4>Poprawna myśl</h4><p>${esc(l.correct)}</p><h4>Przykład</h4><p>${esc(l.example)}</p><h4>Zapamiętaj</h4><p class="remember">${esc(l.remember)}</p>`);
return parts.join("");
}
let last=null;
function grade(){
const rows=collect(),missing=rows.filter(r=>!r.answer);
if(missing.length){alert("Brak odpowiedzi w pytaniach: "+missing.map(r=>r.n).join(", "));return null;}
let ok=0,idk=0;
const detail=rows.map(r=>{
const q=Q[r.n-1],isIdk=r.answer==="?",isOk=r.answer===q.correct;
if(isOk)ok++;if(isIdk)idk++;
const card=document.querySelector(`#card${r.n}`),box=document.querySelector(`#feedback${r.n}`);
card.className=`card ${isOk?"ok":isIdk?"learn":"bad"}`;box.hidden=false;
if(isOk){box.className="feedback okbox";box.innerHTML=`<h3>OK</h3><p>${esc(q.why)}</p>`;}
else if(isIdk){box.className="feedback learnbox";box.innerHTML=lesson(q,"idk",r.answer);}
else{box.className="feedback badbox";box.innerHTML=lesson(q,"bad",r.answer);}
return {...r,correct:q.correct,result:isOk?"OK":isIdk?"NIE WIEM":"BŁĄD",why:q.why,isOk};
});
const pct=Math.round(ok/Q.length*100);
document.querySelector("#score").textContent=`Wynik: ${ok}/20`;document.querySelector("#percent").textContent=`Skuteczność: ${pct}%`;document.querySelector("#idkCount").textContent=`Nie wiem: ${idk}`;document.querySelector("#status").textContent="Sprawdzono";results.classList.add("show");last={ok,idk,pct,detail};results.scrollIntoView({behavior:"smooth"});return last;
}
function download(name,text){
const a=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type:"text/markdown;charset=utf-8"}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}
function myAnswers(rows){
return [`# Moje odpowiedzi – ${DATE}`,"","| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |","|---|-----------------------------|---------------|-------|",...rows.map(r=>`| ${r.n} | ${r.answer} | ${r.confidence==="—"?"":r.confidence} | |`),"","## Notatki",""].join("\n");
}
function resultMd(g){
const strong=g.detail.filter(r=>r.isOk),review=g.detail.filter(r=>!r.isOk);
return [`# Wynik quizu — ${DATE}`,"","## Wynik","",`- Poprawne odpowiedzi: ${g.ok}/20`,`- Skuteczność: ${g.pct}%`,`- Nie wiem: ${g.idk}`,"","## Szczegóły","","| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |","|---|---|---|---|---|---|",...g.detail.map(r=>`| ${r.n} | ${r.answer} | ${r.correct} | ${r.result} | ${r.confidence} | ${r.why} |`),"","## Mocne strony","",strong.length?`- Poprawnie rozwiązane pytania: ${strong.map(r=>r.n).join(", ")}.`:"- Brak poprawnych odpowiedzi w tej próbie.","","## Obszary do powtórki","",...(review.length?review.map(r=>`- Pytanie ${r.n} (${r.result}): ${r.why}`):["- Brak — wszystkie odpowiedzi są poprawne."]),""].join("\n");
}
quiz.addEventListener("change",()=>count.textContent=collect().filter(r=>r.answer).length);
document.querySelector("#check").addEventListener("click",grade);
document.querySelector("#reset").addEventListener("click",()=>{quiz.reset();last=null;results.classList.remove("show");document.querySelector("#status").textContent="W trakcie";Q.forEach(q=>{const c=document.querySelector(`#card${q.n}`),f=document.querySelector(`#feedback${q.n}`);c.className="card";f.hidden=true;f.innerHTML="";});count.textContent="0";});
document.querySelector("#downloadAnswers").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_my_answers.md`,myAnswers(g.detail));});
document.querySelector("#downloadResults").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_results.md`,resultMd(g));});
render();
</script>
</body>
</html>

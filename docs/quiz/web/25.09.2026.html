const Q=[
{n:1,d:"łatwe",c:"LLM",p:"Jaką główną rolę pełni Ollama w pracy z modelem Gemma 3?",o:{A:"Buduje indeks wektorowy dokumentów",B:"Upraszcza pobieranie, przechowywanie i lokalne uruchamianie modelu",C:"Zastępuje język Python",D:"Udostępnia wyłącznie chmurowe API wymagające klucza"},correct:"B",why:"Ollama upraszcza pobieranie, przechowywanie i lokalne uruchamianie modeli.",lesson:{correct:"Ollama jest narzędziem do obsługi modeli na własnym komputerze. Pomaga pobrać model i zachować go lokalnie. Potrafi też uruchomić model oraz przyjmować pytania z terminala lub aplikacji. Nie jest bazą wektorową ani zamiennikiem Pythona.",example:"Wyobraź sobie, że chcesz porozmawiać z Gemmą 3 bez zewnętrznego API. Najpierw pobierasz model poleceniem Ollamy, a potem uruchamiasz go lokalnie. Aplikacja może następnie wysyłać pytania do działającej Ollamy.",remember:"Ollama to lokalny opiekun modelu: pobiera, przechowuje i uruchamia.",wrong:{A:"Indeks wektorowy służy do wyszukiwania podobnych fragmentów w RAG. Ollama zajmuje się uruchamianiem modeli, a nie budowaniem takiego indeksu.",C:"Python nadal jest językiem aplikacji. Ollama dostarcza działający model, ale nie zastępuje kodu programu.",D:"Ollama jest przedstawiona jako lokalny backend. Jej zaletą jest właśnie możliwość działania bez płatnego wywołania zewnętrznego API."}}},
{n:2,d:"łatwe",c:"LangChain",p:"Czym jest PromptTemplate w programistycznym dostępie do LLM?",o:{A:"Bazą wektorową do wyszukiwania podobieństwa",B:"Narzędziem do trenowania wag modelu",C:"Serwerem lokalnych modeli",D:"Opakowaniem promptu, które przyjmuje parametry i formatuje wejście"},correct:"D",why:"PromptTemplate jest opakowaniem promptu, które przyjmuje parametry i formatuje wejście dla modelu.",lesson:{correct:"PromptTemplate to szablon tekstu z nazwanymi miejscami do wypełnienia. Program przekazuje wartości, a szablon układa z nich gotowy prompt. Ten sam szablon można uruchamiać wiele razy z innymi danymi. Jako Runnable można go też połączyć z modelem w łańcuch.",example:"Masz zdanie „Opisz produkt {product}”. Raz podstawiasz karmę dla kota, a drugi raz pianino. Konstrukcja promptu pozostaje taka sama, lecz model dostaje inne dane.",remember:"PromptTemplate to foremka, a parametry to nadzienie.",wrong:{A:"Baza wektorowa przechowuje embeddingi i pomaga w wyszukiwaniu podobieństwa. PromptTemplate jedynie przygotowuje tekst wejściowy.",B:"Szablon nie zmienia wag modelu i nie prowadzi treningu. Formatuje dane tuż przed wywołaniem modelu.",C:"Serwerem modeli lokalnych może być Ollama. PromptTemplate jest komponentem do budowania promptu."}}},
{n:3,d:"średnie",c:"LLM",p:"Co oznacza, że Gemma 3 jest modelem open-weight?",o:{A:"Wagi modelu są dostępne do pobrania, więc model można uruchomić we własnym środowisku",B:"Model zawsze działa bez pamięci RAM",C:"Każda odpowiedź modelu jest publiczna",D:"Model może działać wyłącznie przez płatne API"},correct:"A",why:"Open-weight oznacza dostępność wag do pobrania, co pozwala uruchomić model we własnym środowisku.",lesson:{correct:"Wagi są liczbową częścią modelu, która określa jego działanie. W modelu open-weight można je pobrać. Dzięki temu model da się uruchomić lokalnie, na własnym serwerze albo w wybranej chmurze. Nie oznacza to jednak braku wymagań sprzętowych ani automatycznie najwyższej jakości.",example:"Pobierasz wariant Gemmy 3 na komputer przez Ollamę. Pliki modelu zostają na Twojej maszynie. Pytania mogą być przetwarzane lokalnie zamiast być wysyłane do zewnętrznego API.",remember:"Open-weight: wagi można pobrać, więc miejsce uruchomienia wybierasz Ty.",wrong:{B:"Każdy uruchomiony model potrzebuje zasobów, na przykład RAM-u lub VRAM-u. Dostępne wagi nie usuwają wymagań sprzętowych.",C:"Open-weight opisuje dostępność wag, a nie publiczność rozmów. Przy lokalnym uruchomieniu dane mogą pozostać na komputerze.",D:"Dostępne wagi pozwalają właśnie uniknąć obowiązkowego płatnego API. Model można uruchomić we własnym środowisku."}}},
{n:4,d:"średnie",c:"LangChain",p:"Jaki kontrakt wejścia i wyjścia jest typowy dla nowoczesnego modelu chat?",o:{A:"Wejście to indeks FAISS, a wyjście to plik .env",B:"Wejście i wyjście zawsze są pojedynczymi liczbami",C:"Wejściem jest lista ustrukturyzowanych wiadomości, a wyjściem wiadomość AI",D:"Wejściem jest wyłącznie nazwa narzędzia, a wyjściem graf LangGraph"},correct:"C",why:"Model chat przyjmuje listę ustrukturyzowanych wiadomości i zwraca wiadomość AI.",lesson:{correct:"Nowoczesny model chat pracuje na wiadomościach rozmowy. Wejście może zawierać instrukcję systemową, pytanie człowieka i wcześniejsze odpowiedzi AI. Wynikiem jest kolejna wiadomość AI. Taka struktura lepiej opisuje dialog niż jeden niepodzielony tekst.",example:"Najpierw system mówi modelowi, że ma być pomocnym nauczycielem. Potem człowiek pyta o LangChain. Model zwraca obiekt wiadomości AI, którego tekst można odczytać z content.",remember:"Chat dostaje rozmowę w wiadomościach i oddaje nową wiadomość AI.",wrong:{A:"FAISS i plik .env pełnią zupełnie inne role. Nie są standardowym wejściem i wyjściem modelu chat.",B:"Model chat pracuje z tekstem oraz strukturą wiadomości, a nie wyłącznie z liczbami. Liczby mogą istnieć wewnątrz, ale nie opisują tego kontraktu.",D:"Nazwa narzędzia może pojawić się w tool callingu, lecz nie jest jedynym wejściem. Graf LangGraph także nie jest zwykłym wyjściem modelu."}}},
{n:5,d:"trudne",c:"LangChain",p:"Co zwykle trzeba zmienić, aby dobrze zaprojektowany łańcuch LangChain przełączyć z OpenAI na lokalną Gemmę 3 przez Ollama?",o:{A:"Całą logikę promptu, RAG i format odpowiedzi",B:"Język programowania oraz menedżer pakietów",C:"Wszystkie dane wejściowe na embeddingi",D:"Głównie klienta integracji i nazwę modelu, pozostawiając resztę łańcucha podobną"},correct:"D",why:"Dzięki wspólnej abstrakcji zwykle zmienia się klienta integracji i nazwę modelu, a reszta łańcucha pozostaje podobna.",lesson:{correct:"LangChain oddziela logikę aplikacji od konkretnego dostawcy modelu. Obiekty modeli mają podobny sposób użycia. Przy zmianie backendu podmieniasz klienta, na przykład ChatOpenAI na ChatOllama, oraz nazwę modelu. Prompt i wywołanie łańcucha mogą pozostać prawie takie same.",example:"Łańcuch ma postać prompt połączony z llm. Najpierw llm jest obiektem ChatOpenAI z modelem GPT. Potem podstawiasz ChatOllama z Gemmą 3, a wywołanie invoke nadal wygląda podobnie.",remember:"Dobra abstrakcja pozwala zmienić silnik bez przebudowy całego samochodu.",wrong:{A:"Celem abstrakcji jest pozostawienie logiki zadania bez dużej przebudowy. Nie ma potrzeby automatycznie przepisywać promptu i całego RAG.",B:"Oba warianty mogą działać w tej samej aplikacji Python i tym samym środowisku. Zmiana modelu nie wymusza nowego języka.",C:"Embeddingi dotyczą wyszukiwania semantycznego w RAG. Sama podmiana modelu chat nie zmienia każdego wejścia w embedding."}}},
{n:6,d:"trudne",c:"LangChain",p:"Co dzieje się w łańcuchu LCEL prompt | model?",o:{A:"Model jest trenowany na treści promptu",B:"Wynik wypełnienia szablonu staje się wejściem modelu w złożonym obiekcie Runnable",C:"Operator tworzy automatycznie serwer MCP",D:"Historia rozmowy jest zawsze zapisywana w Pinecone"},correct:"B",why:"LCEL przekazuje wynik jednego komponentu jako wejście następnego i tworzy z nich Runnable.",lesson:{correct:"Operator pionowej kreski składa komponenty w kolejność. Najpierw szablon otrzymuje dane i buduje prompt. Gotowy wynik trafia potem do modelu. Całość jest jednym obiektem Runnable, który można wywołać przez invoke.",example:"Szablon ma miejsce {information}. Wywołujesz łańcuch ze słownikiem zawierającym tekst. Szablon wypełnia miejsce, a model dostaje już gotową instrukcję.",remember:"LCEL pipe oznacza: wynik lewej strony podaj prawej stronie.",wrong:{A:"Wywołanie łańcucha nie zmienia wag modelu. Model tylko generuje odpowiedź na przygotowane wejście.",C:"MCP jest standardem łączenia narzędzi i kontekstu. Operator LCEL nie uruchamia serwera MCP.",D:"Pinecone jest jedną z baz wektorowych. Prosty łańcuch prompt i model nie zapisuje tam automatycznie historii."}}},
{n:7,d:"łatwe",c:"Narzędzia",p:"Które polecenie pobiera lokalnie model Gemma 3 w wariancie 270M?",o:{A:"ollama list gemma3:270m",B:"uv sync gemma3:270m",C:"ollama pull gemma3:270m",D:"python install gemma3:270m"},correct:"C",why:"Polecenie ollama pull gemma3:270m pobiera wskazany wariant modelu.",lesson:{correct:"Ollama używa polecenia pull do pobierania modelu. Po pull pliki modelu są dostępne lokalnie. Nazwa gemma3 wskazuje rodzinę, a 270m konkretny mały wariant. Dopiero pobrany model można łatwo uruchomić poleceniem run.",example:"Wpisujesz ollama pull gemma3:270m. Czekasz, aż pobieranie się zakończy. Potem ollama list pokazuje model, a ollama run gemma3:270m go uruchamia.",remember:"Pull pobiera, list pokazuje, run uruchamia.",wrong:{A:"List służy do oglądania modeli już dostępnych lokalnie. Nie jest poleceniem pobierania.",B:"uv sync instaluje zależności projektu Python z lockfile. Nie pobiera modeli zarządzanych przez Ollamę.",D:"W notatkach nie ma polecenia python install do obsługi Gemmy. Pobieraniem zajmuje się ollama pull."}}},
{n:8,d:"łatwe",c:"LangChain",p:"Co najpewniej nastąpi, gdy słownik przekazany do invoke nie zawiera klucza wymaganego przez input_variables?",o:{A:"Pojawi się błąd walidacji wejścia",B:"LangChain losowo dobierze brakującą wartość",C:"Model automatycznie usunie placeholder",D:"Łańcuch przełączy się na Ollama"},correct:"A",why:"Klucze słownika invoke muszą odpowiadać zmiennym wymaganym przez szablon; niezgodność powoduje błąd walidacji.",lesson:{correct:"PromptTemplate deklaruje nazwy potrzebnych danych. Słownik przekazany do invoke musi używać tych samych kluczy. Gdy nazwy się nie zgadzają, szablon nie potrafi poprawnie wypełnić miejsca. Framework zgłasza wtedy błąd zamiast zgadywać.",example:"Szablon oczekuje klucza information. Program podaje tylko info. Ponieważ nazwy są różne, wywołanie kończy się błędem i trzeba poprawić klucz.",remember:"Klucze w invoke muszą pasować do input_variables jak klucz do zamka.",wrong:{B:"Losowe dobieranie wartości zepsułoby kontrakt i mogłoby wysłać błędne dane. LangChain oczekuje jawnego dopasowania.",C:"Placeholder nie jest cicho usuwany przez model. Problem wykrywa się przed poprawnym zbudowaniem promptu.",D:"Brak klucza nie jest sygnałem do zmiany dostawcy modelu. Ollama nie naprawia kontraktu wejścia szablonu."}}},
{n:9,d:"średnie",c:"LLM",p:"Jaki kompromis wiąże się z użyciem bardzo małego lokalnego modelu, takiego jak Gemma 3 270M?",o:{A:"Większe zużycie pamięci w zamian za brak możliwości pracy offline",B:"Mniejsze wymagania i szybsze działanie kosztem zwykle słabszej jakości odpowiedzi",C:"Zawsze lepsze rozumowanie kosztem wyższego rachunku za API",D:"Brak możliwości uruchomienia z terminala"},correct:"B",why:"Mały model ma mniejsze wymagania i może działać szybciej, ale zwykle odpowiada gorzej niż większy model.",lesson:{correct:"Liczba 270M oznacza około 270 milionów parametrów. Taki model jest mały i potrzebuje mniej pamięci. Może pobierać się oraz działać szybciej. W zamian częściej gorzej rozumie trudne polecenia i daje mniej precyzyjne odpowiedzi.",example:"Mały laptop łatwiej uruchomi wariant 270M niż ogromny model. Proste przywitanie może działać szybko. Przy skomplikowanej analizie większy model zwykle poradzi sobie lepiej, ale zużyje więcej zasobów.",remember:"Mniejszy model jest lżejszy i szybszy, lecz zwykle mniej dokładny.",wrong:{A:"Mały model zwykle zmniejsza zużycie pamięci, a lokalność pozwala pracować offline. Ta odpowiedź odwraca oba skutki.",C:"Notatki nie obiecują, że mały model zawsze rozumuje lepiej. Lokalna praca pozwala też uniknąć opłaty za każde wywołanie API.",D:"Model można uruchomić bez kodu poleceniem ollama run. Terminal jest właśnie prostym sposobem sprawdzenia działania."}}},
{n:10,d:"średnie",c:"LLM",p:"Która cecha odróżnia agenta od samego pipeline'u RAG?",o:{A:"Agent zawsze korzysta z FAISS, a RAG nigdy",B:"RAG samodzielnie planuje dowolną liczbę działań",C:"Agent nie może korzystać z dokumentów",D:"Agent decyduje o kolejnych krokach i użyciu narzędzi, a RAG przede wszystkim dostarcza kontekst z dokumentów"},correct:"D",why:"RAG dostarcza kontekst z dokumentów, natomiast agent dodatkowo decyduje o działaniach i użyciu narzędzi.",lesson:{correct:"RAG wyszukuje fragmenty dokumentów i dołącza je do promptu. Dzięki temu model odpowiada na podstawie dostarczonej wiedzy. Agent ma dodatkowo pętlę podejmowania decyzji i może wybierać narzędzia. Oba podejścia mogą współpracować, ale nie są tym samym.",example:"RAG znajduje instrukcję zwrotu produktu i przekazuje ją modelowi. Agent może najpierw znaleźć instrukcję, potem sprawdzić zamówienie przez API i na końcu utworzyć zgłoszenie. To kolejne decyzje i działania, nie tylko dostarczenie tekstu.",remember:"RAG przynosi wiedzę, a agent wybiera następne działanie.",wrong:{A:"FAISS jest tylko jednym z możliwych narzędzi wyszukiwania. Agent nie musi go używać, a RAG może właśnie z niego korzystać.",B:"Samo RAG opisuje pobranie kontekstu przed generacją. Planowanie działań jest cechą agenta.",C:"Agent może użyć retrievera i dokumentów jako jednego z narzędzi. Dostęp do dokumentów nie jest zabroniony."}}},
{n:11,d:"trudne",c:"LLM",p:"Kiedy lokalny model przez Ollama jest lepiej uzasadnionym wyborem niż model chmurowy według notatek?",o:{A:"Gdy priorytetem są prywatność, praca offline, kontrola i brak opłaty za każde wywołanie",B:"Gdy zawsze potrzebna jest najwyższa jakość bez względu na sprzęt",C:"Gdy aplikacja nie może przechowywać modelu lokalnie",D:"Gdy chcemy całkowicie uniknąć wymagań sprzętowych"},correct:"A",why:"Model lokalny wspiera prywatność, kontrolę, pracę offline i brak opłaty za każde wywołanie.",lesson:{correct:"Model lokalny może przetwarzać dane na własnym komputerze. To zwiększa kontrolę i pomaga zachować dane na miejscu. Po pobraniu może działać offline i nie nalicza opłaty za każde zapytanie do zewnętrznego API. Trzeba jednak zapewnić odpowiedni sprzęt i zaakceptować możliwie niższą jakość.",example:"Firma ma poufny tekst, którego nie chce wysyłać do zewnętrznej usługi. Uruchamia model przez Ollamę na własnej maszynie. Zyskuje kontrolę nad danymi, ale sama odpowiada za pamięć i szybkość sprzętu.",remember:"Lokalnie zyskujesz prywatność i kontrolę, lecz płacisz zasobami własnego komputera.",wrong:{B:"Modele chmurowe mogą oferować wyższą jakość i łatwiejszą skalowalność. Mały model lokalny nie gwarantuje najlepszego wyniku.",C:"Lokalny wariant wymaga przechowania plików modelu na własnym sprzęcie. Brak takiej możliwości przemawia raczej za chmurą.",D:"Lokalny model działa dzięki własnemu RAM-owi lub VRAM-owi. Nie usuwa wymagań sprzętowych, tylko przenosi je na użytkownika."}}},
{n:12,d:"trudne",c:"LLM",p:"Dlaczego ważnej informacji nie warto ukrywać w środku bardzo długiego kontekstu?",o:{A:"Środek kontekstu automatycznie zmienia się w embedding",B:"Model czyta wyłącznie pierwszą wiadomość",C:"Zjawisko lost in the middle sprawia, że model może gorzej wykorzystać informacje ze środka",D:"Każda informacja w środku uruchamia tool calling"},correct:"C",why:"Lost in the middle oznacza, że model może gorzej wykorzystywać informacje umieszczone w środku długiego kontekstu.",lesson:{correct:"Model ma ograniczone okno kontekstowe i nie wykorzystuje każdej pozycji równie dobrze. W bardzo długim tekście informacje ze środka mogą być trudniejsze do zauważenia. To zjawisko nazywa się lost in the middle. Ważne dane warto umieszczać na początku lub końcu albo skracać kontekst.",example:"W trzydziestostronicowej rozmowie adres klienta znajduje się na stronie piętnastej. Model może go przeoczyć podczas odpowiedzi. Po przeniesieniu adresu obok bieżącego pytania łatwiej go wykorzystuje.",remember:"W długim kontekście środek łatwo ginie, więc ważne fakty trzymaj przy brzegach.",wrong:{A:"Embedding jest tworzony przez osobny etap wektoryzacji. Położenie zdania w środku promptu nie zamienia go automatycznie w wektor.",B:"Model może korzystać z wielu wiadomości, nie tylko pierwszej. Problem dotyczy słabszego wykorzystania środka długiego kontekstu.",D:"Tool calling zależy od zadania i decyzji modelu. Samo położenie informacji nie uruchamia narzędzia."}}},
{n:13,d:"łatwe",c:"Narzędzia",p:"Które polecenie pokazuje modele dostępne lokalnie w Ollama?",o:{A:"ollama pull",B:"ollama run",C:"ollama --help-only-models",D:"ollama list"},correct:"D",why:"Polecenie ollama list wyświetla modele dostępne lokalnie.",lesson:{correct:"Ollama ma osobne polecenia dla różnych czynności. List wyświetla modele, które są już dostępne na komputerze. Pull pobiera nowy model, a run go uruchamia. Dzięki list można sprawdzić dokładną nazwę potrzebną w konfiguracji.",example:"Po instalacji wpisujesz ollama list i widzisz pustą listę. Pobierasz Gemmę poleceniem pull. Ponowne list pokazuje gemma3:270m.",remember:"List to spis tego, co już masz lokalnie.",wrong:{A:"Pull rozpoczyna pobieranie wskazanego modelu. Nie służy tylko do wyświetlania lokalnego spisu.",B:"Run otwiera model do rozmowy lub inferencji. Nie jest poleceniem pokazującym całą listę.",C:"Notatki wskazują zwykłe ollama --help do pomocy. Nie podają polecenia --help-only-models jako sposobu listowania."}}},
{n:14,d:"łatwe",c:"Narzędzia",p:"Dlaczego klucza API nie należy zapisywać bezpośrednio w kodzie ani commitować pliku .env?",o:{A:"Ponieważ PromptTemplate przestanie być Runnable",B:"Ponieważ grozi to ujawnieniem sekretu; klucz powinien pozostać w zmiennej środowiskowej",C:"Ponieważ Ollama usunie lokalne modele",D:"Ponieważ temperature wzrośnie automatycznie"},correct:"B",why:"Sekrety powinny pozostawać w zmiennych środowiskowych, ponieważ zapisanie ich w repozytorium grozi ujawnieniem.",lesson:{correct:"Klucz API pozwala korzystać z usługi na Twoim koncie. Jeśli trafi do repozytorium, ktoś inny może go zobaczyć i użyć. Dlatego zapisuje się go w lokalnym pliku .env lub innej zmiennej środowiskowej. Sam plik z sekretem powinien być ignorowany przez Git.",example:"Program potrzebuje klucza do OpenAI. load_dotenv ładuje go do procesu, a kod odczytuje zmienną. Repozytorium zawiera kod, lecz nie zawiera prawdziwej wartości klucza.",remember:"Sekret do środowiska, nigdy do kodu ani commita.",wrong:{A:"PromptTemplate pozostaje Runnable niezależnie od miejsca przechowywania klucza. Problemem jest bezpieczeństwo, a nie składanie łańcucha.",C:"Plik .env nie steruje usuwaniem pobranych modeli Ollamy. Dotyczy przede wszystkim lokalnych sekretów i konfiguracji.",D:"Temperature jest parametrem modelu ustawianym w konfiguracji. Ujawnienie klucza nie zmienia jej automatycznie."}}},
{n:15,d:"średnie",c:"LangChain",p:"Jaki warunek musi spełniać wartość parametru model przekazana do ChatOllama?",o:{A:"Musi zawsze mieć wartość gpt-5",B:"Musi być nazwą pliku z promptem",C:"Musi odpowiadać modelowi dostępnemu w Ollama",D:"Musi być identyczna z nazwą zmiennej środowiskowej API"},correct:"C",why:"Nazwa przekazana do ChatOllama musi odpowiadać modelowi, który jest dostępny w Ollama.",lesson:{correct:"ChatOllama musi wiedzieć, do którego lokalnego modelu wysyłać pytania. Parametr model podaje jego nazwę i wariant. Nazwa powinna odpowiadać temu, co jest dostępne w Ollama. Można ją sprawdzić poleceniem ollama list.",example:"Lista pokazuje gemma3:270m. W ChatOllama ustawiasz model na gemma3:270m. Gdy wpiszesz inną, niedostępną nazwę, lokalny backend nie ma właściwego modelu do użycia.",remember:"Nazwa w ChatOllama musi zgadzać się z nazwą na liście Ollamy.",wrong:{A:"gpt-5 jest przykładem modelu używanego przez klienta OpenAI. ChatOllama może wskazywać lokalną Gemmę lub inny model Ollamy.",B:"Parametr model nie wskazuje pliku z tekstem promptu. Określa model językowy obsługujący generację.",D:"Nazwa zmiennej API i nazwa modelu pełnią inne role. Lokalna Ollama nie wymaga utożsamienia tych dwóch wartości."}}},
{n:16,d:"średnie",c:"LLM",p:"Czym jest structured tool calling?",o:{A:"Zwróceniem przez model strukturalnego żądania z nazwą funkcji i argumentami, które runtime może wykonać",B:"Ręcznym sklejaniem odpowiedzi modelu w f-stringu",C:"Zapisaniem całej historii w jednym chunku",D:"Automatycznym treningiem narzędzia przez LangSmith"},correct:"A",why:"Structured tool calling przekazuje nazwę funkcji i argumenty w formie, którą runtime może bezpośrednio obsłużyć.",lesson:{correct:"Model czasem powinien wykonać działanie zamiast od razu pisać odpowiedź. W structured tool calling zwraca nazwę narzędzia i uporządkowane argumenty. Runtime odczytuje tę strukturę i uruchamia odpowiednią funkcję. Wynik funkcji wraca do modelu, który może przygotować odpowiedź dla człowieka.",example:"Użytkownik pyta o pogodę w Warszawie. Model zwraca wywołanie get_weather z argumentem city równym Warsaw. Program uruchamia funkcję i przekazuje modelowi wynik, na przykład 18 stopni i deszcz.",remember:"Tool calling to prośba modelu o funkcję z konkretnymi argumentami.",wrong:{B:"F-string tylko skleja tekst w Pythonie. Nie jest strukturalnym żądaniem wykonania zewnętrznej funkcji.",C:"Chunking dotyczy dzielenia dokumentów lub kontekstu. Tool calling opisuje akcję i jej argumenty.",D:"LangSmith pomaga śledzić, debugować i oceniać przebiegi. Nie trenuje automatycznie narzędzia w chwili tool callingu."}}},
{n:17,d:"trudne",c:"LangChain",p:"Dlaczego warstwa abstrakcji LangChain zmniejsza zależność aplikacji od jednego dostawcy modelu?",o:{A:"Ponieważ każdy model ma dokładnie takie same możliwości i wymagania",B:"Ponieważ aplikacja korzysta z podobnego interfejsu modelu, więc backend można podmienić bez przepisywania całej logiki",C:"Ponieważ LangChain kopiuje zamknięte modele na lokalny dysk",D:"Ponieważ wszystkie modele są uruchamiane przez ten sam klucz API"},correct:"B",why:"Ujednolicony interfejs modelu oddziela logikę aplikacji od konkretnego backendu.",lesson:{correct:"LangChain daje podobny sposób tworzenia i wywoływania różnych modeli chat. Aplikacja pracuje z obiektem llm, a nie bezpośrednio z każdym API w całej logice. Dzięki temu można podmienić klienta integracji w jednym miejscu. Dostawcy nadal różnią się jakością i konfiguracją, ale reszta przepływu może pozostać podobna.",example:"Pierwsza wersja używa ChatOpenAI, a łańcuch ma postać prompt połączony z llm. Druga wersja tworzy ChatOllama i przypisuje go jako llm. Prompt oraz invoke nie wymagają pełnego przepisania.",remember:"Wspólny interfejs odczepia aplikację od jednego silnika.",wrong:{A:"Modele różnią się jakością, sprzętem i dostępnymi możliwościami. Abstrakcja ujednolica sposób pracy, ale nie czyni modeli identycznymi.",C:"LangChain nie może po prostu skopiować zamkniętego modelu dostawcy. Lokalnie uruchamia się modele, których wagi są dostępne.",D:"Model lokalny może działać bez klucza zewnętrznego API. Różni dostawcy także używają własnych kluczy i konfiguracji."}}},
{n:18,d:"trudne",c:"LLM",p:"Dlaczego jakość retrievera w RAG należy oceniać osobno od jakości generacji?",o:{A:"Ponieważ retriever odpowiada wyłącznie za styl językowy",B:"Ponieważ generator zawsze ignoruje pobrane dokumenty",C:"Ponieważ retriever służy tylko do przechowywania kluczy API",D:"Ponieważ nawet dobry model nie naprawi słabego kontekstu dostarczonego przez retriever"},correct:"D",why:"Nawet dobry generator nie naprawi odpowiedzi, jeśli retriever dostarczy nieistotny lub słaby kontekst.",lesson:{correct:"Retriever wybiera fragmenty dokumentów pasujące do pytania. Model generujący buduje odpowiedź na podstawie tych fragmentów. Jeśli wyszukiwanie poda nieistotny albo urwany tekst, model zaczyna z błędnym materiałem. Dlatego najpierw trzeba sprawdzić trafność wyszukiwania, a osobno jakość napisanej odpowiedzi.",example:"Pytanie dotyczy resetowania hasła, lecz retriever zwraca fragment o płatnościach. Nawet bardzo dobry model nie dostał instrukcji resetu. Poprawa retrievera daje mu właściwy fragment i dopiero wtedy można uczciwie ocenić generację.",remember:"Najlepszy pisarz nie napisze dobrej odpowiedzi z niewłaściwych notatek.",wrong:{A:"Styl językowy jest przede wszystkim częścią generacji. Retriever wybiera treść, która ma trafić do kontekstu.",B:"Generator ma korzystać z pobranych dokumentów jako kontekstu. Problem pojawia się wtedy, gdy dokumenty są źle dobrane, a nie dlatego, że zawsze są ignorowane.",C:"Klucze API przechowuje się w zmiennych środowiskowych. Retriever wyszukuje relewantne fragmenty wiedzy."}}},
{n:19,d:"średnie",c:"LangChain",p:"Który przepływ poprawnie przedstawia lokalne użycie Gemmy 3 z LangChain?",o:{A:"Aplikacja Python → LangChain → ChatOllama → Ollama → Gemma 3",B:"Gemma 3 → Pinecone → Black → aplikacja Python",C:"Aplikacja Python → ChatOpenAI → obowiązkowo OpenAI → Gemma 3 lokalnie",D:"Ollama → PromptTemplate → Git → model bez LangChain"},correct:"A",why:"ChatOllama łączy aplikację LangChain z lokalnym serwerem Ollama obsługującym model Gemma 3.",lesson:{correct:"Kod aplikacji jest napisany w Pythonie i korzysta z LangChain. Obiekt ChatOllama jest integracją zgodną z interfejsem modelu chat. Łączy się z działającą lokalnie Ollamą. Ollama uruchamia wybrany model, na przykład Gemmę 3.",example:"Aplikacja wywołuje metodę invoke na łańcuchu. LangChain przekazuje przygotowaną wiadomość przez ChatOllama do serwera Ollama. Gemma 3 generuje tekst, który wraca tą samą drogą do aplikacji.",remember:"Python pyta przez ChatOllama, Ollama uruchamia Gemmę.",wrong:{B:"Pinecone jest bazą wektorową, a Black formatuje kod. Nie tworzą ścieżki do lokalnej inferencji Gemmy.",C:"ChatOpenAI jest klientem usługi OpenAI. Do lokalnej Ollamy notatki wskazują osobną integrację ChatOllama.",D:"Git służy do kontroli wersji i nie pośredniczy w generowaniu. PromptTemplate także nie zastępuje warstwy modelu."}}},
{n:20,d:"średnie",c:"LangGraph",p:"Jakie trzy elementy opisują graf stanów w LangGraph?",o:{A:"Prompt, temperatura i klucz API",B:"Chunk, embedding i baza wektorowa",C:"Węzły przetwarzające stan, krawędzie wyznaczające przejścia oraz współdzielony stan",D:"Model lokalny, model chmurowy i menedżer pakietów"},correct:"C",why:"Graf LangGraph składa się z węzłów, krawędzi i współdzielonego stanu przekazywanego między węzłami.",lesson:{correct:"LangGraph opisuje przepływ jako graf stanów. Węzeł jest funkcją, która wykonuje krok i przetwarza stan. Krawędź wskazuje następny krok i może być warunkowa. Stan przechowuje wspólne dane, na przykład historię wiadomości i wyniki pośrednie.",example:"Pierwszy węzeł pyta model, czy potrzebne jest narzędzie. Krawędź warunkowa prowadzi albo do węzła narzędzia, albo do końca. Stan niesie pytanie użytkownika oraz otrzymane wyniki przez cały przepływ.",remember:"LangGraph to węzły, drogi między nimi i plecak ze wspólnym stanem.",wrong:{A:"Prompt, temperatura i klucz są elementami konfiguracji aplikacji LLM. Nie tworzą definicji grafu stanów.",B:"Chunk, embedding i baza wektorowa należą do typowego pipeline'u RAG. LangGraph opisuje sterowanie przepływem.",D:"Wybór modelu i menedżera pakietów nie definiuje grafu. Graf może działać z różnymi modelami, lecz potrzebuje węzłów, krawędzi i stanu."}}}
];
const quiz=document.querySelector("#quiz"),count=document.querySelector("#count"),results=document.querySelector("#results");
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function render(){
quiz.innerHTML=Q.map(q=>`<article class="card" id="card${q.n}"><div class="meta"><span class="tag">#${q.n}</span><span class="tag">${q.d}</span><span class="tag">${q.c}</span></div><p class="prompt">${esc(q.p)}</p><div class="options">${["A","B","C","D"].map(l=>`<label class="opt"><input type="radio" name="q${q.n}" value="${l}"><span class="letter">${l})</span><span>${esc(q.o[l])}</span></label>`).join("")}<label class="opt idk"><input type="radio" name="q${q.n}" value="?"><span class="letter">?</span><span><strong>Nie mam pojęcia</strong> — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność: <select name="c${q.n}"><option value="">—</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join("")}</select></label><div class="feedback" id="feedback${q.n}" hidden></div></article>`).join("");
}
function collect(){
return Q.map(q=>({n:q.n,answer:quiz.querySelector(`input[name=q${q.n}]:checked`)?.value||"",confidence:quiz.querySelector(`select[name=c${q.n}]`).value||"—"}));
}
function lesson(q,mode,picked){
const l=q.lesson,parts=[];
if(mode==="bad"){parts.push(`<h3>BŁĄD · Twoja: ${picked} · Poprawna: ${q.correct}</h3><h4>Twoja odpowiedź</h4><p>${esc(l.wrong[picked])}</p>`);}
if(mode==="idk"){parts.push(`<h3>NIE WIEM · Poprawna: ${q.correct}</h3><p>Bez zgadywania — oto wyjaśnienie.</p>`);}
parts.push(`<h4>Poprawna myśl</h4><p>${esc(l.correct)}</p><h4>Przykład</h4><p>${esc(l.example)}</p><h4>Zapamiętaj</h4><p class="remember">${esc(l.remember)}</p>`);
return parts.join("");
}
let last=null;
function grade(){
const rows=collect(),missing=rows.filter(r=>!r.answer);
if(missing.length){alert("Brak odpowiedzi w pytaniach: "+missing.map(r=>r.n).join(", "));return null;}
let ok=0,idk=0;
const detail=rows.map(r=>{
const q=Q[r.n-1],isIdk=r.answer==="?",isOk=r.answer===q.correct;
if(isOk)ok++;if(isIdk)idk++;
const card=document.querySelector(`#card${r.n}`),box=document.querySelector(`#feedback${r.n}`);
card.className=`card ${isOk?"ok":isIdk?"learn":"bad"}`;box.hidden=false;
if(isOk){box.className="feedback okbox";box.innerHTML=`<h3>OK</h3><p>${esc(q.why)}</p>`;}
else if(isIdk){box.className="feedback learnbox";box.innerHTML=lesson(q,"idk",r.answer);}
else{box.className="feedback badbox";box.innerHTML=lesson(q,"bad",r.answer);}
return {...r,correct:q.correct,result:isOk?"OK":isIdk?"NIE WIEM":"BŁĄD",why:q.why,isOk};
});
const pct=Math.round(ok/Q.length*100);
document.querySelector("#score").textContent=`Wynik: ${ok}/20`;document.querySelector("#percent").textContent=`Skuteczność: ${pct}%`;document.querySelector("#idkCount").textContent=`Nie wiem: ${idk}`;document.querySelector("#status").textContent="Sprawdzono";results.classList.add("show");last={ok,idk,pct,detail};results.scrollIntoView({behavior:"smooth"});return last;
}
function download(name,text){
const a=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type:"text/markdown;charset=utf-8"}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);
}
function myAnswers(rows){
return [`# Moje odpowiedzi – ${DATE}`,"","| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |","|---|-----------------------------|---------------|-------|",...rows.map(r=>`| ${r.n} | ${r.answer} | ${r.confidence==="—"?"":r.confidence} | |`),"","## Notatki",""].join("\n");
}
function resultMd(g){
const strong=g.detail.filter(r=>r.isOk),review=g.detail.filter(r=>!r.isOk);
return [`# Wynik quizu — ${DATE}`,"","## Wynik","",`- Poprawne odpowiedzi: ${g.ok}/20`,`- Skuteczność: ${g.pct}%`,`- Nie wiem: ${g.idk}`,"","## Szczegóły","","| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |","|---|---|---|---|---|---|",...g.detail.map(r=>`| ${r.n} | ${r.answer} | ${r.correct} | ${r.result} | ${r.confidence} | ${r.why} |`),"","## Mocne strony","",strong.length?`- Poprawnie rozwiązane pytania: ${strong.map(r=>r.n).join(", ")}.`:"- Brak poprawnych odpowiedzi w tej próbie.","","## Obszary do powtórki","",...(review.length?review.map(r=>`- Pytanie ${r.n} (${r.result}): ${r.why}`):["- Brak — wszystkie odpowiedzi są poprawne."]),""].join("\n");
}
quiz.addEventListener("change",()=>count.textContent=collect().filter(r=>r.answer).length);
document.querySelector("#check").addEventListener("click",grade);
document.querySelector("#reset").addEventListener("click",()=>{quiz.reset();last=null;results.classList.remove("show");document.querySelector("#status").textContent="W trakcie";Q.forEach(q=>{const c=document.querySelector(`#card${q.n}`),f=document.querySelector(`#feedback${q.n}`);c.className="card";f.hidden=true;f.innerHTML="";});count.textContent="0";});
document.querySelector("#downloadAnswers").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_my_answers.md`,myAnswers(g.detail));});
document.querySelector("#downloadResults").addEventListener("click",()=>{const g=last||grade();if(g)download(`${DATE}_results.md`,resultMd(g));});
render();
</script>
